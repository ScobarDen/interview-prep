<script>
const L = {
  ljs: (p, t) => [t, 'https://learn.javascript.ru/' + p],
  mdn: (p, t) => [t, 'https://developer.mozilla.org/' + p],
};

const EXPRESS = {
  id: 'express',
  title: 'Экспресс-пакет',
  kicker: 'Этап 1 · страховочная сетка',
  intro: 'Топ вопросов, которые прилетают на fullstack-собесе почти всегда. Сначала добейся, чтобы «30 секунд» говорились без запинки, «глубже» — когда первое уже отскакивает.',
  sections: [
    { title: 'JavaScript', cards: [
      { id: 'equality', q: 'Чем == отличается от ===? Какие типы есть в JS?', tags: ['must'],
        short: `<p><code>===</code> сравнивает без приведения типов, <code>==</code> сначала приводит операнды (abstract equality). В коде — всегда <code>===</code>, единственное разумное исключение — <code>x == null</code>, который ловит и <code>null</code>, и <code>undefined</code>.</p><p>Типов 8: 7 примитивов (<code>string</code>, <code>number</code>, <code>bigint</code>, <code>boolean</code>, <code>undefined</code>, <code>null</code>, <code>symbol</code>) и <code>object</code>. Примитивы иммутабельны и сравниваются по значению, объекты — по ссылке.</p>`,
        deep: `<h5>Как работает ==</h5><ul><li><code>null == undefined</code> → true, и больше они ничему не равны.</li><li>Число и строка → строка приводится к числу.</li><li>Boolean → сначала в число (true → 1).</li><li>Объект → в примитив через <code>Symbol.toPrimitive</code> / <code>valueOf</code> / <code>toString</code>.</li></ul><p><code>NaN</code> не равен ничему, даже себе — проверяй <code>Number.isNaN</code>. <code>Object.is</code> — «честное» равенство: <code>Object.is(NaN, NaN)</code> → true, <code>Object.is(0, -0)</code> → false.</p><p><code>typeof null === 'object'</code> — исторический баг, а <code>typeof function(){}</code> → <code>'function'</code>, хотя функция — это объект.</p>`,
        lang: 'js',
        code: `[] == false        // true: [] -> '' -> 0, false -> 0
[] == ![]          // true (сюрприз для интервьюера)
null == 0          // false
null >= 0          // true: сравнение приводит null к 0
NaN === NaN        // false
Object.is(NaN, NaN) // true
typeof null        // 'object'
Array.isArray([])  // true — так проверяют массив`,
        traps: ['Чем <code>null</code> отличается от <code>undefined</code>? (null — «пусто намеренно», undefined — «значение не задано»)', 'Как проверить, что значение — массив? Почему не <code>typeof</code>?', 'Что такое «falsy»: <code>false, 0, -0, 0n, "", null, undefined, NaN</code>'],
        links: [L.ljs('types', 'learn.javascript.ru: типы'), L.ljs('comparison', 'Операторы сравнения')] },

      { id: 'closure', q: 'Что такое замыкание? Где ты их используешь?', tags: ['must'],
        short: `<p>Замыкание — это функция вместе с лексическим окружением, в котором она создана. Функция «помнит» переменные внешней области даже после того, как внешняя функция завершилась.</p><p>Применения: приватное состояние, фабрики функций, мемоизация, <code>debounce</code>/<code>throttle</code>, обработчики с параметрами, и вообще все хуки React построены на замыканиях.</p>`,
        deep: `<p>Каждый вызов функции создаёт новое Lexical Environment. Вложенная функция хранит ссылку на него в скрытом свойстве <code>[[Environment]]</code>. Пока на окружение есть ссылка, его переменные живут — это и сила, и источник утечек (замкнул огромный объект в долгоживущем колбэке).</p><p><b>Классика с циклом:</b> у <code>var</code> одна переменная на весь цикл, у <code>let</code> — новая привязка на каждую итерацию.</p><p><b>Stale closure в React:</b> колбэк в <code>useEffect</code> / <code>setInterval</code> видит state того рендера, где он создан. Лечится правильными deps, функциональным <code>setState(prev =&gt; …)</code> или <code>useRef</code>.</p>`,
        lang: 'js',
        code: `function counter() {
  let count = 0;
  return () => ++count;
}
const next = counter();
next(); // 1
next(); // 2

for (var i = 0; i < 3; i++) setTimeout(() => console.log(i)); // 3 3 3
for (let j = 0; j < 3; j++) setTimeout(() => console.log(j)); // 0 1 2`,
        traps: ['«Напиши debounce» — прямое продолжение этого вопроса (будет в Live coding)', 'Почему интервал в <code>useEffect</code> без deps показывает старый счётчик?', 'Можно ли через замыкание сделать приватное поле? А чем это хуже <code>#private</code>?'],
        links: [L.ljs('closure', 'learn.javascript.ru: замыкание')] },

      { id: 'this', q: 'Как определяется this? Чем стрелочная функция отличается от обычной?', tags: ['must'],
        short: `<p><code>this</code> определяется в момент <b>вызова</b>, а не объявления. Приоритет: <code>new</code> → явная привязка (<code>call</code>/<code>apply</code>/<code>bind</code>) → вызов как метода <code>obj.f()</code> → обычный вызов (<code>undefined</code> в strict mode, иначе <code>globalThis</code>).</p><p>У стрелочной функции своего <code>this</code> нет — она берёт его из внешней области в момент создания. Ещё у неё нет <code>arguments</code>, и её нельзя вызвать через <code>new</code>.</p>`,
        deep: `<p><b>Потеря контекста:</b> <code>const f = obj.method; f()</code> или передача метода колбэком (<code>setTimeout(obj.method)</code>, <code>onClick={store.save}</code>) — <code>this</code> теряется.</p><p>Решения: <code>bind</code>, обёртка-стрелка, поле класса-стрелка <code>save = () =&gt; {}</code>. В MobX <code>makeAutoObservable(this, {}, { autoBind: true })</code> привязывает экшены.</p><p><code>bind</code> возвращает новую функцию, повторный <code>bind</code> её уже не перепривяжет. В DOM-обработчике, объявленном через <code>function</code>, <code>this</code> = <code>event.currentTarget</code>.</p>`,
        lang: 'js',
        code: `'use strict';
const user = {
  name: 'Denis',
  hi() { return this.name; },
  hiArrow: () => this?.name,
};
user.hi();              // 'Denis'
const f = user.hi;
f();                    // TypeError: в strict mode this === undefined, контекст потерян
user.hiArrow();         // undefined — this из внешней области
f.call({ name: 'X' });  // 'X'`,
        traps: ['Что выведет <code>setTimeout(user.hi, 0)</code>?', 'Реализуй <code>bind</code> руками', 'Почему методы класса, переданные в onClick, ломаются, а поля-стрелки — нет?'],
        links: [L.ljs('object-methods', 'Методы объекта, this'), L.ljs('arrow-functions', 'Стрелочные функции')] },

      { id: 'proto', q: 'Как работает прототипное наследование? Что такое class под капотом?', tags: ['must'],
        short: `<p>У каждого объекта есть скрытая ссылка <code>[[Prototype]]</code> (читается через <code>Object.getPrototypeOf</code>). Если свойства нет в самом объекте, поиск идёт по цепочке прототипов, пока не дойдёт до <code>null</code>.</p><p><code>class</code> — синтаксический сахар над прототипами: методы лежат в <code>Class.prototype</code>, <code>extends</code> связывает цепочку прототипов.</p>`,
        deep: `<p><code>F.prototype</code> — это обычное свойство функции-конструктора. Оно становится <code>[[Prototype]]</code> для объектов, созданных через <code>new F()</code>.</p><p><b>Что делает new:</b> создаёт объект с прототипом <code>F.prototype</code> → вызывает <code>F</code> с этим <code>this</code> → возвращает объект (если конструктор не вернул свой объект).</p><p><code>instanceof</code> проходит по цепочке и ищет <code>F.prototype</code>. В наследнике <code>super()</code> обязателен до обращения к <code>this</code>. <code>Object.hasOwn(o, k)</code> — своё свойство, <code>k in o</code> — с учётом цепочки.</p>`,
        lang: 'js',
        code: `class Animal { speak() { return 'generic'; } }
class Dog extends Animal { speak() { return 'woof'; } }
const d = new Dog();

Object.getPrototypeOf(d) === Dog.prototype;                // true
Object.getPrototypeOf(Dog.prototype) === Animal.prototype; // true
d instanceof Animal;                                       // true
Object.hasOwn(d, 'speak');                                 // false — лежит в прототипе`,
        traps: ['Разница <code>__proto__</code> и <code>prototype</code>', 'Как создать объект без прототипа? (<code>Object.create(null)</code> — словарь без мусора)', 'Composition over inheritance — когда наследование оправдано?'],
        links: [L.ljs('prototype-inheritance', 'Прототипное наследование')] },

      { id: 'eventloop', q: 'Как работает event loop? Что выведет этот код?', tags: ['must'],
        short: `<p>JS однопоточный, у него один call stack. Асинхронные API хоста (таймеры, сеть, DOM-события) складывают колбэки в очереди.</p><p>Цикл: выполнить синхронный код → опустошить <b>всю</b> очередь микрозадач (<code>Promise.then</code>, <code>await</code>, <code>queueMicrotask</code>, <code>MutationObserver</code>) → браузер может отрисовать кадр → взять <b>одну</b> макрозадачу (<code>setTimeout</code>, I/O, событие) → снова все микрозадачи.</p>`,
        deep: `<p>Код после <code>await</code> — это продолжение, которое уходит в микрозадачу. Бесконечно порождающие себя микрозадачи заблокируют рендер навсегда, а цепочка таймеров — нет.</p><p><code>requestAnimationFrame</code> вызывается перед отрисовкой кадра. <code>setTimeout(fn, 0)</code> не означает «сразу»: минимум ~0–4 мс, плюс ожидание своей очереди.</p><p>Синхронная задача дольше 50 мс — это long task: страница не отвечает, растёт INP. Разбивай работу на чанки (<code>scheduler.yield()</code>, <code>setTimeout</code>) или выноси её в Web Worker.</p>`,
        lang: 'js',
        code: `console.log(1);
setTimeout(() => console.log(2));
Promise.resolve().then(() => console.log(3));
(async () => {
  console.log(4);
  await null;
  console.log(5);
})();
queueMicrotask(() => console.log(6));
console.log(7);

// 1 4 7 3 5 6 2
// синхронно: 1, 4 (async-функция до await синхронна), 7
// микрозадачи по порядку постановки: 3, 5, 6
// макрозадача: 2`,
        traps: ['Где «живёт» setTimeout? (в хост-среде — браузере/Node, а не в движке V8)', 'Чем отличается event loop в Node? (фазы, <code>process.nextTick</code> — см. Node)', 'Почему тяжёлый цикл замораживает анимацию, а CSS-анимация на transform — нет? (композитор в отдельном потоке)'],
        links: [L.ljs('event-loop', 'Событийный цикл'), ['Jake Archibald: In The Loop (видео)', 'https://www.youtube.com/watch?v=cCOL7MC4Pl0']] },

      { id: 'promises', q: 'Promise и async/await. Чем отличаются all, allSettled, race, any?', tags: ['must'],
        short: `<p>Promise — объект будущего результата с состояниями <code>pending</code> → <code>fulfilled</code> или <code>rejected</code>. Состояние меняется один раз. <code>async/await</code> — синтаксис поверх промисов: <code>async</code>-функция всегда возвращает промис, <code>await</code> ждёт и разворачивает значение.</p><ul><li><code>all</code> — все успешные или первая ошибка</li><li><code>allSettled</code> — дождаться всех, без падения</li><li><code>race</code> — первый завершившийся (успех или ошибка)</li><li><code>any</code> — первый успешный</li></ul>`,
        deep: `<p><code>then</code> возвращает новый промис, поэтому промисы строятся в цепочки. Ошибка летит до ближайшего <code>catch</code>. Executor в <code>new Promise(fn)</code> выполняется синхронно.</p><p><b>Параллельно или последовательно:</b> <code>await</code> в цикле выполняет запросы по очереди, <code>Promise.all(arr.map(...))</code> — параллельно. Для ограничения параллелизма нужен пул (p-limit).</p><p><b>Отмена</b> — через <code>AbortController</code>. <code>forEach(async ...)</code> ничего не ждёт: используй <code>for...of</code> или <code>Promise.all</code>.</p>`,
        lang: 'js',
        code: `// последовательно: ~N секунд
for (const id of ids) await load(id);

// параллельно, падает на первой ошибке
const users = await Promise.all(ids.map(load));

// не падать на частичных ошибках
const res = await Promise.allSettled(ids.map(load));
const failed = res.filter(r => r.status === 'rejected');

// таймаут через race
const timeout = (ms) => new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms));
await Promise.race([fetch(url), timeout(5000)]);

// отмена
const ctrl = new AbortController();
fetch(url, { signal: ctrl.signal });
ctrl.abort();`,
        traps: ['Напиши полифилл <code>Promise.all</code> (Live coding)', 'Что будет с необработанным rejected-промисом? (<code>unhandledrejection</code>, в Node процесс падает)', 'Почему <code>return await</code> внутри try — не лишний?'],
        links: [L.ljs('async-await', 'Async/await'), L.ljs('promise-api', 'Promise API')] },

      { id: 'scope', q: 'var, let, const, hoisting и TDZ', tags: ['must'],
        short: `<p><code>var</code> — область видимости функции, всплывает со значением <code>undefined</code>, можно переобъявить. <code>let</code>/<code>const</code> — блочная область. Они тоже всплывают, но до строки объявления находятся в TDZ (temporal dead zone), и обращение даёт <code>ReferenceError</code>.</p><p><code>const</code> запрещает переприсваивание, но не мутацию объекта. Function declaration всплывает целиком, function expression — нет.</p>`,
        lang: 'js',
        code: `console.log(a); // undefined
var a = 1;

console.log(b); // ReferenceError (TDZ)
let b = 2;

const obj = { x: 1 };
obj.x = 2;      // ок
obj = {};       // TypeError

hello();        // работает
function hello() {}`,
        traps: ['<code>Object.freeze</code> — неглубокий: вложенные объекты остаются мутабельными'],
        links: [L.ljs('var', 'Устаревшее ключевое слово var')] },

      { id: 'copy', q: 'Как скопировать объект? Shallow vs deep copy', tags: ['must'],
        short: `<p>Объекты хранятся по ссылке. <b>Поверхностная</b> копия (<code>{...obj}</code>, <code>Object.assign</code>, <code>arr.slice()</code>) копирует только верхний уровень: вложенные объекты остаются общими.</p><p><b>Глубокая</b> копия — <code>structuredClone</code>. Он понимает Date, Map, Set и циклические ссылки, но не копирует функции, DOM-узлы и прототипы классов. Трюк <code>JSON.parse(JSON.stringify(x))</code> теряет <code>undefined</code> и функции, превращает Date в строку и падает на циклах.</p>`,
        lang: 'js',
        code: `function deepClone(value, seen = new WeakMap()) {
  if (value === null || typeof value !== 'object') return value;
  if (seen.has(value)) return seen.get(value);
  if (value instanceof Date) return new Date(value);
  const copy = Array.isArray(value) ? [] : Object.create(Object.getPrototypeOf(value));
  seen.set(value, copy);
  for (const key of Reflect.ownKeys(value)) copy[key] = deepClone(value[key], seen);
  return copy;
}`,
        traps: ['Зачем в deepClone WeakMap? (циклы и общие ссылки)', 'Почему для иммутабельных апдейтов в React достаточно поверхностной копии изменённой ветки?'],
        links: [L.mdn('en-US/docs/Web/API/Window/structuredClone', 'MDN: structuredClone')] },

      { id: 'gc', q: 'Как работает сборщик мусора? Какие бывают утечки памяти?', tags: ['must', 'senior'],
        short: `<p>GC работает по принципу mark-and-sweep: от корней (глобальные объекты, текущий стек) помечается всё достижимое, остальное удаляется. Утечка — это объект, который уже не нужен, но всё ещё достижим.</p><p>Типичные утечки: забытые подписки и <code>setInterval</code>, слушатели на <code>window</code> без снятия, глобальные кэши и <code>Map</code> без очистки, замыкания на большие объекты, отсоединённые от документа DOM-узлы, на которые осталась ссылка.</p>`,
        deep: `<p>V8 использует поколенческую сборку: молодое поколение собирается часто и дёшево, старое — реже. <code>WeakMap</code>/<code>WeakSet</code>/<code>WeakRef</code> не удерживают ключ от сборки.</p><p><b>Как искать утечку:</b> DevTools → Memory → heap snapshot до и после действия, сравнение снимков (Comparison), Allocation timeline, поиск Detached-элементов.</p><p>В React источник утечек — пропущенный cleanup в <code>useEffect</code>. В MobX — не вызванный disposer у <code>reaction</code>/<code>autorun</code>.</p>`,
        mine: `<p>В MobX <code>reaction</code>, <code>autorun</code> и <code>when</code> возвращают disposer. Покажи, что знаешь, где его вызывать: в cleanup эффекта или в методе <code>dispose()</code> стора.</p>`,
        links: [L.ljs('garbage-collection', 'Сборка мусора'), ['Chrome DevTools: Memory', 'https://developer.chrome.com/docs/devtools/memory-problems']] },

      { id: 'modules', q: 'ES Modules vs CommonJS. Как работает tree shaking?', tags: ['must'],
        short: `<p><b>CommonJS</b> (<code>require</code>/<code>module.exports</code>) — синхронный и динамический, экспорт копируется по значению. Исторически это формат Node.</p><p><b>ESM</b> (<code>import</code>/<code>export</code>) — стандарт языка. Он статически анализируем, поэтому работает tree shaking. Даёт live bindings, асинхронную загрузку и top-level await. Динамический <code>import()</code> — основа code splitting.</p>`,
        deep: `<p>Tree shaking — сборщик выкидывает неиспользуемые экспорты, потому что граф импортов известен до выполнения. Ломается от CJS, от side effects при импорте и от реэкспорта «всего». Поле <code>"sideEffects": false</code> в package.json подсказывает сборщику, что модули можно выкидывать.</p><p>Поле <code>exports</code> в package.json задаёт публичные точки входа пакета (subpath exports) и условия <code>import</code>/<code>require</code>/<code>types</code>.</p>`,
        mine: `<p>У ui-baza несколько точек входа: <code>.</code>, <code>./css</code>, <code>./bento</code>. Ноль runtime-зависимостей, React 19 — peer dependency. Будь готов объяснить, почему React в peer, а не в dependencies: иначе в приложении окажутся два React и сломаются хуки.</p>`,
        links: [L.ljs('modules-intro', 'Модули, введение'), ['Node: package exports', 'https://nodejs.org/api/packages.html#exports']] },
    ]},

    { title: 'TypeScript', cards: [
      { id: 'ts-interface', q: 'interface или type — в чём разница?', tags: ['must'],
        short: `<p>Оба описывают форму объекта. <b>interface</b> расширяется через <code>extends</code> и поддерживает declaration merging: можно дописать его в другом месте, так расширяют глобальные и библиотечные типы. Описывает только объектные типы.</p><p><b>type</b> — алиас для чего угодно: union, intersection, кортежей, mapped и conditional типов. На практике: interface для публичных контрактов (props, DTO), type — для union и вычисляемых типов. Главное — единообразие в проекте.</p>`,
        traps: ['Что будет при конфликте свойств в <code>&amp;</code> и в <code>extends</code>? (в intersection — тип <code>never</code>, в extends — ошибка компиляции)', 'Можно ли implements у type? (да, если это объектный тип)'],
        links: [['TS Handbook: Everyday Types', 'https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#differences-between-type-aliases-and-interfaces']] },

      { id: 'ts-generics', q: 'Что такое generics и зачем ограничения extends?', tags: ['must'],
        short: `<p>Generic — параметр типа. Функция или тип работает с любым <code>T</code> и при этом сохраняет связь между входом и выходом. Ограничение <code>T extends X</code> сужает допустимые типы, <code>keyof</code> даёт union ключей. Тип обычно выводится из аргументов сам.</p>`,
        lang: 'ts',
        code: `function getProp<T, K extends keyof T>(obj: T, key: K): T[K] {
  return obj[key];
}
getProp({ id: 1, name: 'a' }, 'name'); // string
getProp({ id: 1 }, 'foo');             // ошибка компиляции

type ApiResponse<T> = { data: T; error: string | null };

function first<T>(arr: readonly T[]): T | undefined {
  return arr[0];
}`,
        mine: `<p>Базовый стор таблиц, от которого наследуются конкретные сторы, — естественное место для generic вроде <code>TableStore&lt;Row, Filters&gt;</code>. Вспомни, как он типизирован у тебя: могут попросить набросать сигнатуру.</p>`,
        links: [['TS Handbook: Generics', 'https://www.typescriptlang.org/docs/handbook/2/generics.html']] },

      { id: 'ts-unknown', q: 'any, unknown, never — чем отличаются?', tags: ['must'],
        short: `<p><b>any</b> выключает проверку типов и «заражает» всё, к чему прикоснётся. <b>unknown</b> — «что угодно, но сначала проверь»: использовать значение без сужения типа нельзя. <b>never</b> — значения не существует: функция бросает исключение или не завершается, все варианты union исчерпаны.</p><p>Для внешних данных (ответ API, <code>JSON.parse</code>, <code>catch (e)</code>) — <code>unknown</code> плюс валидация (zod, valibot).</p>`,
        lang: 'ts',
        code: `type Shape =
  | { kind: 'circle'; r: number }
  | { kind: 'square'; a: number };

function area(s: Shape): number {
  switch (s.kind) {
    case 'circle': return Math.PI * s.r ** 2;
    case 'square': return s.a ** 2;
    default: {
      const exhaustive: never = s; // добавят 'triangle' — здесь упадёт компиляция
      return exhaustive;
    }
  }
}`,
        traps: ['Что такое exhaustive check и зачем он нужен', '<code>as</code> vs <code>satisfies</code>: satisfies проверяет соответствие, не теряя выведенный тип'] },

      { id: 'ts-utility', q: 'Utility types и сужение типов (narrowing)', tags: ['must', 'senior'],
        short: `<p><b>Utility types:</b> <code>Partial</code>, <code>Required</code>, <code>Readonly</code>, <code>Pick</code>, <code>Omit</code>, <code>Record</code>, <code>ReturnType</code>, <code>Parameters</code>, <code>Awaited</code>, <code>NonNullable</code>, <code>Extract</code>/<code>Exclude</code>.</p><p><b>Narrowing:</b> <code>typeof</code>, <code>instanceof</code>, <code>in</code>, discriminated union (общее литеральное поле <code>kind</code>), пользовательские type guards (<code>x is T</code>) и assertion functions (<code>asserts x is T</code>).</p>`,
        deep: `<p>Под капотом это mapped types <code>{ [K in keyof T]: … }</code> и conditional types <code>T extends U ? X : Y</code> с <code>infer</code>. На senior-собесе любят попросить реализовать <code>Partial</code> или <code>ReturnType</code> руками.</p><p>Conditional types дистрибутивны по union: <code>Exclude&lt;'a' | 'b', 'a'&gt;</code> → <code>'b'</code>.</p>`,
        lang: 'ts',
        code: `type MyPartial<T> = { [K in keyof T]?: T[K] };
type MyReturnType<F> = F extends (...args: any[]) => infer R ? R : never;
type MyExclude<T, U> = T extends U ? never : T;

function isUser(x: unknown): x is User {
  return typeof x === 'object' && x !== null && 'id' in x;
}`,
        traps: ['enum vs union строковых литералов — почему многие запрещают enum (рантайм-код, сюрпризы с числовыми enum)', 'Что такое variance? (ковариантность массивов, bivariance параметров методов)'],
        links: [['TS: Utility Types', 'https://www.typescriptlang.org/docs/handbook/utility-types.html'], ['TS: Narrowing', 'https://www.typescriptlang.org/docs/handbook/2/narrowing.html']] },
    ]},

    { title: 'Браузер', cards: [
      { id: 'crp', q: 'Как браузер рендерит страницу? Что такое critical rendering path?', tags: ['must'],
        short: `<p>HTML → DOM, CSS → CSSOM, вместе они дают render tree → <b>layout</b> (геометрия) → <b>paint</b> (пиксели по слоям) → <b>composite</b> (сборка слоёв, часто на GPU).</p><p>CSS блокирует рендер, синхронный <code>&lt;script&gt;</code> блокирует парсинг HTML. <code>defer</code> — грузится параллельно и выполняется после парсинга, по порядку. <code>async</code> — выполняется, как только загрузился, порядок не гарантирован. <code>type="module"</code> по умолчанию ведёт себя как defer.</p>`,
        deep: `<p>Ускорение первого экрана: критический CSS инлайном, <code>preload</code> для шрифтов и героя, <code>preconnect</code> к сторонним origin, меньше блокирующего JS, SSR, чтобы HTML пришёл уже с контентом.</p>`,
        traps: ['Почему скрипты раньше ставили в конец body?', 'Чем preload отличается от prefetch? (нужно сейчас vs понадобится на следующей странице)'],
        links: [['web.dev: Critical rendering path', 'https://web.dev/articles/critical-rendering-path']] },

      { id: 'reflow', q: 'Reflow и repaint. Что такое layout thrashing?', tags: ['must'],
        short: `<p><b>Reflow</b> (layout) — пересчёт геометрии. Это дорого, может зацепить каскадом всё дерево. <b>Repaint</b> — перерисовка без смены геометрии (цвет, тень). <b>Composite-only</b> свойства — <code>transform</code> и <code>opacity</code>: не трогают layout и paint, поэтому анимировать нужно их.</p><p><b>Layout thrashing</b> — когда в цикле чередуются чтение геометрии (<code>offsetHeight</code>, <code>getBoundingClientRect</code>) и запись стилей. Браузер вынужден делать синхронный layout на каждой итерации.</p>`,
        lang: 'js',
        code: `// плохо: read/write вперемешку — reflow на каждой итерации
items.forEach(el => { el.style.width = box.offsetWidth + 'px'; });

// хорошо: сначала все чтения, потом все записи
const w = box.offsetWidth;
items.forEach(el => { el.style.width = w + 'px'; });`,
        traps: ['Что делает <code>will-change</code> и почему его нельзя вешать везде (лишние слои, память)', 'Зачем <code>content-visibility: auto</code>'] },

      { id: 'events', q: 'Всплытие и погружение событий. Что такое делегирование?', tags: ['must'],
        short: `<p>Фазы события: capturing (сверху вниз) → target → bubbling (снизу вверх). <code>event.target</code> — элемент, где событие произошло, <code>currentTarget</code> — элемент, на котором висит обработчик.</p><p><b>Делегирование</b> — один обработчик на родителе вместо сотни на детях, нужный элемент находят через <code>target.closest()</code>. <code>stopPropagation</code> останавливает всплытие, <code>preventDefault</code> отменяет действие браузера по умолчанию.</p>`,
        deep: `<p>Опции <code>addEventListener</code>: <code>capture</code>, <code>once</code>, <code>passive</code> (для scroll/touch: обещаешь не звать preventDefault, скролл не блокируется), <code>signal</code> (снять слушатель через AbortController).</p><p>Не всплывают <code>focus</code>/<code>blur</code> (всплывающие аналоги — <code>focusin</code>/<code>focusout</code>) и <code>mouseenter</code>/<code>mouseleave</code>. React использует синтетические события и с 17-й версии делегирует их на корневой контейнер.</p>`,
        lang: 'js',
        code: `list.addEventListener('click', (e) => {
  const item = e.target.closest('[data-id]');
  if (!item || !list.contains(item)) return;
  select(item.dataset.id);
});`,
        links: [L.ljs('bubbling-and-capturing', 'Всплытие и погружение'), L.ljs('event-delegation', 'Делегирование')] },

      { id: 'storage', q: 'cookie, localStorage, sessionStorage, IndexedDB — где что хранить?', tags: ['must'],
        short: `<ul><li><b>cookie</b> — маленькие (~4 КБ) и автоматически уходят на сервер с каждым запросом. Для сессии и токена авторизации, с флагом <b>HttpOnly</b>: JS её не прочитает, значит, через XSS её не украсть.</li><li><b>localStorage</b> — строки до ~5 МБ, живут, пока не удалишь. Для настроек интерфейса (тема, язык). Доступен любому скрипту на странице, поэтому секреты там не держат.</li><li><b>sessionStorage</b> — то же, но живёт только в одной вкладке, пока она открыта. Для черновика формы или шага мастера.</li><li><b>IndexedDB</b> — настоящая асинхронная база в браузере: большие объёмы, объекты, файлы, офлайн-данные.</li></ul>`,
        deep: `<div class="tbl"><table><tr><th></th><th>Объём</th><th>Жизнь</th><th>Особенности</th></tr><tr><td>cookie</td><td>~4 КБ</td><td>до expires/max-age</td><td>Уходит с каждым запросом; флаги HttpOnly, Secure, SameSite</td></tr><tr><td>localStorage</td><td>~5–10 МБ</td><td>навсегда</td><td>Синхронный API, общий для всех вкладок origin, только строки</td></tr><tr><td>sessionStorage</td><td>~5 МБ</td><td>пока жива вкладка</td><td>Своё хранилище у каждой вкладки</td></tr><tr><td>IndexedDB</td><td>сотни МБ+</td><td>навсегда</td><td>Асинхронный, транзакции, индексы, хранит объекты и Blob</td></tr><tr><td>Cache API</td><td>квота origin</td><td>навсегда</td><td>Пары запрос/ответ, для Service Worker и офлайна</td></tr></table></div><p>Событие <code>storage</code> позволяет синхронизировать вкладки.</p>` },
    ]},

    { title: 'Сеть и HTTP', cards: [
      { id: 'url', q: 'Что происходит, когда вводишь URL и жмёшь Enter?', tags: ['must'],
        short: `<ol><li>Разбор URL, проверка HSTS и кэша.</li><li><b>DNS</b>: кэш браузера → ОС → резолвер → корневые, TLD и авторитативные серверы.</li><li><b>TCP</b>-рукопожатие (SYN, SYN-ACK, ACK) и <b>TLS</b> (сертификат, обмен ключами; в TLS 1.3 это 1 RTT). В HTTP/3 вместо TCP — QUIC поверх UDP.</li><li>HTTP-запрос проходит через CDN, балансировщик и reverse proxy (nginx) до приложения, ответ идёт обратно.</li><li>Парсинг и рендер (critical rendering path).</li></ol>`,
        mine: `<p>Отличная вставка из опыта: в Grandbazar запрос попадает в единственный контейнер Next.js, тенант определяется по домену, SSR сразу отдаёт страницу в оформлении нужного клиента.</p>` },

      { id: 'http', q: 'HTTP-методы, идемпотентность, коды ответов', tags: ['must'],
        short: `<p><code>GET</code> — чтение, безопасный. <code>POST</code> — создание или действие, не идемпотентный. <code>PUT</code> — полная замена, идемпотентный. <code>PATCH</code> — частичное изменение. <code>DELETE</code> — удаление, идемпотентный.</p><p><b>Идемпотентность</b> — повторный запрос даёт тот же эффект на сервере, поэтому его можно безопасно ретраить.</p><p>Коды: <b>2xx</b> успех (200, 201, 204), <b>3xx</b> редиректы (301, 302, 304 Not Modified), <b>4xx</b> ошибка клиента (400, 401 — не аутентифицирован, 403 — нет прав, 404, 409 — конфликт, 422, 429), <b>5xx</b> ошибка сервера (500, 502, 503, 504).</p>`,
        deep: `<p><b>HTTP/1.1</b> — keep-alive, но head-of-line blocking: браузер открывает ~6 соединений на хост. <b>HTTP/2</b> — мультиплексирование потоков в одном TCP-соединении, сжатие заголовков (HPACK). <b>HTTP/3</b> — QUIC: нет HOL-блокировки на уровне TCP, быстрее рукопожатие.</p><p>POST делают идемпотентным заголовком <code>Idempotency-Key</code>: сервер запоминает ключ и на повтор возвращает тот же результат.</p><p><b>REST vs GraphQL:</b> GraphQL решает over- и under-fetching, у него одна точка входа и типизированная схема. Цена — сложнее кэширование, N+1 на резолверах, нужен контроль сложности запросов.</p>`,
        mine: `<p>Скретч-карта: повторный запуск возвращает уже открытую сессию — по сути, идемпотентный старт. Хороший живой пример.</p>`,
        traps: ['401 vs 403 — путают постоянно', 'Почему GET не должен менять состояние? (кэши, префетч, CSRF)'] },

      { id: 'cache', q: 'Как работает HTTP-кэширование?', tags: ['must'],
        short: `<p><code>Cache-Control</code>: <code>max-age</code> (сколько ответ свежий), <code>no-cache</code> (хранить, но перед использованием ревалидировать), <code>no-store</code> (не хранить вообще), <code>private</code>/<code>public</code>, <code>immutable</code>, <code>stale-while-revalidate</code>.</p><p><b>Ревалидация:</b> <code>ETag</code> + <code>If-None-Match</code> или <code>Last-Modified</code> + <code>If-Modified-Since</code> → сервер отвечает 304 без тела.</p><p>Стратегия: статика с хэшем в имени файла — <code>max-age=31536000, immutable</code>, HTML — <code>no-cache</code>.</p>`,
        traps: ['<code>no-cache</code> ≠ «не кэшировать» — классическая ловушка', '<code>s-maxage</code> для CDN, заголовок <code>Vary</code>', 'Как сбросить кэш у пользователей после деплоя? (хэши в именах файлов)'],
        links: [L.mdn('en-US/docs/Web/HTTP/Guides/Caching', 'MDN: HTTP caching')] },

      { id: 'cors', q: 'Что такое CORS и зачем preflight?', tags: ['must'],
        short: `<p><b>Same-Origin Policy</b>: браузер не даёт JS читать ответы с другого origin (схема + хост + порт). <b>CORS</b> — механизм, которым сервер разрешает это заголовками <code>Access-Control-Allow-Origin</code>, <code>-Methods</code>, <code>-Headers</code>, <code>-Credentials</code>.</p><p>«Непростые» запросы (PUT/DELETE, <code>Content-Type: application/json</code>, кастомные заголовки) браузер предваряет <b>preflight</b>-запросом <code>OPTIONS</code>. CORS защищает пользователя в браузере, а не сервер: curl на CORS плевать.</p>`,
        traps: ['<code>credentials: include</code> + <code>Allow-Origin: *</code> — нельзя, нужен конкретный origin', 'Как обойти в dev? Прокси dev-сервера или rewrites в Next', 'Кэш preflight — <code>Access-Control-Max-Age</code>'],
        links: [L.mdn('ru/docs/Web/HTTP/CORS', 'MDN: CORS')] },

      { id: 'realtime', q: 'WebSocket vs SSE vs polling — что выбрать?', tags: ['must'],
        short: `<p><b>Polling</b> — периодические запросы: просто, но задержка и лишняя нагрузка. <b>Long polling</b> — сервер держит запрос открытым до события.</p><p><b>SSE</b> (<code>EventSource</code>) — односторонний поток сервер → клиент поверх обычного HTTP: автопереподключение, <code>Last-Event-ID</code>, только текст. <b>WebSocket</b> — двусторонний канал после <code>Upgrade</code>, бинарные данные, reconnect и heartbeat пишешь сам.</p><p>Уведомления, ленты, прогресс → SSE. Чаты, игры, совместное редактирование → WebSocket.</p>`,
        deep: `<p>Масштабирование WebSocket: соединение висит на конкретном инстансе, поэтому нужны sticky sessions на балансировщике и pub/sub между инстансами (Redis, NATS). Ещё нужны backpressure, лимит соединений и аутентификация при handshake.</p>`,
        mine: `<p>В Grandbazar ты работал с WebSocket/EventSource в механике «морской бой». Вспомни, что из них использовалось и почему: интервьюер спросит, почему не второй вариант.</p>` },

      { id: 'auth', q: 'JWT vs сессии. Аутентификация vs авторизация. OAuth', tags: ['must', 'senior'],
        short: `<p><b>Аутентификация</b> — кто ты, <b>авторизация</b> — что тебе можно.</p><p><b>Сессия</b>: состояние хранит сервер, клиент держит id в cookie. Легко отозвать, но при нескольких инстансах нужно общее хранилище (Redis).</p><p><b>JWT</b>: подписанный токен с claims, сервер проверяет подпись без хранилища (stateless). Отозвать сложно, поэтому делают короткий access-токен + refresh с ротацией, а refresh держат в HttpOnly cookie. JWT подписан, но <b>не зашифрован</b>: payload читает кто угодно.</p>`,
        deep: `<p><b>OAuth 2.0</b> — делегирование доступа. Для браузера и мобилок — Authorization Code + PKCE. <b>OIDC</b> — аутентификация поверх OAuth, выдаёт <code>id_token</code>.</p><p>Подпись JWT: HS256 (общий секрет) или RS256/ES256 (приватный ключ подписывает, публичный проверяет — удобно для многих сервисов). Атака <code>alg: none</code> — всегда фиксируй алгоритм на сервере.</p>`,
        mine: `<p>В cp-back есть passport-jwt, но подключали его другие разработчики, а бэкенд авторизации — отдельный сервис. Так прямо и говори. Ты делал фронтенд всех экранов авторизации, поэтому понимать схему токенов и refresh всё равно обязан.</p>` },
    ]},

    { title: 'React и Next.js', cards: [
      { id: 'reconcile', q: 'Как React обновляет DOM? Зачем key?', tags: ['must'],
        short: `<p>React строит дерево элементов (Virtual DOM). При обновлении он сравнивает новое дерево с предыдущим (reconciliation) и применяет к DOM минимальные изменения.</p><p>Эвристики работают за O(n): если тип элемента другой, поддерево пересоздаётся; дочерние элементы списков сопоставляются по <code>key</code>. Фазы: <b>render</b> — чистый расчёт, может прерываться → <b>commit</b> — мутации DOM и эффекты.</p>`,
        deep: `<p><b>Fiber</b> — архитектура, которая делит работу рендера на единицы, чтобы её можно было прерывать и приоритизировать. На ней построены concurrent features: <code>startTransition</code>, <code>useDeferredValue</code>, Suspense.</p><p>Смена <code>key</code> — легальный способ сбросить состояние компонента.</p>`,
        traps: ['Почему index как key — плохо? (вставка или перестановка — и state, и фокус уезжают к соседнему элементу)', 'Правда ли, что VDOM быстрее DOM? (нет: он про декларативность и батчинг, а не про скорость)'],
        links: [['react.dev: Preserving and resetting state', 'https://react.dev/learn/preserving-and-resetting-state']] },

      { id: 'rerender', q: 'Когда компонент ре-рендерится? memo, useMemo, useCallback', tags: ['must'],
        short: `<p>Ре-рендер случается, когда меняется собственный state, ре-рендерится родитель (даже если props те же!) или меняется используемый контекст.</p><p><code>React.memo</code> пропускает ре-рендер при поверхностно равных props. <code>useMemo</code> кэширует значение, <code>useCallback</code> — функцию. Они нужны, чтобы не ломать memo и зависимости эффектов. Мемоизируй по профилировщику, а не везде. React Compiler умеет мемоизировать автоматически.</p>`,
        deep: `<p><b>Без мемоизации:</b> опусти state вниз, передавай тяжёлые части через <code>children</code> (композиция), дели контекст на части, используй селекторы.</p><p>С React 18 батчинг автоматический везде, включая промисы и таймеры.</p><p><b>MobX:</b> <code>observer</code> ре-рендерит компонент только при изменении тех observable, которые реально прочитаны в рендере. Это точечные подписки, поэтому memo нужен гораздо реже.</p>`,
        mine: `<p>Ты на MobX. Сильный ответ — объяснить, почему с observer-компонентами проблема лишних ре-рендеров стоит слабее, чем с Context, и где она всё же есть: разыменование observable в родителе вместо ребёнка.</p>`,
        traps: ['Объект или функция, созданные в рендере и переданные в props, делают memo бесполезным', 'value контекста, пересоздаваемый на каждый рендер', 'Как найти лишние ре-рендеры? (React DevTools Profiler, «Highlight updates»)'] },

      { id: 'effects', q: 'useEffect vs useLayoutEffect. Зачем cleanup?', tags: ['must'],
        short: `<p><code>useEffect</code> выполняется после отрисовки и нужен для синхронизации с внешним миром: подписки, запросы, таймеры. Функция, которую он возвращает, — <b>cleanup</b>: вызывается перед следующим запуском эффекта и при размонтировании.</p><p><code>useLayoutEffect</code> выполняется синхронно после мутаций DOM, но до отрисовки. Подходит для замеров и правки layout без мигания. В StrictMode (dev) эффекты запускаются дважды — так React проверяет, что cleanup корректен.</p>`,
        deep: `<p>Принцип «You might not need an effect»: производные данные считай прямо в рендере, реакцию на действия пользователя — в обработчиках событий, а не в эффекте.</p><p><b>Гонка при fetch:</b> ответы приходят не по порядку → флаг <code>ignore</code> или <code>AbortController</code> в cleanup. В deps — всё, что эффект берёт из рендера.</p>`,
        lang: 'tsx',
        code: `useEffect(() => {
  const ctrl = new AbortController();
  fetch('/api/users/' + id, { signal: ctrl.signal })
    .then(r => r.json())
    .then(setUser)
    .catch(e => { if (e.name !== 'AbortError') setError(e); });
  return () => ctrl.abort();
}, [id]);`,
        mine: `<p>Race condition в корзине (быстрые «+»/«−») — живая история про гонки. В базе у тебя это ещё открытый вопрос: найди MR и вспомни, как чинили. Получится готовый ответ на «расскажи про сложный баг».</p>`,
        links: [['react.dev: You Might Not Need an Effect', 'https://react.dev/learn/you-might-not-need-an-effect']] },

      { id: 'state', q: 'Как выбрать state management? MobX vs Redux vs Zustand vs Context', tags: ['must', 'senior'],
        short: `<p>Начинать стоит с простого: локальный state, поднятие состояния, URL как state. Серверные данные держи отдельно от клиентских (TanStack Query, SWR).</p><ul><li><b>Context</b> — для редко меняющегося: тема, текущий пользователь. Не для частых апдейтов.</li><li><b>Redux Toolkit</b> — единый стор, иммутабельность, экшены: предсказуемость и devtools ценой церемоний.</li><li><b>Zustand</b> — минималистичный стор на хуках с селекторами.</li><li><b>MobX</b> — observable и реактивность: мутируешь напрямую, подписки точечные, хорошо ложится на классы и MVVM.</li><li><b>Pinia</b> — официальный стор Vue.</li></ul>`,
        deep: `<p><b>MobX:</b> <code>makeAutoObservable</code>, <code>action</code>, <code>computed</code> (кэшируемые производные значения), <code>reaction</code>/<code>autorun</code>/<code>when</code>. В strict-режиме мутировать можно только в action, после <code>await</code> — через <code>runInAction</code>.</p><p>Плюсы: мало кода и высокая производительность. Минусы: «магия» прокси, сложнее отследить, откуда пришло изменение, мутабельность.</p>`,
        lang: 'ts',
        code: `// иллюстрация идеи, не код из репозитория
class TableStore<Row> {
  rows: Row[] = [];
  page = 1;
  search = '';

  constructor() {
    makeAutoObservable(this);
  }

  get visible() {
    return this.rows.filter(r => this.matches(r, this.search));
  }

  setSearch(v: string) {
    this.search = v;
    this.page = 1;
  }

  async load() {
    const data = await this.fetchPage(this.page, this.search);
    runInAction(() => { this.rows = data; });
  }

  protected matches(_row: Row, _q: string) { return true; }
  protected fetchPage(_p: number, _q: string): Promise<Row[]> { return Promise.resolve([]); }
}`,
        mine: `<p>Твоя сильная карта: базовый MobX store-класс для таблиц даёт сортировку, пагинацию и поиск из коробки, наследники кастомизируют, фильтры синхронизируются с URL. Почему MobX под MVVM: ViewModel — это класс-стор, View — observer-компонент.</p>`,
        links: [['MobX docs', 'https://mobx.js.org/README.html']] },

      { id: 'ssr', q: 'CSR, SSR, SSG, ISR — в чём разница и когда что?', tags: ['must'],
        short: `<ul><li><b>CSR</b> — пустой HTML, JS рендерит всё в браузере. Плохо для SEO и первого экрана.</li><li><b>SSR</b> — HTML генерируется на сервере на каждый запрос. Данные свежие и персональные, но растут нагрузка на сервер и TTFB.</li><li><b>SSG</b> — HTML собирается при билде. Максимально быстро, но данные статичны.</li><li><b>ISR</b> — SSG с фоновой перегенерацией по таймеру или по требованию (<code>revalidate</code>).</li></ul><p>В App Router режим выбирается на уровне fetch и роутов: <code>cache</code>, <code>revalidate</code>, dynamic-функции (<code>cookies()</code>, <code>headers()</code>).</p>`,
        mine: `<p>Мультитенантность: SSR нужен, чтобы конфиг тенанта (тема, тексты, OG image) был в HTML с первого байта. Отсюда нет мигания темы и правильные OG-превью для соцсетей и мессенджеров: краулер JS не выполняет.</p>`,
        traps: ['Что такое TTFB, FCP, LCP и на что из них влияет SSR', 'Edge runtime vs Node runtime'] },

      { id: 'hydration', q: 'Что такое гидратация и откуда hydration mismatch?', tags: ['must'],
        short: `<p><b>Гидратация</b> — React «оживляет» серверный HTML: строит дерево на клиенте, навешивает обработчики и сверяет результат с разметкой.</p><p><b>Mismatch</b> — клиентский рендер отличается от серверного. Типичные причины: <code>Date.now()</code>, <code>Math.random()</code>, <code>window</code>/<code>localStorage</code> в рендере, разные локали и таймзоны, невалидный HTML (div внутри p). Лечение: одинаковые данные на сервере и клиенте, браузерное — в <code>useEffect</code>, <code>suppressHydrationWarning</code> точечно, <code>dynamic(..., { ssr: false })</code>.</p>`,
        deep: `<p><b>Streaming SSR + Suspense:</b> HTML уходит частями, гидратация избирательная — первым оживает то, с чем взаимодействует пользователь. Это уменьшает время до интерактивности.</p>` },

      { id: 'rsc', q: 'Server Components — что это и чем отличаются от SSR?', tags: ['senior'],
        short: `<p><b>Server Components</b> выполняются только на сервере. Они могут напрямую ходить в БД и использовать секреты, их код не попадает в бандл, но у них нет state, эффектов и обработчиков. <b>Client Components</b> (<code>'use client'</code>) — привычные компоненты, они гидрируются.</p><p>Серверный компонент может рендерить клиентский и передавать ему сериализуемые props. Клиентский импортировать серверный не может, только получить через <code>children</code>. <b>Server Actions</b> (<code>'use server'</code>) — вызов серверной функции из формы или клиента.</p>`,
        traps: ['RSC ≠ SSR: SSR — про HTML первого ответа, RSC — про то, где выполняется компонент. Они комбинируются', 'Почему нельзя передать функцию из серверного компонента в клиентский? (несериализуема, кроме Server Actions)'],
        links: [['react.dev: Server Components', 'https://react.dev/reference/rsc/server-components']] },
    ]},

    { title: 'CSS', cards: [
      { id: 'cascade', q: 'Каскад, специфичность и @layer', tags: ['must'],
        short: `<p>Порядок победы в каскаде: происхождение и важность (<code>!important</code>) → <b>cascade layers</b> → специфичность → порядок в коде.</p><p>Специфичность считается тройкой (id, класс/атрибут/псевдокласс, тег/псевдоэлемент), inline-стили сильнее. У <code>:where()</code> специфичность 0, у <code>:is()</code>/<code>:not()</code> — как у самого специфичного аргумента.</p><p><b>@layer:</b> стили из слоя, объявленного раньше, проигрывают более позднему слою <b>независимо от специфичности</b>. Стили вне слоёв побеждают все слои.</p>`,
        lang: 'css',
        code: `@layer reset, ui_baza_components, app;

@layer ui_baza_components {
  .root .button.primary { background: var(--color-accent); }
}

/* выигрывает, хотя специфичность меньше */
@layer app {
  .button { background: hotpink; }
}`,
        mine: `<p>ui-baza: все стили библиотеки лежат в <code>@layer ui_baza_components</code>. Проект ставит этот слой ниже своих и переопределяет стили без <code>!important</code> и без войны специфичности. Это твой козырь — расскажи с примером.</p>`,
        traps: ['<code>!important</code> внутри слоёв работает наоборот: важное правило из раннего слоя побеждает', 'Как подключить сторонний CSS в слой: <code>@import url(...) layer(vendor)</code>'],
        links: [L.mdn('en-US/docs/Web/CSS/@layer', 'MDN: @layer')] },

      { id: 'flexgrid', q: 'Flexbox vs Grid — когда что?', tags: ['must'],
        short: `<p><b>Flexbox</b> — одномерная раскладка (строка или колонка), размеры диктует контент: тулбары, выравнивание, ряды кнопок. <b>Grid</b> — двумерная раскладка: строки и колонки одновременно, раскладка диктует контенту. Страницы, карточные сетки, дашборды.</p><p>Ключевое во flex: <code>flex: grow shrink basis</code>, <code>min-width: 0</code>, чтобы текст мог сжиматься. В grid: <code>fr</code>, <code>minmax</code>, <code>repeat(auto-fill/auto-fit, …)</code>, <code>grid-template-areas</code>, <code>subgrid</code>.</p>`,
        lang: 'css',
        code: `.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}

.bento { display: grid; grid-template-columns: repeat(12, 1fr); }
.bento > .wide { grid-column: span 6; }

@media (max-width: 600px) {
  .bento { grid-template-columns: repeat(4, 1fr); }
}`,
        mine: `<p>Bento-сетка конструктора: 12 колонок на десктопе и 4 на мобильных, размеры блоков задаются отдельно для каждой сетки.</p>`,
        traps: ['auto-fill vs auto-fit (пустые треки остаются или схлопываются)', 'Почему flex-элемент не сжимается меньше контента? (<code>min-width: auto</code>)'] },

      { id: 'css-approaches', q: 'CSS Modules, БЭМ, CSS-in-JS, Tailwind — плюсы и минусы', tags: ['must', 'senior'],
        short: `<ul><li><b>БЭМ</b> — соглашение об именовании, без инструментов.</li><li><b>CSS Modules</b> — локальные имена классов на этапе сборки, обычный CSS, ноль рантайма.</li><li><b>CSS-in-JS</b> (styled-components, emotion) — стили в JS, динамика через props. Цена — рантайм и сложности с SSR/RSC. Есть zero-runtime варианты: vanilla-extract, Linaria.</li><li><b>Utility-first</b> (Tailwind) — атомарные классы в разметке: быстро, консистентные токены, маленький итоговый CSS, но шумная разметка.</li></ul><p><b>Токены на CSS-переменных</b> позволяют менять тему в рантайме без пересборки.</p>`,
        mine: `<p>ui-baza: CSS Modules + <code>@layer</code> + 155 токенов на CSS-переменных, 0 runtime-зависимостей. Аргументы против CSS-in-JS для библиотеки: нет рантайма, нет проблем с SSR, проект может перекрыть любой токен.</p><p>Tailwind указан в стеке твоего резюме для hh, но в базе фактов не подтверждён. Если спросят, будь готов хотя бы сравнить его с CSS Modules.</p>` },
    ]},

    { title: 'Производительность и доступность', cards: [
      { id: 'cwv', q: 'Что такое Core Web Vitals?', tags: ['must'],
        short: `<ul><li><b>LCP</b> (Largest Contentful Paint) — когда отрисован самый большой элемент первого экрана. Хорошо: ≤ 2.5 с.</li><li><b>INP</b> (Interaction to Next Paint) — задержка отклика на взаимодействия. Хорошо: ≤ 200 мс. Заменил FID в 2024 году.</li><li><b>CLS</b> (Cumulative Layout Shift) — визуальная стабильность. Хорошо: ≤ 0.1.</li></ul><p>Оценивают по 75-му перцентилю реальных пользователей (field data, CrUX). Lighthouse — лабораторные данные, это не то же самое.</p>`,
        deep: `<p><b>LCP:</b> снизить TTFB, preload героя, <code>fetchpriority="high"</code>, не ставить lazy на первый экран, SSR.</p><p><b>INP:</b> короткие задачи, разбивать long tasks, меньше JS, <code>startTransition</code> для тяжёлых апдейтов.</p><p><b>CLS:</b> <code>width</code>/<code>height</code> или <code>aspect-ratio</code> у картинок, резерв места под баннеры, <code>font-display</code> с подогнанными метриками фолбэка.</p>`,
        links: [['web.dev: Web Vitals', 'https://web.dev/articles/vitals']] },

      { id: 'perf', q: 'Как ускорить фронтенд-приложение?', tags: ['must'],
        short: `<p><b>Сначала измерь:</b> Performance panel, React Profiler, Lighthouse, RUM.</p><ul><li><b>Грузить меньше:</b> code splitting по роутам и <code>import()</code>, tree shaking, анализ бандла, AVIF/WebP + <code>srcset</code>, brotli, кэш с хэшами в именах.</li><li><b>Отдавать быстрее:</b> CDN, SSR/SSG, preconnect/preload, HTTP/2.</li><li><b>Работать меньше:</b> виртуализация длинных списков, мемоизация по профилю, debounce/throttle, Web Workers для тяжёлых вычислений, анимации на transform/opacity.</li></ul>`,
        mine: `<p>next/image в клиентском приложении: ресайз, lazy loading, современные форматы. Ускорение пайплайна: параллельный прогон тестов (vmThreads). Метрик скорости в резюме нет, поэтому не придумывай цифры — говори про подход.</p>`,
        traps: ['debounce vs throttle — в чём разница', 'Как виртуализация работает под капотом (рендерим только видимое окно плюс буфер)'] },

      { id: 'a11y', q: 'Основы доступности (a11y): что обязательно сделать?', tags: ['must'],
        short: `<ul><li><b>Семантика прежде всего:</b> <code>button</code> для действий, <code>a</code> для навигации, <code>label</code> у полей, иерархия заголовков, landmarks (header, nav, main).</li><li><b>ARIA</b> — только когда нативного элемента нет: <code>role</code>, <code>aria-label</code>, <code>aria-expanded</code>, <code>aria-controls</code>, <code>aria-live</code>. Первое правило ARIA — не используй ARIA, если есть нативный элемент.</li><li><b>Клавиатура:</b> всё доступно с Tab, видимый фокус (<code>:focus-visible</code>), в модалках focus trap и возврат фокуса, Escape закрывает.</li><li>Контраст по WCAG AA — 4.5:1 для текста. Поддержка <code>prefers-reduced-motion</code>.</li></ul>`,
        mine: `<p>ui-baza: Storybook addon-a11y, eslint-plugin-jsx-a11y. Генератор форм опросов — с навигацией с клавиатуры. В skills-matrix a11y у тебя на уровне 2, поэтому не заявляй экспертизу шире, чем можешь объяснить.</p>`,
        traps: ['Как сделать доступный кастомный dropdown? (паттерны из APG, roving tabindex)', 'Чем <code>aria-label</code> отличается от <code>aria-labelledby</code>'],
        links: [['WAI-ARIA Authoring Practices', 'https://www.w3.org/WAI/ARIA/apg/']] },
    ]},

    { title: 'Безопасность', cards: [
      { id: 'xss', q: 'Что такое XSS и как защищаться? Что такое CSP?', tags: ['must'],
        short: `<p><b>XSS</b> — внедрение чужого JS на страницу. Бывает stored (лежит в БД), reflected (приходит из URL) и DOM-based (<code>innerHTML</code> из <code>location</code>).</p><p><b>Защита:</b> экранирование вывода (React делает это по умолчанию), никакого <code>dangerouslySetInnerHTML</code>/<code>innerHTML</code> без санитайзера (DOMPurify), проверка <code>href</code> на <code>javascript:</code>, CSP-заголовок, токены в HttpOnly cookie.</p><p><b>CSP</b> (Content-Security-Policy) — белый список источников: откуда можно грузить скрипты, стили и картинки. <code>script-src 'self' 'nonce-…'</code> без <code>unsafe-inline</code> блокирует внедрённые инлайн-скрипты.</p>`,
        traps: ['React не спасает от <code>href={userInput}</code> с <code>javascript:</code>', 'Инъекция JSON в <code>&lt;script&gt;</code> при SSR — нужно экранировать <code>&lt;/script&gt;</code>'],
        links: [['OWASP Top 10', 'https://owasp.org/www-project-top-ten/']] },

      { id: 'csrf', q: 'Что такое CSRF и как защищаться?', tags: ['must'],
        short: `<p><b>CSRF</b> — чужой сайт заставляет браузер жертвы отправить запрос на твой сайт, и cookie жертвы уходят вместе с ним.</p><p><b>Защита:</b> <code>SameSite=Lax/Strict</code> у cookie (Lax — дефолт в Chrome и Edge, в остальных браузерах ставь явно), CSRF-токен (synchronizer token или double submit), проверка <code>Origin</code>/<code>Referer</code>, никаких изменений состояния через GET.</p><p>Если авторизация идёт через заголовок <code>Authorization</code>, а не cookie, CSRF не страшен, но такой токен уязвим к XSS.</p>`,
        deep: `<p>Важное из OWASP Top 10: broken access control (проверяй права на сервере для каждого объекта — IDOR), injection, в том числе NoSQL-инъекции, уязвимые зависимости, SSRF.</p><p><b>NoSQL-инъекция в Mongo:</b> в теле запроса приходит <code>{ "password": { "$ne": null } }</code>. Лечится валидацией DTO (в Nest — <code>ValidationPipe</code>) и приведением типов.</p>`,
        mine: `<p>В GitLab CI ты сделал <code>npm audit</code>, который блокирует MR при уязвимых зависимостях. Хороший пример по пункту OWASP про уязвимые компоненты.</p>` },
    ]},

    { title: 'Node.js и NestJS', cards: [
      { id: 'node-loop', q: 'Event loop в Node: фазы, nextTick, setImmediate', tags: ['must', 'senior'],
        short: `<p>Node — это V8 + libuv. Фазы event loop: <b>timers</b> (<code>setTimeout</code>/<code>setInterval</code>) → pending callbacks → <b>poll</b> (I/O, здесь цикл ждёт) → <b>check</b> (<code>setImmediate</code>) → close callbacks.</p><p>Между колбэками сначала разбирается очередь <code>process.nextTick</code>, потом микрозадачи промисов. Часть операций (fs, <code>dns.lookup</code>, crypto, zlib) выполняется в пуле потоков libuv (по умолчанию 4 потока).</p>`,
        lang: 'js',
        code: `setTimeout(() => console.log('timeout'));
setImmediate(() => console.log('immediate'));
process.nextTick(() => console.log('nextTick'));
Promise.resolve().then(() => console.log('promise'));

// nextTick, promise, затем timeout и immediate —
// их порядок в главном модуле не гарантирован;
// внутри I/O-колбэка setImmediate всегда первым`,
        traps: ['Как не блокировать event loop? CPU-тяжёлое — в <code>worker_threads</code>, в очередь или в отдельный сервис; никаких <code>*Sync</code> в обработчиках', 'Что такое streams и backpressure (<code>pipeline</code>, <code>highWaterMark</code>)'],
        links: [['Node.js: event loop', 'https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick']] },

      { id: 'nest', q: 'Из чего состоит NestJS? Жизненный цикл запроса', tags: ['must'],
        short: `<p>NestJS — фреймворк поверх Express или Fastify с DI и модулями (идеи из Angular). <b>Module</b> группирует провайдеры и контроллеры и задаёт границы. <b>Controller</b> отвечает за маршруты. <b>Provider</b> (сервис, репозиторий) внедряется через DI-контейнер и по умолчанию является singleton.</p><p><b>Путь запроса:</b> middleware → <b>guards</b> (пускать ли: auth, роли) → interceptors (до) → <b>pipes</b> (валидация и преобразование DTO) → handler → interceptors (после: маппинг ответа, логирование, кэш) → <b>exception filters</b> (формат ошибок).</p>`,
        mine: `<p>cp-back: 112 твоих коммитов — механики лояльности, модель данных и бэкенд конструктора, промо-превью, 5 ADR. Bull, RabbitMQ и JWT подключали другие — так и говори, честность здесь плюс.</p>`,
        traps: ['Scope провайдеров: DEFAULT, REQUEST, TRANSIENT', 'Циклические зависимости и <code>forwardRef</code>', 'Как тестировать: <code>Test.createTestingModule</code> с подменой провайдеров'],
        links: [['NestJS: request lifecycle', 'https://docs.nestjs.com/faq/request-lifecycle']] },

      { id: 'queues', q: 'Зачем нужны очереди? Bull vs RabbitMQ vs Kafka', tags: ['senior'],
        short: `<p>Очередь отделяет приём запроса от тяжёлой или ненадёжной работы: письма, генерация файлов, вебхуки, интеграции. Это даёт ретраи, отложенные задачи, сглаживание пиков нагрузки и независимое масштабирование воркеров.</p><ul><li><b>Bull/BullMQ</b> — очередь задач на Redis внутри Node-экосистемы.</li><li><b>RabbitMQ</b> — брокер сообщений (AMQP): exchanges, routing, подтверждения, работает между сервисами на любых языках.</li><li><b>Kafka</b> — распределённый лог событий с хранением и replay, для стриминга и больших потоков.</li></ul>`,
        deep: `<p>Гарантии доставки: at-most-once, at-least-once (обработчик обязан быть идемпотентным) и exactly-once (на практике почти миф: это at-least-once + идемпотентность). Сообщения, которые раз за разом падают, уходят в DLQ (dead letter queue).</p>`,
        mine: `<p>В cp-back есть и Bull, и RabbitMQ, есть отдельный сервис отправки писем. Подключали их не ты, но объяснить, зачем они там, ты обязан.</p>` },
    ]},

    { title: 'Базы данных', cards: [
      { id: 'sql-nosql', q: 'Чем реляционные БД отличаются от нереляционных?', tags: ['must'],
        short: `<p><b>Реляционные</b> (PostgreSQL, MySQL): таблицы со строгой схемой, связи через внешние ключи, JOIN, SQL, ACID-транзакции. Масштабируются в основном вертикально плюс реплики на чтение, шардинг сложнее.</p><p><b>Нереляционные (NoSQL)</b> — целое семейство: документные (MongoDB — JSON-документы, гибкая схема, вложенность), key-value (Redis — в памяти, очень быстро), колоночные (Cassandra, ClickHouse — аналитика и большие потоки), графовые (Neo4j). Обычно проще масштабируются горизонтально, но часть гарантий (JOIN, транзакции между сущностями, строгая схема) переезжает в приложение.</p>`,
        deep: `<p><b>Когда реляционная:</b> много связей, отчёты и произвольные запросы, критична целостность (деньги, заказы). <b>Когда документная:</b> данные читаются агрегатом целиком, схема разнородная или быстро меняется.</p><p>В Mongo есть multi-document транзакции (с 4.0, нужен replica set) и <code>$lookup</code>, но если они нужны везде, ты выбрал не ту БД. Схема в Mongo всё равно существует — в коде (mongoose schema) и в JSON Schema validation. А в Postgres есть JSONB с GIN-индексами — гибридный вариант.</p><p><b>CAP:</b> при сетевом разделении приходится выбирать между согласованностью и доступностью.</p>`,
        mine: `<p>У тебя опыт с обоими мирами. PostgreSQL + Prisma — CMS адвокатов (VibeLab). MongoDB + mongoose — cp-back (Grandbazar). Redis — для блокировок. Сильный пример: раскладка промостраницы — встроенный поддокумент, потому что всегда читается целиком вместе со страницей; механики — по ссылке <code>uuid</code>, потому что живут своей жизнью.</p>`,
        traps: ['«Что выберешь для X?» — отвечай через паттерны доступа к данным, а не через моду', 'Embedding vs referencing в Mongo — правила выбора', 'Что такое шардинг и чем он отличается от репликации'] },

      { id: 'indexes', q: 'Что такое индексы и как они работают?', tags: ['must'],
        short: `<p>Индекс — отдельная упорядоченная структура (обычно <b>B-tree</b>), которая хранит значения колонки и ссылки на строки. Без индекса БД делает полный перебор (full scan, O(n)), с индексом — поиск по дереву (O(log n)).</p><p><b>Цена индекса:</b> место на диске и медленная запись, потому что каждый INSERT или UPDATE обновляет все индексы. Индексируют поля из WHERE, JOIN и ORDER BY с высокой селективностью.</p>`,
        deep: `<h5>Типы</h5><p>B-tree — для <code>=</code>, <code>&lt;</code>, <code>&gt;</code>, BETWEEN, ORDER BY и префиксного <code>LIKE 'abc%'</code>. Hash — только равенство. GIN — массивы, JSONB, полнотекст. GiST — гео. В Mongo: single, compound, multikey (по массивам), text, 2dsphere, TTL, unique, partial.</p><h5>Составной индекс (a, b, c)</h5><p>Работает для запросов по <code>a</code>, <code>a+b</code>, <code>a+b+c</code> — это правило левого префикса. Для запроса только по <code>b</code> он бесполезен. Порядок полей: сначала равенство, потом сортировка, потом диапазон. В Mongo это правило ESR: Equality, Sort, Range.</p><h5>Когда индекс не работает</h5><ul><li>Функция над колонкой (<code>LOWER(email)</code>) без функционального индекса.</li><li><code>LIKE '%abc'</code>.</li><li>Низкая селективность (поле boolean или пол).</li><li>Неявное приведение типов.</li></ul><p><b>Покрывающий индекс</b> содержит все нужные запросу поля, поэтому в таблицу ходить не надо (index-only scan). <b>Кластерный индекс</b> — данные физически упорядочены по нему (первичный ключ в InnoDB).</p>`,
        lang: 'sql',
        code: `-- PostgreSQL
CREATE INDEX idx_orders_user_created ON orders (user_id, created_at DESC);

EXPLAIN ANALYZE
SELECT * FROM orders
WHERE user_id = 42
ORDER BY created_at DESC
LIMIT 20;
-- Index Scan using idx_orders_user_created ...  вместо Seq Scan

-- MongoDB
db.orders.createIndex({ userId: 1, createdAt: -1 })
db.orders.find({ userId: 42 }).sort({ createdAt: -1 }).explain('executionStats')
-- IXSCAN вместо COLLSCAN, totalDocsExamined ≈ nReturned`,
        traps: ['«Как понять, что запрос медленный?» — EXPLAIN (ANALYZE), slow query log, Mongo profiler', '«Почему не проиндексировать всё?» — запись и память', '«Индекс по полю gender поможет?» — нет, селективность низкая', '«Чем B-tree лучше бинарного дерева для диска?» — дерево широкое и низкое, мало чтений страниц'],
        links: [['Use The Index, Luke! (лучший учебник по индексам)', 'https://use-the-index-luke.com/'], ['MongoDB: Indexes', 'https://www.mongodb.com/docs/manual/indexes/']] },

      { id: 'acid', q: 'Что такое транзакция и ACID?', tags: ['must'],
        short: `<p>Транзакция — группа операций по принципу «всё или ничего».</p><ul><li><b>Atomicity</b> — при сбое всё откатывается.</li><li><b>Consistency</b> — из валидного состояния в валидное, ограничения соблюдены.</li><li><b>Isolation</b> — параллельные транзакции не мешают друг другу (в пределах выбранного уровня).</li><li><b>Durability</b> — после commit данные переживут падение (журнал WAL).</li></ul>`,
        deep: `<p><b>MVCC</b> в Postgres: каждая транзакция видит свой снимок данных, поэтому читатели не блокируют писателей.</p><p><b>BASE</b> в NoSQL: Basically Available, Soft state, Eventual consistency.</p><p><b>Распределённые транзакции:</b> 2PC (дорого и блокирующе), saga (цепочка локальных транзакций с компенсирующими действиями), outbox pattern (событие пишется в ту же БД в той же транзакции, потом отдельно публикуется).</p>`,
        mine: `<p>Скретч-карта: поиск сессии, проверка допуска и списание платы — одна критическая секция под Redlock, плюс атомарный claim с откатом. Заранее продумай ответ на «почему не транзакция Mongo?» — вопрос вероятный. Говори про trade-off, а не «так получилось».</p>` },

      { id: 'isolation', q: 'Уровни изоляции и аномалии', tags: ['must', 'senior'],
        short: `<p><b>Аномалии:</b> dirty read (видишь незакоммиченное), non-repeatable read (перечитал строку — она другая), phantom read (перечитал выборку — появились новые строки), lost update и write skew.</p><p><b>Уровни:</b> Read Uncommitted → <b>Read Committed</b> (дефолт Postgres) → <b>Repeatable Read</b> (дефолт MySQL InnoDB) → <b>Serializable</b> (как будто транзакции шли по очереди).</p>`,
        deep: `<div class="tbl"><table><tr><th>Уровень</th><th>Dirty read</th><th>Non-repeatable</th><th>Phantom</th></tr><tr><td>Read Uncommitted</td><td>возможно*</td><td>возможно</td><td>возможно</td></tr><tr><td>Read Committed</td><td>нет</td><td>возможно</td><td>возможно</td></tr><tr><td>Repeatable Read</td><td>нет</td><td>нет</td><td>возможно*</td></tr><tr><td>Serializable</td><td>нет</td><td>нет</td><td>нет</td></tr></table></div><p>* В Postgres Read Uncommitted ведёт себя как Read Committed, а Repeatable Read (snapshot isolation) не даёт и фантомов. Serializable в Postgres реализован через SSI и может откатить транзакцию с serialization failure — нужен ретрай.</p><p><b>Как лечат lost update:</b> атомарный <code>UPDATE … SET x = x - 1</code>, пессимистичная блокировка (<code>SELECT … FOR UPDATE</code>), оптимистичная блокировка (поле version).</p>`,
        lang: 'sql',
        code: `-- оптимистичная блокировка
UPDATE accounts
SET balance = balance - 100, version = version + 1
WHERE id = 1 AND version = 7 AND balance >= 100;
-- 0 строк обновлено → кто-то успел раньше: перечитать и повторить

-- MongoDB: атомарный условный переход статуса
db.sessions.findOneAndUpdate(
  { _id: id, status: 'new' },
  { $set: { status: 'finished' } }
)`,
        mine: `<p>Атомарный claim <code>new → finished</code> в скретч-карте — это ровно условный атомарный апдейт: из двух одновременных запросов «выиграет» только один.</p>`,
        links: [['PostgreSQL: Transaction Isolation', 'https://www.postgresql.org/docs/current/transaction-iso.html']] },

      { id: 'normal', q: 'Нормализация и денормализация', tags: ['must'],
        short: `<p><b>Нормализация</b> убирает дублирование: каждый факт хранится в одном месте.</p><ul><li><b>1НФ</b> — атомарные значения, нет повторяющихся групп.</li><li><b>2НФ</b> — нет зависимости от части составного ключа.</li><li><b>3НФ</b> — нет транзитивных зависимостей: неключевые поля зависят только от ключа.</li></ul><p><b>Денормализация</b> — сознательное дублирование ради скорости чтения (меньше JOIN), цена — синхронизация копий. В документных БД денормализация — норма: схему проектируют под запросы.</p>`,
        mine: `<p>Встроенный <code>cardPageLayout</code> в документе промостраницы против механик по <code>uuid</code> — твой живой пример осознанного выбора embedding vs reference.</p>` },

      { id: 'n1', q: 'Проблема N+1. Как работает aggregation pipeline в Mongo?', tags: ['must'],
        short: `<p><b>N+1</b> — один запрос за списком плюс отдельный запрос за связанными данными для каждого элемента. Лечится JOIN или eager loading (Prisma <code>include</code>), батчингом (<code>WHERE id IN (...)</code>, DataLoader), в Mongo — <code>$lookup</code> или денормализацией.</p><p><b>Aggregation pipeline</b> — конвейер стадий: <code>$match</code> (фильтр; ставь первым, он использует индекс) → <code>$lookup</code> (join) → <code>$unwind</code> → <code>$group</code> → <code>$project</code> → <code>$sort</code>/<code>$limit</code>. Это аналог WHERE, JOIN, GROUP BY и SELECT в SQL.</p>`,
        lang: 'js',
        code: `db.orders.aggregate([
  { $match: { status: 'paid', createdAt: { $gte: from } } },
  { $lookup: { from: 'users', localField: 'userId', foreignField: '_id', as: 'user' } },
  { $unwind: '$user' },
  { $group: { _id: '$user.city', revenue: { $sum: '$total' }, orders: { $sum: 1 } } },
  { $sort: { revenue: -1 } },
  { $limit: 10 },
]);`,
        mine: `<p>В 2025 ты переводил сервис прототипов призов на match/aggregation-пайплайны. Эндпоинт промо-превью собирает механики, баннеры, достижения, товары, персонажа и прототипы призов. Будь готов набросать похожий пайплайн на доске.</p>` },

      { id: 'redis', q: 'Для чего Redis? Как сделать распределённую блокировку?', tags: ['must', 'senior'],
        short: `<p>Redis — in-memory key-value хранилище со структурами данных: string, hash, list, set, sorted set, stream, pub/sub. Команды выполняются в одном потоке, поэтому каждая команда атомарна.</p><p><b>Применения:</b> кэш (TTL, cache-aside), сессии, rate limiting (<code>INCR</code> + <code>EXPIRE</code>), очереди (Bull поверх Redis), лидерборды (sorted set), pub/sub, распределённые блокировки.</p>`,
        deep: `<h5>Блокировка</h5><p>Захват — <code>SET key token NX PX 10000</code>: поставить, только если ключа нет, с TTL. Снятие — Lua-скрипт «удалить, только если значение равно моему токену», иначе можно снять чужой лок.</p><p><b>Redlock</b> — алгоритм поверх N независимых Redis: лок считается взятым, если удалось захватить большинство.</p><h5>Подводный камень, который спросят</h5><p>Лок истёк по TTL, пока процесс завис (GC-пауза, сеть), — и у критической секции два владельца. Отсюда известная критика Kleppmann'а: для корректности нужны fencing tokens или второй уровень защиты в самой БД (условный атомарный апдейт, уникальный индекс).</p><h5>Кэш</h5><p>Стратегии: cache-aside, write-through. Главная боль — инвалидация. Cache stampede (толпа промахов на одном ключе) лечат блокировкой или single-flight и случайным разбросом TTL.</p>`,
        lang: 'lua',
        code: `-- захват
SET lock:scratch:{collectionId}:{playerId} <uuid> NX PX 10000

-- освобождение только своего лока (атомарно)
if redis.call('get', KEYS[1]) == ARGV[1] then
  return redis.call('del', KEYS[1])
else
  return 0
end`,
        mine: `<p>Redlock на пару «коллекция + игрок» в скретч-карте плюс атомарный claim в Mongo как второй уровень защиты — это и есть правильный ответ на «а что, если лок истёк?». Бэкенд Redis/Redlock делался с агентами, поэтому механику выучи так, чтобы объяснить на доске.</p>`,
        links: [['Kleppmann: How to do distributed locking', 'https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html']] },
    ]},

    { title: 'Архитектура', cards: [
      { id: 'solid', q: 'SOLID — с примерами из практики', tags: ['must'],
        short: `<ul><li><b>S</b> — Single Responsibility: у модуля одна причина для изменения.</li><li><b>O</b> — Open/Closed: расширяй, не правя существующее (композиция, стратегии).</li><li><b>L</b> — Liskov: наследник заменяет родителя без сюрпризов.</li><li><b>I</b> — Interface Segregation: маленькие специализированные интерфейсы вместо одного толстого.</li><li><b>D</b> — Dependency Inversion: зависеть от абстракций, а не от реализаций (DI в Nest).</li></ul>`,
        mine: `<p>Compound components + <code>asChild</code> в ui-baza — это Open/Closed: компонент расширяют композицией, а не новыми пропсами под каждый случай. Базовый стор таблиц — наследование. Хорошо, если сам скажешь, где оно уместно и где лучше композиция (LSP).</p>`,
        traps: ['DRY, KISS, YAGNI — и когда DRY вредит (преждевременная абстракция)', 'Composition over inheritance — с примером'] },

      { id: 'fsd', q: 'FSD, модульная архитектура, MVVM — что выбрал и почему?', tags: ['must', 'senior'],
        short: `<p><b>FSD</b> (Feature-Sliced Design) — слои <code>app → pages → widgets → features → entities → shared</code>, импорт только вниз, внутри слоёв — слайсы по бизнес-областям и сегменты ui/model/api. Плюсы: стандарт, понятные правила. Минусы: одна фича размазывается по нескольким слоям, бесконечные споры «это feature или entity».</p><p><b>Модульная (фрактальная)</b> архитектура группирует код по бизнес-модулям с публичным API и описанием, внутри модуль может повторять ту же структуру. <b>MVVM:</b> View (компонент) — ViewModel (состояние и логика представления, например MobX-стор) — Model (данные и бизнес-правила).</p>`,
        mine: `<p>Ты перевёл клиентское приложение с FSD на модульную фрактальную архитектуру (feod.dev) + MVVM. Почему: при быстрой разработке с агентами фичу, размазанную по слоям, тяжело ревьюить и сложно удерживать границы. У каждого модуля есть описание, людям и агентам проще ориентироваться. Границы закреплены ESLint, старые нарушения заморожены. Подробно — в «Защите резюме».</p>`,
        links: [['Feature-Sliced Design', 'https://feature-sliced.design/ru/'], ['feod.dev', 'https://feod.dev/']] },

      { id: 'sysdesign', q: 'Как отвечать на «спроектируй систему X»?', tags: ['senior'],
        short: `<ol><li><b>Требования:</b> функциональные и нефункциональные — сколько пользователей, RPS, требования к задержке и согласованности.</li><li><b>Оценка нагрузки «на салфетке»:</b> запросы в секунду, объём данных.</li><li><b>API и модель данных.</b></li><li><b>Общая схема:</b> клиент → CDN → балансировщик → сервисы → БД, кэш, очереди.</li><li><b>Узкие места:</b> кэш, индексы, шардинг, очереди, идемпотентность, ретраи.</li><li><b>Trade-off'ы вслух</b> — именно за это и оценивают.</li></ol>`,
        mine: `<p>Твои готовые кейсы: «спроектируй white-label платформу на тысячи клиентов» — это мультитенантность; «спроектируй конструктор страниц» — это bento-конструктор.</p>`,
        links: [['System Design Primer', 'https://github.com/donnemartin/system-design-primer']] },
    ]},

    { title: 'Тесты, DevOps, AI', cards: [
      { id: 'tests', q: 'Пирамида тестирования. Что и как тестировать?', tags: ['must'],
        short: `<p><b>Пирамида:</b> много unit-тестов (быстрые, изолированные), меньше интеграционных (модули вместе), немного e2e (весь стек в браузере: Playwright, Cypress — медленно и хрупко). Альтернатива — testing trophy: упор на интеграционные тесты компонентов.</p><p>Тестируй <b>поведение, а не реализацию</b>. Testing Library ищет элементы по роли и тексту — так, как их видит пользователь.</p>`,
        deep: `<p>Mocks, stubs, spies, fakes. Мокать стоит границы системы: сеть (MSW), время (fake timers), случайность. Не мокай то, что тестируешь. Покрытие — индикатор, а не цель.</p><p>Причины flaky-тестов: время, порядок выполнения, общее состояние, гонки в e2e.</p><p>Пулы в Vitest: <code>threads</code>, <code>forks</code>, <code>vmThreads</code>. vmThreads изолирует тесты через vm-контексты — быстрее, но возможны утечки памяти и проблемы с некоторыми модулями.</p>`,
        lang: 'tsx',
        code: `import { render, screen } from '@testing-library/react';

test('добавляет товар в корзину', async () => {
  render(<ProductCard product={product} />);

});`,
        mine: `<p>Клиентское приложение: переход с Jest на Vitest, параллельный прогон через vmThreads (выбор подтверждён бенчмарком конфигураций), около 560 тест-файлов. Playwright — для сверки UI с макетом. В skills-matrix тесты у тебя на уровне 2 и писались с агентами, поэтому будь готов объяснить любой тест и выбор vmThreads.</p>` },

      { id: 'docker', q: 'Docker: образ vs контейнер, слои, multi-stage', tags: ['must'],
        short: `<p><b>Образ</b> — неизменяемый шаблон из слоёв: каждая инструкция Dockerfile даёт слой, и слои кэшируются. <b>Контейнер</b> — запущенный экземпляр образа с изолированными процессами (namespaces) и лимитами ресурсов (cgroups). Это не виртуалка: ядро у контейнеров общее с хостом.</p><p><b>Multi-stage build</b> — собираешь в тяжёлом образе, а в лёгкий финальный копируешь только артефакты. Для кэша слоёв сначала копируй package*.json и ставь зависимости, и только потом копируй код.</p>`,
        lang: 'dockerfile',
        code: `FROM node:24-alpine AS deps
WORKDIR /app
COPY package.json package-lock.json ./
RUN npm ci

FROM node:24-alpine AS build
WORKDIR /app
COPY --from=deps /app/node_modules ./node_modules
COPY . .
RUN npm run build

FROM node:24-alpine
WORKDIR /app
ENV NODE_ENV=production
COPY --from=build /app/.next/standalone ./
COPY --from=build /app/.next/static ./.next/static
COPY --from=build /app/public ./public
CMD ["node", "server.js"]`,
        mine: `<p>Мультитенантность — это по сути история про Docker: раньше было N контейнеров, по одному на клиента (место на диске, перезапуск всех при каждом обновлении), стал один.</p>`,

      { id: 'ci', q: 'CI/CD и семантическое версионирование', tags: ['must'],
        short: `<p><b>CI</b> — на каждый push или MR: установка, линт, проверка типов, тесты, сборка, аудит зависимостей. Быстрая обратная связь, красный пайплайн не вливается. <b>CD</b> — автоматическая доставка на окружения.</p><p><b>SemVer</b> MAJOR.MINOR.PATCH: ломающее изменение, новая функциональность, исправление. <code>^1.2.3</code> разрешает версии до &lt;2.0.0, <code>~1.2.3</code> — до &lt;1.3.0. <b>semantic-release</b> вычисляет версию и changelog из conventional commits: feat → minor, fix → patch, BREAKING CHANGE → major.</p>`,
        mine: `<p>GitLab CI: <code>npm audit</code> блокирует MR, семантические теги релизов, кэши npm и Next. ui-baza — 51 версия в npm (1.0.0 → 1.11.1).</p>`,

        short: `<p>Формула: <b>«Архитектура, постановка задачи и качество — на мне, объём реализации — на агентах».</b></p><ul><li>Контекст репозитория для агентов: AGENTS.md/CLAUDE.md, ADR, описания модулей.</li><li>Скиллы под типовые задачи.</li><li>Spec-driven: сначала спецификация и контракт, потом код и тесты.</li><li>Линтер как жёсткие рельсы: архитектурные границы, которые агент не может нарушить.</li><li>Ревью по рискам: где деньги, гонки и безопасность — читаю каждую строку.</li><li>Мультиагентные workflow: проверка → валидация находок → исправление.</li></ul>`,
        mine: `<p>Около 100 агентов в workflow проверки переезда на новую архитектуру. 5 фронтенд-скиллов в vStack: граница проекта и UI-кита, правила ревью, синхронизация токенов с Figma. Публичный репозиторий scobar-skills — 21 скилл и шаблон AGENTS.md. Цифры ускорения «месяц → неделя» — твоя оценка, её нельзя проверить, поэтому на собесе её лучше не называть.</p>`,
        traps: ['«А сам-то код писать умеешь?» — да, ui-baza почти целиком написана тобой', '«Какие ошибки делают агенты?» — выдумывают API, обходят архитектуру, пишут тесты под реализацию, добавляют лишнюю сложность', '«Как не утонуть в ревью?»'] },

    { title: 'C++ и Qt (минимум)', cards: [
      { id: 'raii', q: 'RAII и умные указатели', tags: ['must'],
        short: `<p><b>RAII</b> — ресурс захватывается в конструкторе и освобождается в деструкторе. Деструктор вызывается при выходе из области видимости, даже при исключении, поэтому ресурсы не утекают.</p><p><code>unique_ptr</code> — единоличное владение, только move. <code>shared_ptr</code> — разделяемое владение со счётчиком ссылок (атомарный, есть накладные расходы). <code>weak_ptr</code> — наблюдатель без владения, разрывает циклы shared_ptr. Создавай через <code>make_unique</code>/<code>make_shared</code>, а не через <code>new</code>.</p>`,
        lang: 'cpp',
        code: `auto p = std::make_unique<Widget>();
auto q = std::move(p);          // p теперь пуст

auto a = std::make_shared<Node>();
std::weak_ptr<Node> w = a;      // счётчик не растёт
if (auto locked = w.lock()) { /* объект ещё жив */ }`,

      { id: 'qt', q: 'Сигналы и слоты, владение объектами в Qt', tags: ['must'],
        short: `<p><b>Сигналы и слоты</b> — типобезопасная реализация паттерна «наблюдатель» в Qt: <code>connect(sender, &amp;Sender::signal, receiver, &amp;Receiver::slot)</code>. Нужен макрос <code>Q_OBJECT</code> и moc. Между потоками используется <code>QueuedConnection</code>: слот выполнится в event loop потока получателя.</p><p><b>Владение:</b> QObject с parent удаляется вместе с родителем (дерево объектов). Поэтому <code>new</code> без <code>delete</code> — норма, если задан parent.</p>`,
        mine: `<p>В модели спутников ты совмещал подсчёт ссылок VTK с иерархией parent-child в Qt. Вероятный вопрос: «кто кого удаляет и как избежать double free или висячего указателя?». Подробно — в «Защите резюме».</p>`,

    { title: 'Grandbazar · мультитенантность', cards: [
      { id: 'mt-what', q: 'Расскажи про переход на мультитенантность', tags: ['must'],
        short: `<p><b>Было:</b> отдельный Docker-контейнер на каждого клиента программы лояльности. Это раздувало занятое место, и при каждом обновлении приходилось перезапускать все контейнеры. <b>Почему тогда:</b> на проде клиентов было немного, острой проблемы не было, но ожидалась сделка с сетью клиник на тысячи подключений. Решение было на опережение.</p><p><b>Стало:</b> один контейнер Next.js. Тенант определяется по домену, конфиг проекта (тема, тексты, OG image) приходит SSR-запросом и кэшируется, страница сразу открывается в оформлении клиента, без мигания. Новый клиент не требует отдельной сборки, обновление доставляется всем одним деплоем.</p><p><b>Моя роль:</b> предложил и сделал.</p>`,
