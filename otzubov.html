"express-eventloop": "JS умеет делать только одно дело за раз. Всё, что должно случиться «потом» (таймер, ответ сервера, клик), встаёт в очередь и ждёт, пока текущий код закончится. Очередей две: срочная (промисы) и обычная (таймеры, события). После каждого дела сначала полностью разбирается срочная, и только потом берётся одно дело из обычной. Отсюда порядок вывода в задачках: сначала весь обычный код, потом промисы, потом таймеры.",
"express-promises": "Промис — это талончик на результат, которого ещё нет: «заказ принят, ждите». Он либо выполнится с результатом, либо сорвётся с ошибкой, и изменить это потом нельзя. await — это «подожди талончик здесь, а потом продолжай», причём остальная программа в это время не стоит. Четыре метода отличаются тем, чего ждём от пачки талончиков: всех успешных, всех любых, первого любого или первого успешного.",
"express-scope": "Три способа завести переменную. var — старый: виден во всей функции и доступен ещё до строки объявления (со значением undefined), из-за чего баги. let и const видны только внутри своих фигурных скобок, и до строки объявления к ним обращаться нельзя — будет ошибка. const нельзя присвоить заново, но содержимое объекта в нём менять можно. «Всплытие» значит, что движок узнаёт о переменной заранее, до выполнения строки.",
"express-copy": "В переменной лежит не сам объект, а его адрес. Скопировал переменную — получил второй ключ от той же квартиры, а не вторую квартиру. Поверхностная копия делает новую квартиру, но мебель (вложенные объекты) остаётся общей. Глубокая копия дублирует всё до последнего вложенного уровня.",
"express-gc": "Движок сам убирает память: всё, до чего программа больше не может дотянуться по ссылкам, считается мусором и удаляется. Утечка — это когда вещь уже не нужна, но ссылка на неё где-то осталась: забытый таймер, подписка, кэш, который только растёт. Уборщик честно её не трогает, и память пухнет.",
"express-modules": "Модули — способ разбить код на файлы и брать из одного файла нужное в другом. Старый способ (require) — из мира Node: подключить можно где угодно и когда угодно. Новый (import/export) — стандарт языка: все подключения видны заранее, ещё до запуска. Благодаря этому сборщик может выкинуть код, который никто не импортирует, — это и есть tree shaking.",
"express-ts-interface": "И то, и другое — способ описать, из каких полей состоит объект. interface — как анкета, которую можно дополнять в другом месте и наследовать. type — просто имя для любого типа, в том числе «строка или число», чего interface не умеет. В быту разница небольшая: договоритесь в команде и держитесь одного стиля.",
"express-ts-generics": "Generic — это «дырка» для типа, которую заполняют при использовании. Пишешь функцию один раз «для любого типа T», а TypeScript сам подставляет нужный и следит, чтобы вход и выход сходились: дал массив чисел — получил число. Ограничение extends говорит: «любой тип, но только такой, у которого есть вот это».",
"express-ts-unknown": "any — «делай что хочешь, я не смотрю»: проверка типов выключена. unknown — «тут что-то лежит, но пока не проверишь, что именно, трогать не дам». never — «такого быть не может»: место в коде, до которого выполнение не дойдёт. Для данных из внешнего мира бери unknown и проверяй.",
"express-ts-utility": "Utility types — готовые «переделки» типов: сделать все поля необязательными, взять только часть полей, узнать, что возвращает функция. Не нужно описывать похожий тип заново — берёшь существующий и преобразуешь. Narrowing — это когда после проверки (typeof, in, сравнение поля) TypeScript сам понимает, что внутри if тип уже конкретнее.",
"express-crp": "Чтобы показать страницу, браузер читает HTML и строит дерево элементов, читает CSS и узнаёт, как что выглядит, потом считает, где что стоит и какого размера, и наконец красит пиксели. Пока не пришёл CSS, рисовать нечего, а обычный скрипт останавливает чтение HTML, пока сам не выполнится. Атрибуты defer и async говорят: «качай скрипт, не останавливая разбор страницы».",
"express-reflow": "Reflow — браузер заново считает размеры и положение элементов, как пересчёт раскладки мебели после того, как подвинули шкаф. Repaint — только перекрасить, ничего не двигая, это дешевле. Если в цикле то спрашивать размеры, то менять стили, браузеру приходится пересчитывать раскладку на каждом шаге — это и есть layout thrashing. Сначала всё прочитай, потом всё запиши.",
"express-events": "Клик по кнопке — это событие не только кнопки: оно проходит сверху от документа до кнопки и всплывает обратно через всех её родителей. Поэтому можно повесить один обработчик на общий контейнер и по event.target понять, по какому именно элементу кликнули. Это делегирование: один слушатель вместо сотни.",
"express-storage": "Это четыре «ящика» в браузере, куда сайт может положить данные. Cookie — маленькая записка, которую браузер сам прикладывает к каждому запросу на сервер. localStorage — тумбочка со строками, лежит, пока не выкинешь. sessionStorage — то же, но пропадает с закрытием вкладки. IndexedDB — целый шкаф с настоящей базой данных. Выбор зависит от того, нужно ли это серверу, сколько данных и как долго им жить.",
"express-url": "По шагам, как в путешествии. Браузер узнаёт по имени сайта его числовой адрес (DNS — телефонная книга интернета). Устанавливает соединение и договаривается о шифровании. Отправляет запрос «дай страницу». Сервер отвечает HTML. Браузер разбирает его, докачивает стили, скрипты и картинки и рисует страницу.",
"express-http": "HTTP — язык, на котором браузер говорит с сервером. Метод — это глагол: GET «дай», POST «создай», PUT «замени», PATCH «поправь», DELETE «удали». Код ответа — короткая оценка результата: 2xx «всё хорошо», 3xx «иди в другое место», 4xx «ты ошибся», 5xx «я сломался». Идемпотентный запрос можно повторить сколько угодно раз без вреда — как нажать кнопку вызова лифта.",
"express-cache": "Кэш — это «не качай то, что уже скачал». Сервер заголовками говорит браузеру, сколько можно пользоваться сохранённой копией и надо ли перед использованием спрашивать «не изменилось ли?». Если не изменилось, сервер отвечает коротким 304 без содержимого, и браузер берёт своё. Файлам с уникальным именем разрешают храниться год, а саму страницу просят перепроверять каждый раз.",
"express-cors": "Браузер по умолчанию не даёт скрипту одного сайта читать ответы другого — чтобы злой сайт не вытащил твои данные из банка, где ты залогинен. CORS — способ для сервера сказать браузеру: «вот этому сайту читать мои ответы можно». Перед «серьёзными» запросами браузер сначала шлёт пробный запрос OPTIONS и спрашивает разрешение. Это правило только браузера, серверы между собой ходят без него.",
"express-realtime": "Три способа узнать о новостях с сервера. Polling — каждые несколько секунд спрашивать «есть что?». SSE — подписаться и слушать: сервер сам пишет, когда что-то есть, но только в одну сторону. WebSocket — открытая телефонная линия: говорить могут оба в любой момент. Чем сложнее способ, тем больше забот, поэтому берут самый простой из подходящих.",
"express-auth": "Аутентификация — показать паспорт (кто ты), авторизация — проверить, есть ли у тебя пропуск в эту комнату (что тебе можно). Сессия: сервер помнит тебя и выдаёт номерок, как в гардеробе. JWT: сервер выдаёт подписанную справку, где всё написано, и сам ничего не помнит — проверяет только подпись. Номерок легко отменить, справку — нет, пока не истечёт её срок.",
"express-reconcile": "Ты описываешь, как должен выглядеть интерфейс, а React сам вычисляет, что поменять на странице. Для этого он хранит лёгкий чертёж страницы, после изменения строит новый чертёж, сравнивает со старым и правит в настоящей странице только различия. key в списке — это бирка с именем: по ней React понимает, что элемент тот же самый, просто переехал.",
"express-rerender": "Ре-рендер — React заново вызывает функцию компонента, чтобы узнать, что рисовать. Это происходит, когда изменилось состояние самого компонента или перерисовался его родитель. Обычно это дёшево. memo, useMemo и useCallback — способы сказать «если входные данные те же, не пересчитывай». Ставить их везде не нужно — только там, где замеры показали тормоза.",
"express-effects": "useEffect — место для дел «на стороне» после того, как React нарисовал: подписаться, запросить данные, запустить таймер. Функция, которую эффект возвращает, — уборка за собой: отписаться, отменить, остановить. useLayoutEffect — то же, но срабатывает до того, как пользователь увидит кадр, поэтому годится для замеров и правок, которые не должны мигать.",
"express-state": "State management — это ответ на вопрос «где хранить данные приложения и как компоненты узнают, что они поменялись». Для маленького хватит useState. Когда данные нужны многим экранам, заводят общее хранилище (стор). Библиотеки отличаются стилем: Redux — строго и многословно, Zustand — минимально, MobX — меняешь поле объекта, и всё, что его использует, обновляется само.",
"express-ssr": "Вопрос в том, где и когда собирается HTML страницы. CSR — в браузере: сначала пустая страница, потом JS всё рисует. SSR — на сервере на каждый запрос: пользователь сразу получает готовую страницу. SSG — один раз при сборке проекта: быстрее всего, но данные застывшие. ISR — как SSG, но страница время от времени пересобирается в фоне.",
"express-hydration": "Сервер прислал готовую, но «мёртвую» страницу: её видно, но кнопки не работают. Гидратация — React в браузере проходит по этой разметке и подключает к ней обработчики и состояние, оживляя её. Mismatch — когда то, что нарисовал бы браузер, не совпадает с присланным сервером, например из-за текущего времени или случайного числа в разметке.",
"express-rsc": "Часть компонентов выполняется только на сервере и в браузер приходит уже готовым результатом, без их кода. Они могут напрямую читать базу, но не умеют реагировать на клики. Интерактивные компоненты помечают 'use client' — они работают как раньше. Смысл в том, чтобы отправлять в браузер меньше JavaScript.",
"express-cascade": "Когда на элемент претендуют несколько правил CSS, браузер выбирает победителя. Обычно побеждает более «точный» селектор (id сильнее класса, класс сильнее тега), а при равенстве — тот, что написан позже. @layer добавляет уровень выше: стили раскладывают по слоям, и слой, объявленный позже, побеждает ранний, каким бы точным там ни был селектор.",
"express-flexgrid": "Flexbox раскладывает элементы в одну линию — в ряд или столбик — и распределяет между ними свободное место. Grid — это таблица-сетка: ты задаёшь строки и колонки и расставляешь элементы по клеткам. Ряд кнопок или меню — flex. Раскладка страницы или сетка карточек — grid.",
"express-css-approaches": "Проблема одна: в большом проекте имена классов сталкиваются, и стили ломают друг друга. БЭМ решает это длинными именами по договорённости. CSS Modules — сборщик сам делает имена уникальными. CSS-in-JS — стили пишутся прямо в JavaScript рядом с компонентом. Tailwind — готовые мелкие классы «отступ 4», «текст красный», которые набирают прямо в разметке.",
"express-cwv": "Три оценки от Google, насколько сайт приятен человеку. LCP — как быстро появилось главное содержимое. INP — как быстро страница отвечает на клик или ввод. CLS — не прыгает ли вёрстка, пока грузится (когда хотел нажать, а кнопка уехала). Меряют на реальных пользователях, а не на твоём мощном ноутбуке.",
"express-perf": "Три направления: грузить меньше (делить код, сжимать картинки), доставлять быстрее (кэш, сервер поближе к пользователю) и меньше работать в браузере (не рисовать невидимое, не считать лишнее). Но сначала всегда измерить, что именно тормозит, иначе будешь чинить не то.",
"express-a11y": "Доступность — чтобы сайтом мог пользоваться человек без мыши, без зрения или с плохим экраном. Основа простая: использовать правильные HTML-теги (кнопка — это button, а не div), подписывать поля и картинки, чтобы всё работало с клавиатуры и текст был достаточно контрастным. ARIA — дополнительные подсказки для программ чтения с экрана, когда обычных тегов не хватает.",
"express-xss": "XSS — злоумышленник подсовывает на твою страницу свой скрипт, например через комментарий, и скрипт выполняется у других посетителей от их имени. Защита — никогда не вставлять чужой текст на страницу как HTML, только как обычный текст. CSP — список, который сервер даёт браузеру: «скрипты разрешены только из этих мест», всё остальное браузер не запустит.",
"express-csrf": "Ты залогинен в банке. Заходишь на злой сайт, а он тайком отправляет от тебя запрос в банк — и браузер сам прикладывает твои cookie, так что банк думает, что это ты. Защита: помечать cookie так, чтобы они не уходили с чужих сайтов (SameSite), и требовать в запросе секретный токен, которого злой сайт знать не может.",
"express-node-loop": "В Node тот же принцип одной очереди, что и в браузере, но круг разбит на этапы: сначала таймеры, потом ввод-вывод (сеть, файлы), потом setImmediate. Между любыми двумя делами без очереди проходят process.nextTick и промисы. Тяжёлые операции с файлами и шифрованием Node тихо отдаёт нескольким фоновым потокам, чтобы не стоять.",
"express-nest": "NestJS — каркас для бэкенда, который заставляет раскладывать код по полочкам. Контроллер принимает запрос, сервис делает работу, модуль собирает их в одну коробку. Нужные зависимости Nest сам подаёт в конструктор (это DI). Запрос по пути проходит посты: охранник (можно ли?), проверка данных, сам обработчик, оформление ответа и ошибок.",
"express-queues": "Очередь — это «не делай сейчас, положи в список, сделаю позже». Пользователю сразу отвечают «принято», а письмо отправляется или файл генерируется в фоне отдельным работником. Если работник упал, задача остаётся в очереди и будет повторена. Bull, RabbitMQ и Kafka — разные по мощности реализации этой идеи.",
"express-sql-nosql": "Реляционная база — набор таблиц, как в Excel, со строгими колонками и связями между таблицами: заказ ссылается на клиента. Данные лежат аккуратно и без повторов, собирают их запросами с JOIN. Нереляционная хранит по-другому, чаще всего целыми документами: заказ вместе с товарами одной «папкой». Первая сильна в связях и строгости, вторая — в гибкости и простоте масштабирования.",
"express-indexes": "Индекс — как алфавитный указатель в конце книги. Без него, чтобы найти слово, надо листать всю книгу. С ним — открыл указатель, увидел страницу, сразу перешёл. В базе то же самое: без индекса она перебирает все строки, с индексом находит нужные за несколько шагов. Плата — указатель занимает место, и его надо обновлять при каждой записи.",
"express-acid": "Транзакция — несколько действий, которые либо выполняются все, либо не выполняется ни одно. Классика: списать деньги с одного счёта и зачислить на другой. Если между этими шагами всё упадёт, база откатит первый, и деньги не пропадут. ACID — четыре обещания такой базы: всё или ничего, данные всегда корректны, параллельные операции не мешают друг другу, сохранённое не потеряется.",
"express-isolation": "Когда с базой одновременно работают многие, они могут увидеть «полуготовые» данные друг друга. Уровень изоляции — настройка, насколько строго база прячет чужие незаконченные изменения. Чем строже, тем меньше странностей (аномалий), но тем медленнее и тем чаще приходится повторять операции. Обычно хватает уровня по умолчанию плюс точечных блокировок там, где деньги.",
"express-normal": "Нормализация — хранить каждый факт в одном месте. Имя клиента лежит в таблице клиентов, а в заказе — только ссылка на него. Тогда при смене имени правишь одну строку, а не тысячу. Денормализация — сознательно продублировать данные рядом, чтобы читать быстрее и не собирать из нескольких таблиц. Плата — копии надо держать одинаковыми.",
"express-n1": "N+1 — когда ты получил список из ста заказов одним запросом, а потом для каждого заказа отдельным запросом идёшь за клиентом: всего 101 запрос вместо двух. Лечится тем, чтобы забрать всех нужных клиентов разом. Aggregation pipeline в Mongo — конвейер: документы идут через станки «отфильтровать», «склеить», «сгруппировать», «отсортировать».",
"express-redis": "Redis — сверхбыстрая «записная книжка» в оперативной памяти: положил значение по ключу, достал по ключу. Используют как кэш, для счётчиков, очередей. Распределённая блокировка — табличка «занято» в Redis: кто первый её повесил, тот и работает, остальные ждут. У таблички есть срок годности, чтобы она не висела вечно, если повесивший упал.",
"express-solid": "Пять правил, чтобы код было не страшно менять. Один модуль — одна задача. Новое поведение добавляй рядом, а не переписывая старое. Наследник не должен ломать ожидания от родителя. Не заставляй зависеть от того, что не нужно. Завись от договорённости (интерфейса), а не от конкретной реализации.",
"express-fsd": "Это способы разложить файлы большого фронтенда, чтобы в нём не утонуть. FSD делит проект на слои по «высоте»: страницы, виджеты, фичи, сущности, общее. Модульный подход делит по бизнес-темам: всё про корзину лежит в одной папке. MVVM отделяет картинку (компонент) от логики и состояния экрана (отдельный класс-стор).",
"express-sysdesign": "Тебя просят «спроектируй X» не ради правильного ответа, а чтобы увидеть, как ты рассуждаешь. Порядок такой: выясни, что нужно и сколько пользователей, прикинь нагрузку, набросай API и данные, нарисуй общую схему, найди слабые места и вслух взвесь варианты.",
"express-tests": "Тесты — программы, которые проверяют твою программу. Маленькие (unit) проверяют одну функцию и работают мгновенно, средние — несколько частей вместе, большие (e2e) кликают в настоящем браузере, как пользователь. Маленьких должно быть много, больших — мало, потому что они медленные и капризные. Проверять надо то, что видит пользователь, а не внутреннее устройство.",
"express-docker": "Docker упаковывает приложение вместе со всем, что ему нужно для запуска, в одну «коробку». Образ — это рецепт и заготовка, контейнер — запущенный по нему экземпляр. Благодаря этому «у меня работает» превращается в «работает везде». Multi-stage — собирать приложение в большой коробке с инструментами, а в прод отдавать маленькую только с готовым результатом.",
"express-ci": "CI — робот, который на каждый твой коммит сам проверяет код: линтер, типы, тесты, сборка. Если что-то сломано, влить не даст. CD — тот же робот сам выкатывает проверенный код на сервер. SemVer — договорённость о трёх цифрах версии: сломал совместимость — меняй первую, добавил фичу — вторую, починил баг — третью.",
"express-ai": "Суть ответа: агент пишет код быстро, но не отвечает за результат — отвечаешь ты. Поэтому ты даёшь агенту понятную задачу и правила проекта, ставишь автоматические проверки, которые он не может обойти, и сам внимательно читаешь рискованные места.",
"express-raii": "В C++ память и прочие ресурсы надо освобождать самому. RAII — приём, чтобы не забыть: ресурс берётся при создании объекта и автоматически отдаётся, когда объект перестаёт существовать. Умные указатели — готовые такие объекты для памяти: unique_ptr — один хозяин, shared_ptr — несколько хозяев со счётчиком, память освобождается, когда ушёл последний.",
"express-qt": "В Qt объекты общаются сигналами: кнопка «кричит» clicked, а все, кто подписался (слоты), на это реагируют. Кнопка при этом не знает, кто её слушает. А владение устроено деревом: у объекта есть родитель, и когда удаляется родитель, он удаляет всех своих детей — поэтому их не надо удалять вручную.",

"resume-pitch": "Это твоя минутная визитка. Интервьюер за минуту должен понять три вещи: кто ты, что самое сильное ты сделал и чего хочешь. Всё остальное он спросит сам, поэтому не пересказывай резюме.",
"resume-ai-honesty": "Правило простое: не приписывай себе то, что написал агент, но умей объяснить, как оно работает. Честное «реализовал агент по моей постановке, а устроено это так…» звучит сильнее, чем «я сам», после которого ты не можешь ответить на уточняющий вопрос.",
"resume-mt-what": "Мультитенантность — это когда одна запущенная копия приложения обслуживает сразу многих клиентов (тенантов), и каждый видит своё оформление и свои данные. Как один многоквартирный дом вместо отдельного коттеджа каждому жильцу: дешевле содержать и ремонт делается разом для всех.",
"resume-mt-how": "Приложение смотрит, на какой адрес сайта пришёл запрос, и по нему понимает, чей это клиент. Потом берёт настройки этого клиента (цвета, тексты) и рисует страницу в его оформлении. Чтобы не спрашивать настройки на каждый запрос, их на время запоминают — это кэш. Вопрос интервьюера будет про то, где лежит эта память и как она обновляется, когда клиент поменял настройки.",
"resume-mt-migrate": "Переезжали не «выключили старое, включили новое», а запустили новую схему рядом со старой, убедились, что она работает, и только потом перевели на неё людей. Старая оставалась запасным аэродромом на случай проблем.",
"resume-rewrite-why": "Раньше код одной фичи был разбросан по нескольким папкам-слоям, и, чтобы понять её целиком, приходилось прыгать по проекту. Перешли на схему, где всё про одну бизнес-тему лежит в одном модуле с понятным входом. Так проще читать, проверять и объяснять задачу и человеку, и агенту.",
"resume-rewrite-verify": "После большой переделки главный страх — что-то незаметно сломалось. Проверяли так: много агентов параллельно прокликивали разные части приложения и сравнивали поведение со старой версией. Отдельные агенты перепроверяли найденные проблемы, чтобы отсеять ложные тревоги.",
"resume-eslint": "ESLint — программа, которая автоматически проверяет код по правилам. Ты добавил правила не только про стиль, но и про архитектуру: «этот модуль не имеет права лезть внутрь того». Старые нарушения записали в список исключений, чтобы не чинить всё сразу, а новые линтер не пропускает.",
"resume-wallet": "Две фичи: сканер, который через камеру телефона читает штрихкод или QR, и кнопка «добавить карту в кошелёк телефона» (Apple Wallet или Google Wallet). Сложность была не в коде, а в том, что документация у Apple и Google местами устарела.",
"resume-uib-why": "UI-библиотека — общий набор готовых кнопок, полей, таблиц, который подключают в разные приложения. Сделали свою, чтобы два продукта выглядели одинаково и чтобы предпросмотр в админке был точной копией того, что увидит покупатель.",
"resume-uib-layer": "Проблема любой библиотеки компонентов: приложению надо иногда перекрасить её кнопку, а стили библиотеки «сильнее» и не дают. Решение — положить все стили библиотеки в отдельный слой CSS, который по правилам браузера всегда уступает обычным стилям приложения. Тогда любое правило приложения побеждает без трюков.",
"resume-uib-api": "Compound components — компонент-конструктор: вместо одной таблицы с сотней настроек даёшь набор деталей (шапка, тело, пагинация), и человек собирает из них что нужно. asChild — способ сказать кнопке: «не рисуй свой тег, а отдай свой вид и поведение вот этому элементу», например ссылке.",
"resume-uib-tokens": "Токены — это названные значения дизайна: «основной цвет», «средний отступ», «радиус скругления». Они записаны в CSS-переменные, и компоненты берут значения оттуда. Чтобы сделать тёмную тему, достаточно подменить значения переменных, не трогая сами компоненты.",
"resume-uib-release": "Библиотеку публикуют в npm под номером версии. По номеру видно, опасно ли обновляться: изменилась первая цифра — что-то сломано намеренно, вторая — добавлено новое, третья — исправлена ошибка. Перед выпуском автоматически прогоняются тесты и проверки.",
"resume-bento-what": "Конструктор — редактор, в котором клиент сам собирает страницу своей акции из готовых блоков, без программиста. Bento — раскладка плитками разного размера, как коробка для ланча с отделениями. Ты вёл эту фичу от идеи до продакшена.",
"resume-bento-model": "Вопрос про то, как раскладка хранится в базе. Она записана прямо внутри документа страницы, потому что всегда читается и сохраняется вместе со страницей. А игровые механики хранятся отдельно, и страница лишь ссылается на них по идентификатору, потому что они существуют сами по себе и используются в разных местах.",
"resume-bento-algo": "Задача — уложить плитки разного размера в сетку так, чтобы не осталось пустых клеток. Алгоритм действует как человек с пазлом: находит первую пустую клетку, пробует поставить туда плитку, идёт дальше; если упёрся в тупик — возвращается на шаг назад и пробует другую плитку. Занятые клетки строки хранятся как одно число из нулей и единиц, поэтому проверка «влезет ли» очень быстрая.",
"resume-bento-migrate": "Когда меняется формат хранения, старые данные нужно перевести в новый — это миграция. Твоя написана так, что её можно запускать сколько угодно раз: уже переведённые страницы она пропускает. Если упала на середине — просто запускаешь снова.",
"resume-scratch-why": "Скретч-карта — «сотри и узнай приз». Выигрыш определяется на сервере в момент начала игры, а не в браузере. Иначе игрок мог бы подсмотреть или подменить результат. Случайность берётся из надёжного генератора, который нельзя предсказать.",
"resume-scratch-race": "Гонка — когда два одинаковых запроса приходят одновременно (двойной клик, два устройства) и оба успевают пройти проверку, пока ни один ещё ничего не записал: в итоге приз выдан дважды. Защита в два слоя: сначала «замок» на игрока, чтобы запросы шли по одному, а потом база сама разрешает перевести сессию в «завершена» только один раз.",
"resume-tables": "В админке много таблиц, и все они умеют одно и то же: сортировку, поиск, страницы. Чтобы не писать это каждый раз, сделан общий класс с этой логикой, а каждая конкретная таблица добавляет только своё. Фильтры записываются в адрес страницы, поэтому ссылку можно переслать коллеге.",
"resume-forms": "Форма опроса не запрограммирована заранее: её описание (какие поля, какие проверки) лежит в настройках, а код по этому описанию рисует форму. Нужен новый опрос — меняешь настройки в админке, а не зовёшь программиста.",
"resume-responsive": "Админка была рассчитана только на большой экран. Адаптив — это чтобы ею можно было пользоваться с телефона: меню спрятали под кнопку-бургер, широкие таблицы превратили в карточки.",
"resume-vs-role": "Product engineer — человек, который ведёт фичу целиком: выясняет, что нужно, пишет описание, согласует макет, добивается работающего результата и сдаёт заказчику. Не «мне дали задачу — я написал код», а ответственность за то, чтобы фича получилась.",
"resume-vs-charts": "В продукте были графики на сторонней библиотеке. Их заменили своими компонентами: у графиков на одной странице общая шкала времени, и линия-курсор двигается на всех сразу, когда ведёшь мышью по одному. Стороннюю библиотеку после этого удалили.",
"resume-vs-vue": "Оба делают одно — строят интерфейс из компонентов. Vue сам следит, какие данные ты использовал, и точечно обновляет зависящее от них. React при изменении заново вызывает функцию компонента и сравнивает результат с прошлым. Тебе Vue дался легко, потому что MobX, на котором ты работал в React, устроен по тому же принципу слежения за данными.",
"resume-vs-skills": "Скилл — это написанная для AI-агента инструкция, как в этом проекте правильно делать типовую вещь. Ты написал пять таких, и агент перестал повторять одни и те же ошибки, а ревью стало короче.",
"resume-vl-map": "Проект для города: на карте в реальном времени видно, где едут автобусы и трамваи. Ты сделал саму карту: точки машин, кнопки управления, переключение слоёв.",
"resume-vl-cms": "Два проекта. Первый — админка для сервиса вызова адвоката: заявки, пользователи, чат. Второй — сайт, где человек заполняет форму, платит и получает готовый документ иска со своими данными.",
"resume-vympel": "Здесь важно не преувеличить. Ты не придумывал алгоритмы, а брал существующие и встраивал их в новую программу для нового объекта. Говори «адаптировал и интегрировал» — это честно и всё равно звучит достойно.",
"resume-satellite": "Программа считает, где находятся спутники на орбите, и показывает их в 3D. Тонкость для собеса: библиотека 3D-графики и библиотека интерфейса каждая по-своему решают, когда удалять объекты из памяти, и нельзя доверять один объект сразу обеим — он будет удалён дважды.",
"db-keys": "Первичный ключ — уникальный номер строки, как номер паспорта: по нему строку нельзя перепутать с другой. Внешний ключ — колонка, где записан номер строки из другой таблицы: в заказе лежит номер клиента. База следит, чтобы такой клиент действительно существовал. Связи бывают «один к одному», «один ко многим» (у клиента много заказов) и «многие ко многим» (у студента много курсов, на курсе много студентов) — для последней нужна третья таблица-связка.",
"db-joins": "JOIN склеивает строки двух таблиц по совпадающему значению: к каждому заказу приклеить его клиента. INNER оставляет только пары, где совпадение нашлось. LEFT оставляет все строки левой таблицы, а если пары нет — справа будут пустые значения. База выполняет запрос не в том порядке, в каком он написан: сначала берёт таблицы, потом фильтрует, группирует и только в конце выбирает колонки.",
"db-window": "GROUP BY схлопывает группу строк в одну: «сумма по клиенту». Оконная функция считает то же самое, но оставляет все строки на месте и рядом с каждой дописывает результат: «это заказ, а вот его место в рейтинге заказов этого клиента». Удобно для топов, нумерации и нарастающих итогов.",
"db-mongo-model": "В Mongo связанные данные можно положить внутрь документа (встроить) или хранить отдельно и держать ссылку. Встраивай то, что всегда нужно вместе с родителем и чего немного: адреса в профиле. Ссылайся на то, что живёт своей жизнью или чего может стать очень много: заказы пользователя.",
"db-explain": "EXPLAIN — это просьба к базе: «расскажи, как ты собираешься выполнять запрос». В ответ она показывает план: будет ли листать всю таблицу подряд или пойдёт по индексу, сколько строк ожидает и сколько времени ушло. Это главный инструмент, чтобы понять, почему запрос медленный.",
"db-pg-indexes": "Индексы бывают хитрее обычного. Частичный — указатель только по нужной части строк, например только по неудалённым. По выражению — указатель по вычисленному значению, например по email в нижнем регистре. Покрывающий — в указателе сразу лежат нужные данные, и в саму таблицу ходить не приходится.",
"db-pagination": "Два способа отдавать список порциями. Первый: «пропусти 1000 строк и дай следующие 20» — просто, но базе всё равно приходится пройти эту тысячу, и чем дальше страница, тем медленнее. Второй: «дай 20 строк после вот этой последней, которую я видел» — база сразу прыгает в нужное место по индексу, и скорость не падает.",
"db-pool": "Открывать новое соединение с базой на каждый запрос дорого — как каждый раз заново звонить и представляться. Пул держит несколько уже открытых соединений и выдаёт свободное тому, кому нужно, а потом забирает обратно. Как стоянка такси у вокзала.",
"db-locks": "Блокировка — способ сказать «я сейчас работаю с этой строкой, остальные подождите». SELECT FOR UPDATE ставит такой замок до конца транзакции. Deadlock — взаимный тупик: первый держит A и ждёт B, второй держит B и ждёт A. База это замечает и отменяет одного из них.",
"db-mvcc": "Postgres при изменении строки не затирает её, а пишет новую версию рядом, оставляя старую. Благодаря этому тот, кто читает, спокойно видит прежнюю версию и никого не ждёт, пока другой пишет. Старые версии со временем становятся мусором, и VACUUM — это уборщик, который их вычищает.",
"db-mongo-tx": "В Mongo изменение одного документа всегда происходит целиком: либо всё записалось, либо ничего. Поэтому данные, которые должны меняться вместе, стараются держать в одном документе. Если нужно атомарно изменить несколько документов, есть транзакции, но они дороже и требуют особой настройки сервера.",
"db-replication": "Репликация — держать копии базы на нескольких серверах: если один умер, работает другой, и читать можно с копий. Шардинг — разрезать данные на части и разложить по разным серверам: клиенты А–М тут, Н–Я там, чтобы справиться с объёмом и потоком записи. Партиционирование — разрезать большую таблицу на куски внутри одного сервера, например по месяцам.",
"db-cap": "Если связь между серверами базы порвалась, у тебя два варианта. Либо отказываться отвечать, пока связь не вернётся, зато не отдавать устаревшее. Либо отвечать тем, что есть, рискуя, что данные уже неактуальны. Оба сразу получить нельзя — это и есть теорема CAP.",
"db-migrations": "Менять структуру базы под работающим сайтом надо так, чтобы ничего не упало. Рецепт из трёх шагов: сначала добавь новое, не трогая старое; потом научи код работать с новым и перенеси данные; и только когда старым никто не пользуется, удали его. В каждый момент работают и старая, и новая версия кода.",
"db-orm": "ORM — прослойка, которая позволяет работать с базой как с обычными объектами в коде, не выписывая SQL руками. Удобно и безопасно для простых операций. Но если не понимать, какие запросы она делает за тебя, легко получить сотню лишних запросов там, где хватило бы одного.",
"db-caching": "Кэш — быстрая копия данных поблизости, чтобы не ходить каждый раз за оригиналом в медленную базу. Главные вопросы: когда копия устаревает и как об этом узнать. Обычно копии дают срок жизни и удаляют её, когда оригинал поменялся. Если память кончается, выбрасывают то, чем давно не пользовались.",

"js-numbers": "Компьютер хранит дробные числа в двоичном виде, а 0.1 в нём записывается бесконечной дробью — как одна треть в десятичном (0.3333…). Приходится обрезать, и появляется крошечная погрешность. Поэтому 0.1 + 0.2 даёт 0.30000000000000004. Деньги считают в копейках целыми числами — у целых этой проблемы нет.",
"js-iterators": "Итератор — это «выдавай мне элементы по одному, пока не кончатся». Всё, что так умеет (массив, строка, Map, Set), можно перебирать через for...of и раскрывать через три точки. Генератор — функция, которая умеет ставить себя на паузу и отдавать значения по одному по запросу, не вычисляя всё заранее.",
"js-descriptors": "У каждого свойства объекта есть скрытые настройки: можно ли его менять, удалять, видно ли оно при переборе. Proxy — обёртка-посредник вокруг объекта: любое чтение или запись свойства сначала попадает к посреднику, и он может что-то сделать, например запомнить, кто читал. На этом работают MobX и Vue: так они узнают, что и где используется.",
"js-mapset": "Map — словарь «ключ → значение», где ключом может быть что угодно, а не только строка, и порядок сохраняется. Set — мешок уникальных значений: положил два раза одно и то же — лежит одно. WeakMap — словарь, который не мешает уборщику памяти удалить объект-ключ, когда он больше никому не нужен.",
"js-arrays": "Методы массивов делятся на две группы. Одни меняют сам массив (push, sort, splice), другие возвращают новый и не трогают исходный (map, filter, slice). Путать их опасно: в React изменение массива на месте не приведёт к перерисовке. Для опасных методов появились безопасные двойники: toSorted вместо sort и так далее.",
"js-hof": "Функция высшего порядка — функция, которая принимает другую функцию или возвращает её. Ты пользуешься ими каждый день: map принимает функцию «что сделать с каждым элементом». Каррирование — вызывать функцию по частям: сначала дал один аргумент, получил функцию, которая ждёт остальные. Мемоизация — запомнить ответ для уже виденных аргументов и не считать заново.",
"js-debounce": "Оба нужны, чтобы функция не вызывалась слишком часто. Debounce — «подожди, пока человек перестанет»: поиск стартует, когда пользователь закончил печатать, а не на каждую букву. Throttle — «не чаще раза в N миллисекунд»: при прокрутке обработчик срабатывает, скажем, раз в 100 мс, а не тысячу раз.",
"js-call-apply": "Все три позволяют вызвать функцию и вручную указать, что будет у неё this. call и apply вызывают сразу, отличаются только формой аргументов: через запятую или массивом. bind не вызывает, а возвращает новую функцию с навсегда привязанным this — удобно, когда функцию надо куда-то передать и не потерять контекст.",
"js-promise-all": "Promise.all — «дождись всех и дай результаты в том же порядке». Написать его самому — классическое задание: заводишь массив результатов и счётчик, каждый промис кладёт свой ответ на своё место, и, когда счётчик дошёл до нуля, отдаёшь массив. Если хоть один упал — сразу ошибка. promisify превращает функцию старого стиля с колбэком в функцию, возвращающую промис.",
"js-retry": "Сеть ненадёжна: запрос может не дойти или зависнуть. Ретрай — попробовать ещё раз, но с растущей паузой, чтобы не добивать сервер, которому и так плохо. Таймаут — не ждать ответа вечно. Отмена — сказать «этот запрос больше не нужен», например когда пользователь уже ввёл другой текст в поиске.",
"js-output-tasks": "Задачи «что выведет консоль» решаются механически по одному алгоритму. Сначала выполняется весь обычный код сверху вниз. Потом все отложенные промисы (then, код после await) в порядке появления. Потом таймеры. Не пытайся угадать — выписывай на бумаге три списка.",
"js-errors": "Ошибку можно бросить (throw) и поймать (try/catch). Чтобы различать ошибки, делают свои классы: «ошибка сети», «ошибка валидации» — и в catch смотрят, какая пришла. Блок finally выполняется в любом случае, упало или нет: в нём убирают за собой, например выключают индикатор загрузки.",
"js-modern": "Каждый год в язык добавляют удобства. Достаточно знать самое ходовое: вопросик с точкой (не падать, если объекта нет), два вопросика (значение по умолчанию только для null и undefined), приватные поля через решётку, новые методы массивов, которые не портят исходный массив. Годы запоминать не нужно — важно, что ты этим пользуешься.",
"js-strict": "Строгий режим — настройка, при которой JS перестаёт молча прощать ошибки. Например, опечатка в имени переменной вызовет ошибку, а не создаст новую глобальную переменную. В современном коде (модули, классы) он включён автоматически, так что ты уже в нём живёшь.",

"react-jsx": "JSX — это способ писать разметку прямо в JavaScript. Браузер его не понимает, сборщик превращает каждый тег в вызов функции, которая возвращает обычный объект-описание: «нарисуй div с такими свойствами». Компонент — функция, возвращающая такое описание. Вызывает её React, а не ты.",
"react-state-snapshot": "Значение состояния внутри одного вызова компонента не меняется — это как фотография на момент рендера. setCount не меняет переменную прямо сейчас, а просит React перерисовать компонент с новым значением. Поэтому два подряд setCount(count + 1) дадут плюс один: оба смотрят на одну и ту же фотографию. Чтобы опираться на свежее значение, передают функцию.",
"react-controlled": "Controlled — значение поля хранит React: каждое нажатие клавиши проходит через твой код, и ты полностью управляешь содержимым. Uncontrolled — поле живёт само, как в обычном HTML, а ты читаешь значение, когда оно понадобится, например при отправке. Первое даёт больше контроля, второе проще и быстрее.",
"react-refs": "useRef — коробочка, в которую можно положить значение, и оно сохранится между перерисовками, но его изменение перерисовку не вызывает. Чаще всего в неё кладут ссылку на настоящий элемент страницы, чтобы, например, поставить в него фокус. forwardRef раньше был нужен, чтобы передать такую ссылку внутрь своего компонента, в React 19 это делается обычным пропсом.",
"react-context": "Context — способ передать данные глубоко вниз по дереву компонентов, не протаскивая их через пропсы на каждом уровне. Как объявление по громкой связи: слышат все, кто подписан. Обратная сторона: когда значение меняется, перерисовываются все подписчики. Поэтому в контекст кладут то, что меняется редко: тему, язык, текущего пользователя.",
"react-hooks-rules": "React запоминает состояние хуков просто по номеру: первый вызванный хук, второй, третий. Если хук окажется внутри if и на одном рендере вызовется, а на другом нет, нумерация съедет, и состояния перепутаются. Отсюда правило: хуки только на верхнем уровне компонента и всегда в одном и том же порядке.",
"react-concurrent": "React умеет делить обновления на срочные и несрочные. Ввод в поле — срочно, перерисовка огромного списка под этот ввод — может подождать. Если пометить обновление как несрочное, React займётся им в свободное время и бросит, если пришло что-то поважнее. Suspense — способ показать заглушку, пока часть интерфейса ещё не готова.",
"react-react19": "Главное в 19-й версии: стало проще работать с формами и отправкой данных — React сам следит за состоянием «отправляется» и ошибками. Появился хук use, чтобы читать промис или контекст. ref теперь передаётся как обычный пропс. Серверные компоненты стали стабильными.",
"react-patterns": "Это приёмы, как делать компоненты гибкими. Compound — компонент из деталей, которые собирает сам пользователь (Tabs и Tabs.Panel). Render props — компоненту дают функцию «как нарисовать вот эту часть». HOC — функция-обёртка, добавляющая компоненту поведение. Headless — компонент со всей логикой, но без внешнего вида: стили ты пишешь сам.",
"react-error-boundary": "Если компонент упал с ошибкой во время отрисовки, по умолчанию пропадает весь интерфейс — белый экран. Error boundary — «предохранитель»: оборачиваешь им часть страницы, и при падении внутри вместо неё показывается запасной вид («что-то пошло не так»), а остальная страница продолжает работать.",
"react-mobx-deep": "MobX работает как таблица Excel. Есть ячейки с данными, есть формулы, которые от них зависят. Поменял ячейку — пересчитались только те формулы, что на неё ссылаются. MobX сам замечает, какие данные читает компонент во время отрисовки, и перерисовывает его, только когда поменялись именно они.",
"react-react-perf": "Порядок действий при тормозах в React: сначала найти профилировщиком, что именно перерисовывается и почему. Потом самое дешёвое — перенести состояние ближе к месту использования, чтобы меньше компонентов затрагивалось. Длинные списки рисовать только в видимой части. И только потом точечно добавлять мемоизацию.",
"react-app-router": "В Next есть два способа организовать страницы. Старый — папка pages: каждая страница целиком отправляется в браузер. Новый — папка app: компоненты по умолчанию выполняются на сервере, общие рамки страниц (layout) не перерисовываются при переходах, а для состояний «загрузка» и «ошибка» достаточно положить файл с нужным именем.",
"react-next-cache": "Next старается не делать одну и ту же работу дважды и запоминает результаты на нескольких уровнях: ответы запросов, готовые страницы, уже посещённые страницы в браузере. Из-за этого бывает «я поменял данные, а на сайте старое». Нужно понимать, какой уровень запомнил и как сказать ему обновиться (revalidate).",
"react-next-middleware": "Middleware — код, который выполняется перед тем, как запрос попадёт на страницу. Как вахтёр на входе: может развернуть (редирект), не пустить или тихо направить в другой кабинет. Для мультитенантности он смотрит на адрес сайта и направляет запрос на страницы нужного клиента.",
"react-next-image": "next/image — «умная картинка»: сама отдаёт телефону маленькую версию, а большому экрану большую, в современном лёгком формате, и не грузит то, до чего ещё не долистали. next/font — шрифты скачиваются при сборке и отдаются с твоего сервера, поэтому текст не дёргается при загрузке.",

"network-tcp-udp": "TCP — заказное письмо с уведомлением: гарантированно дойдёт и в правильном порядке, но на оформление уходит время. UDP — бросить открытку в ящик: быстро, но может потеряться. HTTP/3 построили поверх UDP, добавив свою надёжность (QUIC), чтобы потеря одного пакета не тормозила все загрузки сразу, как это бывает в TCP.",
"network-tls": "HTTPS — это HTTP внутри зашифрованного туннеля. Сначала сервер показывает сертификат — удостоверение личности, заверенное доверенной организацией, чтобы ты знал, что говоришь именно с ним. Потом стороны хитрым образом договариваются об общем секретном ключе, который не может подслушать никто посередине, и дальше шифруют им весь разговор.",
"network-dns": "DNS — телефонная книга интернета: по имени сайта выдаёт его числовой адрес. Запись A — «имя → адрес», CNAME — «это имя — псевдоним вон того имени». Ответы запоминаются на заданное время (TTL), поэтому после смены адреса часть людей ещё какое-то время попадает на старый.",
"network-headers": "Заголовки — служебные пометки на конверте запроса и ответа: в каком формате содержимое, кто отправитель, можно ли кэшировать, с какого сайта пришли. Само письмо — тело. Заголовков много, но на собесе достаточно знать несколько групп: про содержимое, про авторизацию, про кэш, про безопасность.",
"network-cookies": "Cookie — записка, которую сервер просит браузер хранить и прикладывать к каждому запросу. Атрибуты — правила обращения с ней. HttpOnly — скриптам на странице её не показывать. Secure — отправлять только по шифрованному соединению. SameSite — не прикладывать, если запрос пришёл с чужого сайта. Domain — на какие адреса её отправлять.",
"network-rest": "REST — договорённость, как называть адреса и что значат методы. Адрес — это вещь (заказы, пользователи), метод — действие над ней. GET /orders/42 — прочитать заказ, DELETE /orders/42 — удалить. Хороший API предсказуем: увидев пару адресов, остальные можно угадать. И ошибки он возвращает в одном понятном формате.",
"network-graphql": "Четыре способа клиенту общаться с сервером. REST — много адресов, каждый отдаёт свой фиксированный набор данных. GraphQL — один адрес, клиент сам перечисляет, какие поля ему нужны. tRPC — вызываешь серверную функцию из клиента как обычную, с проверкой типов. gRPC — компактный двоичный формат для общения серверов между собой.",
"network-ws-deep": "WebSocket в учебнике простой, а в жизни связь рвётся: телефон заехал в тоннель, прокси закрыл молчащее соединение. Поэтому нужно самому переподключаться, периодически слать «ты тут?» (heartbeat) и после восстановления дозапрашивать пропущенное. А на сервере — уметь доставить сообщение пользователю, чьё соединение висит на другой машине.",
"network-proxy": "Reverse proxy — секретарь перед твоим приложением: принимает все запросы, расшифровывает HTTPS, отдаёт картинки сам, а остальное передаёт приложению. Балансировщик — распределяет запросы между несколькими копиями приложения, чтобы ни одна не захлебнулась. CDN — сеть складов по всему миру, которые отдают твои файлы с ближайшего к пользователю.",
"network-fetch": "fetch — встроенный способ сделать запрос. Главная ловушка: ответ «404» или «500» он ошибкой не считает, ведь ответ-то пришёл. Проверять успешность нужно самому через res.ok. Ещё он не умеет сам обрывать зависший запрос — время ожидания тоже задаёшь ты. axios — библиотека, которая делает это и многое другое за тебя.",
"network-oauth-flow": "Это кнопка «Войти через Google». Твой сайт не видит пароль: он отправляет человека на Google, тот входит там и возвращается с одноразовым кодом. Сайт обменивает код на токен — пропуск для обращения к данным пользователя. PKCE — дополнительный секрет, чтобы украденным по дороге кодом никто чужой не смог воспользоваться.",

"browser-arch": "Браузер — не одна программа, а несколько процессов: главный управляет окном, и у каждого сайта свой отдельный процесс, поэтому зависшая вкладка не роняет остальные. Внутри вкладки есть главный поток, где работает твой JS и считается вёрстка, и отдельный поток, который двигает готовые слои. Поэтому прокрутка и простые анимации могут оставаться плавными, даже когда JS занят.",
"browser-frame": "Экран обновляется 60 раз в секунду, значит, на подготовку одного кадра есть около 16 миллисекунд. Не уложился — кадр пропущен, пользователь видит рывок. requestAnimationFrame — способ сказать браузеру «вызови мою функцию как раз перед следующим кадром», это правильное место для анимаций на JS.",
"browser-layers": "Браузер может вынести элемент на отдельный «прозрачный лист» (слой). Тогда, чтобы его подвинуть или сделать полупрозрачным, не нужно перерисовывать страницу — достаточно сдвинуть лист, и это делает видеокарта. Но каждый лист занимает память, поэтому выносить всё подряд вредно.",
"browser-observers": "Три «наблюдателя», которые сами сообщают, когда что-то случилось, вместо того чтобы ты постоянно проверял. IntersectionObserver — элемент появился на экране или ушёл с него. ResizeObserver — у элемента изменился размер. MutationObserver — в разметке что-то добавили, удалили или поменяли.",
"browser-workers": "Web Worker — помощник в отдельном потоке: ему можно отдать тяжёлые вычисления, и страница при этом не подвиснет. К самой странице у него доступа нет, общаются сообщениями. Service Worker — посредник между страницей и сетью: перехватывает запросы и может ответить из своего запаса, поэтому сайт способен работать без интернета.",
"browser-history": "В одностраничном приложении переход по ссылке не загружает новую страницу: JS сам меняет адрес в строке браузера и рисует другой экран. History API — как раз команды «поменяй адрес без перезагрузки» и событие «пользователь нажал назад». Серверу при этом надо на любой адрес отдавать одну и ту же страницу, иначе при обновлении будет 404.",
"browser-media": "Сайт может попросить доступ к камере. Браузер спросит у человека разрешение и, если тот согласен, отдаст видеопоток, который можно показать на странице и анализировать по кадрам, например искать QR-код. Работает только по HTTPS. После использования камеру обязательно нужно выключить, иначе индикатор будет гореть.",
"browser-br-security": "Главное правило браузера: скрипт одного сайта не может читать данные другого. На этом держится безопасность. Остальное — частные случаи: как безопасно встроить чужой сайт в рамку (iframe), как запретить встраивать свой, как двум окнам переписываться (postMessage), проверяя, от кого пришло сообщение.",
"browser-devtools": "Это вопрос про твой метод работы. Открываешь инструменты разработчика, записываешь проблемный сценарий и смотришь, на что ушло время: на JS, на пересчёт вёрстки или на загрузку. Не гадаешь, а находишь конкретную функцию или ресурс. И обязательно замедляешь процессор в настройках, чтобы увидеть сайт глазами владельца слабого телефона.",

"ts-structural": "TypeScript сравнивает типы не по названию, а по содержимому. Если у объекта есть все нужные поля нужных типов, он подходит, даже если называется иначе. «Если крякает как утка — значит, утка». Иногда это мешает: идентификатор пользователя и идентификатор заказа — оба строки, и их легко перепутать, для этого придумали branded types.",
"ts-inference": "TypeScript сам догадывается о типах, их не обязательно писать. При этом для let он берёт тип пошире («строка»), потому что значение может поменяться, а для const — точное значение. as const просит запомнить всё максимально точно и запретить изменения. satisfies проверяет, что значение подходит под тип, но не забывает его точную форму.",
"ts-unions": "Способ описать состояния так, чтобы нельзя было собрать бессмыслицу. Вместо набора флагов «загружается», «ошибка», «данные», которые могут оказаться включёнными одновременно, описываешь варианты: либо загрузка, либо успех с данными, либо ошибка с текстом. У каждого варианта есть поле-метка, и после её проверки TypeScript знает, какие поля доступны.",
"ts-keyof": "Инструменты, чтобы получать одни типы из других и не описывать одно и то же дважды. keyof — «список названий полей этого типа». typeof — «тип вот этой переменной». Квадратные скобки — «тип вот этого поля». Template literal — собирать строковые типы по шаблону, например все названия вида onЧтоТо.",
"ts-conditional": "Условный тип — это if, только для типов: «если T — строка, то тип такой, иначе другой». infer внутри условия позволяет вытащить кусочек: «если это промис чего-то — дай мне это что-то». Так устроены встроенные ReturnType и Awaited.",
"ts-mapped": "Mapped type — цикл по полям типа: «возьми каждое поле и сделай с ним вот это». Так из одного типа получают другой: все поля необязательные, все только для чтения, все переименованы. Встроенные Partial, Readonly, Pick написаны именно так, в одну строку.",
"ts-variance": "Вопрос звучит страшно, а суть простая: когда один тип можно подставить вместо другого. Собака — частный случай животного. Массив собак можно отдать туда, где ждут массив животных. А с функциями-обработчиками наоборот: тот, кто умеет обработать любое животное, справится и с собакой, но обработчик только собак не справится с кошкой.",
"ts-overloads": "Перегрузка — несколько описаний одной функции для разных наборов аргументов: «если дали строку — верну строку, если число — верну число». Реализация при этом одна и внутри сама разбирается, что пришло.",
"ts-tsconfig": "tsconfig — файл настроек TypeScript: насколько строго проверять и как искать файлы. Главная настройка — strict, она включает все серьёзные проверки разом, и без неё половина пользы теряется. Остальные флаги либо делают проверки ещё строже, либо подстраивают TypeScript под твой сборщик.",
"ts-dts": "Файл .d.ts — это «паспорт» кода: в нём только описание типов, без самой логики. Так TypeScript узнаёт, что экспортирует библиотека, написанная на обычном JS. Через declare можно самому описать типы для того, что TypeScript не понимает: импорт картинки, глобальную переменную, дополнительное поле в чужой библиотеке.",
"ts-ts-react": "Практические приёмы типизации в React: как описать пропсы, как взять все стандартные атрибуты кнопки и добавить свои, какой тип у события клика или ввода, и как сделать компонент, который подстраивается под тип переданных данных — например, таблицу, знающую поля своей строки.",
"ts-runtime-validation": "Типы TypeScript существуют только пока ты пишешь код. В работающей программе их нет, и если сервер пришлёт не то, что обещал, TypeScript об этом не узнает. Поэтому всё приходящее снаружи проверяют специальной библиотекой прямо во время работы: описываешь ожидаемую форму, и она либо подтверждает, либо бросает ошибку.",

"css-box": "Каждый элемент на странице — коробка из четырёх вложенных частей: содержимое, внутренний отступ (padding), рамка (border), внешний отступ (margin). По умолчанию ширина задаёт только содержимое, а отступ и рамка прибавляются сверху, и коробка получается шире, чем ты написал. box-sizing: border-box это исправляет: ширина включает всё. Схлопывание — когда вертикальные внешние отступы соседей не складываются, а берётся больший.",
"css-position": "position определяет, как элемент встаёт на страницу. Обычный — в потоке, один за другим. relative — сдвинут от своего места. absolute — вынут из потока и привязан к ближайшему позиционированному предку. fixed — приклеен к окну. sticky — едет вместе со страницей, пока не упрётся, и прилипает. z-index решает, кто поверх кого, но только среди «своих»: вложенный элемент не выскочит выше, чем позволяет его родитель.",
"css-centering": "Вечный вопрос «как поставить элемент по центру». Сегодня ответ — две строчки на родителе: сделать его grid или flex и указать выравнивание по центру. Старые трюки с отрицательными сдвигами стоит знать только чтобы узнать их в чужом коде.",
"css-units": "px — фиксированные точки. rem — доля от базового размера шрифта страницы: человек увеличил шрифт в браузере — выросло всё, что в rem. em — доля от шрифта самого элемента. Проценты — от родителя. vw и vh — проценты от размера окна. clamp — «расти вместе с экраном, но не меньше и не больше заданного».",
"css-container": "Media query спрашивает «какой ширины экран?». Container query спрашивает «какой ширины блок, в котором я стою?». Второе полезнее для переиспользуемых компонентов: одна и та же карточка может стоять и в узкой боковой колонке, и в широкой области на одном экране и должна выглядеть по-разному.",
"css-selectors": "Новые возможности выбора элементов. :has позволяет выбрать родителя по содержимому: «поле, внутри которого ошибка». :is и :where — короткая запись списка вариантов, причём :where ничего не весит и легко перекрывается. Вложенность — писать стили детей внутри фигурных скобок родителя, как в Sass, но без Sass.",
"css-custom-props": "CSS-переменные — названные значения: объявил основной цвет один раз и используешь везде. Они наследуются вниз по дереву, поэтому значение можно переопределить для части страницы, и всё внутри перекрасится. На этом строятся темы. Менять их можно и из JavaScript, прямо на лету.",
"css-animations": "Transition — плавный переход из одного состояния в другое: навёл на кнопку, цвет поменялся не рывком, а за 200 мс. Animation — сценарий по ключевым кадрам, который может повторяться. Анимировать лучше сдвиг и прозрачность: их браузер делает дёшево, без пересчёта страницы.",
"css-fonts": "Пока свой шрифт качается, браузеру надо что-то показывать. Либо невидимый текст (плохо: человек смотрит в пустоту), либо запасной системный шрифт с подменой, когда скачается свой (текст виден сразу, но может дёрнуться). font-display выбирает между этими вариантами.",
"css-design-tokens": "Вопрос о том, как не утонуть в стилях большой системы. Все значения дизайна (цвета, отступы) выносятся в переменные с осмысленными именами: не «синий-600», а «цвет акцента». Компоненты используют только эти имена. Тогда смена темы или редизайн — это замена значений в одном месте.",
"css-dark-theme": "Тёмная тема — это другой набор значений для тех же переменных цвета. Сложность одна: страница не должна мигнуть светлой перед тем, как стать тёмной. Для этого тему надо узнать до первой отрисовки: либо сервер сразу отдаёт страницу с нужной пометкой, либо крошечный скрипт в самом начале страницы ставит её до показа.",
"perf-metrics": "Метрики — это цифры, которыми меряют «быстро ли». Каждая отвечает на свой вопрос: как скоро сервер начал отвечать, как скоро что-то появилось на экране, как скоро появилось главное, как быстро страница реагирует на клик, не прыгает ли вёрстка. Мерить можно в лаборатории (один запуск на одном компьютере) и «в поле» (у настоящих посетителей). Верить надо полю, а чинить удобнее в лаборатории.",
"perf-perf-story": "Просьба «расскажи, как ускорял» — проверка, умеешь ли ты работать по методу, а не наугад. Хорошая история всегда одной формы: что тормозило, как я это измерил, что предположил, что поменял и как убедился, что помогло. Без цифр «до и после» это просто слова.",
"perf-priorities": "Браузер сам решает, что качать первым, но не всегда угадывает. Этими подсказками ты ему помогаешь: «заранее соединись вон с тем сервером», «этот шрифт понадобится прямо сейчас, качай», «эта картинка главная», «а это пригодится на следующей странице, качай, когда будет свободно».",
"perf-bundle": "Бандл — файл с JavaScript, который скачивает пользователь. Чем он больше, тем дольше грузится и запускается сайт. Уменьшают его так: смотрят, что в нём занимает место, делят на части, чтобы грузить только нужное для текущей страницы, и заменяют тяжёлые библиотеки лёгкими.",
"perf-images": "Картинки — обычно самое тяжёлое на странице. Правила простые: современный сжатый формат, размер под экран (телефону не нужна картинка для монитора), не грузить то, до чего ещё не долистали, и заранее указывать размеры, чтобы страница не прыгала, когда картинка появится.",
"perf-long-tasks": "Пока JavaScript выполняет длинный кусок работы, страница не может ответить на клик — она «замёрзла». Решение — резать работу на короткие куски и между ними давать браузеру вздохнуть и обработать действия человека. Или вынести тяжёлое в отдельный поток.",
"perf-virtualization": "Если в списке десять тысяч строк, а на экран влезает двадцать, глупо создавать все десять тысяч элементов. Виртуализация рисует только видимые и чуть-чуть с запасом, а при прокрутке подменяет их. Полоса прокрутки при этом ведёт себя так, будто список настоящий.",
"perf-caching-front": "Кэш на фронте — это несколько уровней «не качай повторно». Браузер хранит файлы. CDN хранит их поближе к пользователю. Service Worker может ответить вообще без сети. Библиотека запросов помнит уже полученные данные и показывает их сразу, обновляя в фоне.",
"perf-backend-perf": "Если тормозит сервер, почти всегда виновата база: медленный запрос без индекса или сотня мелких запросов вместо одного. С этого и начинают. Дальше по списку: добавить кэш для частых данных, не блокировать Node тяжёлыми вычислениями, сжимать ответ, ходить во внешние сервисы параллельно.",
"perf-budgets": "Бюджет — заранее оговорённый потолок: «JavaScript главной страницы не больше стольких-то килобайт». Робот в CI проверяет это на каждое изменение и не даёт влить код, который потолок пробивает. Так скорость не деградирует незаметно, по чуть-чуть.",

"a11y-wcag": "WCAG — общепринятый свод правил, каким должен быть сайт, чтобы им могли пользоваться люди с ограничениями. У него три уровня строгости, обычно требуют средний (AA). Четыре принципа: содержимое можно воспринять, интерфейсом можно управлять, всё понятно, и это работает с разными устройствами и программами.",
"a11y-semantics": "Семантика — использовать теги по назначению. Тег button сам умеет получать фокус, нажиматься с клавиатуры и сообщать программе чтения с экрана «я кнопка». Div с обработчиком клика ничего из этого не умеет. Правильные теги для частей страницы (шапка, навигация, основное) и заголовки по порядку работают как оглавление для незрячего.",
"a11y-names": "Незрячий человек не видит иконку крестика — программа должна ему что-то произнести. Доступное имя — это и есть то, что она произнесёт. У поля это его подпись, у кнопки — текст, у кнопки-иконки — специальный атрибут с описанием, у картинки — alt. Без имени человек услышит просто «кнопка» и не поймёт, какая.",
"a11y-aria-rules": "ARIA — дополнительные атрибуты, которыми ты объясняешь программе чтения с экрана то, чего не видно из тегов: «это вкладка», «меню раскрыто», «тут ошибка». Главное правило: если есть подходящий обычный тег, бери его, а не ARIA. И помни, что ARIA только сообщает — саму работу с клавиатуры ты пишешь сам.",
"a11y-focus": "Фокус — это «где сейчас курсор клавиатуры». Человек без мыши ходит по странице клавишей Tab, и он должен видеть, где находится, и попадать в элементы в логичном порядке. В модальном окне фокус не должен убегать на страницу под ним, а после закрытия — должен вернуться туда, откуда окно открыли.",
"a11y-modal": "Доступное модальное окно — это окно, с которым справится человек с клавиатурой и скринридером: фокус сразу попадает внутрь и не уходит наружу, Escape закрывает, программа объявляет, что открылся диалог и как он называется. Проще всего взять встроенный тег dialog — он делает большую часть сам.",
"a11y-widgets": "Сложные элементы вроде выпадающего меню или вкладок не имеют готового тега, и их поведение приходится собирать самому. Для каждого есть описанный стандартом рецепт: какие роли поставить и какие клавиши что делают. Это кропотливо, поэтому обычно берут готовые библиотеки, где всё уже сделано.",
"a11y-forms-a11y": "Форма доступна, если у каждого поля есть видимая подпись, а ошибка не только подсвечена красным, но и написана текстом и привязана к полю, чтобы программа её зачитала. Сообщения, которые появляются сами («сохранено»), нужно помечать особым образом, иначе незрячий о них не узнает.",
"a11y-contrast": "Текст должен достаточно отличаться от фона по яркости, иначе его не прочитать при плохом зрении или на солнце. Цвет не должен быть единственной подсказкой: кто-то красный от зелёного не отличает. Страница должна выдерживать увеличение вдвое. А сильные анимации стоит отключать тем, кто попросил об этом в настройках системы.",
"a11y-a11y-testing": "Проверка в три захода. Автоматические инструменты быстро находят очевидное, но только около трети проблем. Потом ты сам проходишь сценарий без мыши, одной клавиатурой. И наконец включаешь программу чтения с экрана и слушаешь, понятно ли то, что она произносит.",

"security-xss-deep": "React по умолчанию вставляет чужой текст как текст, а не как код, поэтому защищает от большинства XSS. Но есть лазейки: вставка готового HTML, ссылки, начинающиеся с javascript:, данные, вшитые в страницу при серверной отрисовке. Строгая CSP — вторая линия: даже если чужой скрипт просочился, браузер его не запустит, потому что у него нет специальной одноразовой метки.",
"security-clickjacking": "Три мелкие атаки. Clickjacking: твой сайт незаметно показывают внутри чужого, и человек, думая, что жмёт «получить приз», жмёт «удалить аккаунт» у тебя. Open redirect: ссылка выглядит как твоя, но после входа перекидывает на сайт мошенников. Tabnabbing: открытая в новой вкладке страница подменяет ту, с которой пришли. У каждой есть простая защита заголовком или атрибутом.",
"security-passwords": "Пароль нельзя хранить как есть: украдут базу — украдут все пароли. Хранят его «отпечаток» — результат необратимого преобразования (хэш). При входе делают отпечаток введённого и сравнивают. Функция должна быть специально медленной, чтобы перебор занимал годы, и к каждому паролю подмешивается своя случайная добавка (соль), чтобы одинаковые пароли давали разные отпечатки.",
"security-access-control": "Самая частая дыра: сервер проверил, что ты вошёл, но не проверил, что запрошенная вещь — твоя. Меняешь номер заказа в адресе и видишь чужой. Правило: на каждый запрос сервер проверяет, имеет ли этот пользователь право на этот конкретный объект. В системе со многими клиентами — ещё и что объект принадлежит его организации.",
"security-injection": "Инъекция — когда данные от пользователя попадают в команду и становятся её частью. Человек вместо имени вводит кусок SQL, и база его выполняет. Лечится одним приёмом: никогда не склеивать запрос из строк, а передавать данные отдельно, параметрами — тогда база знает, что это данные, а не команда.",
"security-ssrf": "Если сервер умеет по просьбе пользователя сходить по ссылке (скачать картинку по адресу, показать превью), злоумышленник даст ему адрес из внутренней сети, куда снаружи не попасть. Сервер-то внутри, и он послушно сходит и вернёт секретное. Защита — разрешать только известные адреса и запрещать внутренние.",
"security-uploads": "Загруженный файл — чужая вещь, принесённая в дом. Нельзя верить его названию и расширению, надо проверять содержимое и размер. Имя дают своё, хранят отдельно от кода и отдают так, чтобы браузер его скачал, а не выполнил. SVG особенно опасен: это не просто картинка, внутри может быть скрипт.",
"security-rate-limit": "Ограничение частоты — «не больше N запросов в минуту с одного пользователя». Нужно, чтобы нельзя было перебирать пароли, завалить сервер или накрутить бонусы ботом. Счётчик обычно держат в Redis. Превысил — получаешь ответ 429 «слишком много запросов».",
"security-supply-chain": "Твой проект состоит из сотен чужих пакетов, и каждый — потенциальная дверь. Пакет могут взломать или подсунуть похожий по названию. Защита: фиксировать точные версии, регулярно проверять на известные уязвимости, не тащить лишнее и осторожно относиться к скриптам, которые пакеты запускают при установке.",
"security-secrets": "Всё, что попало в код, который скачивает браузер, может прочитать любой. Поэтому ключи и пароли живут только на сервере и попадают туда через настройки окружения, а не лежат в репозитории. Если секрет утёк — его меняют на новый, просто удалить из истории недостаточно.",
"security-crypto-basics": "Четыре понятия, которые путают. Случайность: для призов и токенов нужен непредсказуемый генератор, обычный Math.random можно просчитать. Хэш — отпечаток данных, по которому сами данные не восстановить. Подпись — доказательство, что данные от конкретного отправителя и не изменены. Шифрование — спрятать содержимое так, чтобы прочитал только владелец ключа.",

"node-when-node": "Node хорош как официант: принял заказ, передал на кухню и, пока готовят, обслуживает другие столики. Поэтому он легко держит тысячи одновременных запросов, которые в основном ждут базу или сеть. Но если его самого заставить готовить (тяжёлые вычисления), все столики будут ждать: поток-то один.",
"node-streams": "Стрим — обработка данных по кускам, как вода из крана, а не ведром. Файл в 5 ГБ не нужно целиком грузить в память: читаешь кусочек, обрабатываешь, отправляешь дальше. Backpressure — защита от переполнения: если получатель не успевает, источник притормаживает.",
"node-threads": "Три способа занять больше одного ядра процессора. worker_threads — дополнительные потоки внутри того же процесса для тяжёлых вычислений. child_process — запустить отдельную программу. cluster — запустить несколько копий своего сервера на одном порту. В контейнерах вместо последнего обычно просто запускают несколько контейнеров.",
"node-shutdown": "Когда сервер обновляют, старому процессу присылают вежливый сигнал «завершайся». Плохо просто умереть на полуслове: оборвутся запросы людей. Правильно — перестать брать новые запросы, доделать текущие, закрыть соединения с базой и только потом выйти. А если случилась непойманная ошибка — записать её и перезапуститься, не пытаясь работать дальше.",
"node-node-memory": "У Node есть потолок памяти. Если программа копит данные и не отдаёт (вечный кэш, неснятые подписки), память растёт, пока процесс не убьют. Найти виновника помогают «снимки памяти»: делаешь два с интервалом и смотришь, каких объектов стало больше.",
"node-nest-di": "DI — внедрение зависимостей. Класс не создаёт себе помощников сам, а просит их в конструкторе: «мне нужен клиент базы». Nest сам находит и подаёт нужное. Выгода: в тестах вместо настоящей базы легко подсунуть подделку, и части системы меньше знают друг о друге.",
"node-nest-pipeline": "Запрос в Nest проходит цепочку постов, у каждого своя работа. Guard решает, пускать ли. Pipe проверяет и приводит в порядок входные данные. Interceptor оборачивает обработчик: может засечь время или переделать ответ. Filter ловит ошибки и превращает их в аккуратный ответ. Знать, что куда писать, — значит не складывать всё в контроллер.",
"node-nest-dto": "DTO — описание того, какие данные сервер ожидает в запросе: какие поля и каких типов. Nest автоматически сверяет присланное с описанием, лишние поля выкидывает, неправильные отклоняет. В обратную сторону то же самое: описываешь, что можно показать наружу, чтобы случайно не отдать внутренние поля.",
"node-nest-modules": "Модуль в Nest — коробка с кодом про одну тему, из которой наружу видно только то, что явно разрешено. forRoot и forFeature — способ настроить модуль при подключении: первый один раз на всё приложение (адрес базы), второй — в конкретном месте (какие таблицы тут нужны).",
"node-nest-mongo": "Mongoose — библиотека для работы с MongoDB. Ты описываешь классом, какие поля должны быть у документа, и получаешь объект для чтения и записи. Nest сам подаёт этот объект в сервис. Миграции — скрипты, которые приводят уже лежащие в базе данные к новому формату.",
"node-nest-queues": "Как отложенная работа выглядит в коде Nest. Одна часть кладёт задачу в очередь: «отправь письмо такому-то». Другая часть — обработчик — берёт задачи из очереди и выполняет. Если не получилось, задача повторится. Поэтому обработчик должен нормально переносить повторный запуск с теми же данными.",
"node-idempotency": "Идемпотентность — «сколько раз ни повтори, результат как от одного раза». Это важно, потому что повторы неизбежны: человек дважды нажал «оплатить», сеть моргнула, платёжная система прислала уведомление повторно. Сервер должен узнать повтор и не списать деньги второй раз — обычно по уникальному номеру операции.",

"arch-layers": "Слоистая архитектура — как этажи: приём запросов, бизнес-логика, работа с базой, и каждый этаж общается только с соседним. Чистая и гексагональная идут дальше: бизнес-правила в центре и ничего не знают о базе и фреймворке, а внешний мир подключается к ним через «розетки» (интерфейсы). Тогда базу можно сменить, не трогая логику, но кода становится больше.",
"arch-ddd": "DDD — подход, где код строится вокруг языка и правил бизнеса, а не вокруг таблиц. Главные идеи: программисты и бизнес называют вещи одинаково; большая система делится на области, в каждой из которых слова имеют свой точный смысл; данные, которые должны меняться согласованно, объединяют в одну группу и меняют только через её главный объект.",
"arch-monolith": "Монолит — всё приложение одним куском: просто разрабатывать и запускать, но со временем всё переплетается. Микросервисы — много маленьких приложений, каждое со своей задачей: независимы, но между ними сеть, а с ней сбои, задержки и сложность. Модульный монолит — середина: один кусок, но внутри строгие перегородки.",
"arch-events": "Вместо того чтобы один сервис напрямую вызывал другой, он объявляет «случилось то-то», а заинтересованные сами реагируют. Сервисы меньше зависят друг от друга, но данные в них сходятся не мгновенно. Outbox — приём, чтобы объявление не потерялось: его записывают в базу вместе с самими данными, а отправляют отдельно.",
"arch-gof": "Паттерны — названия для типовых решений, чтобы быстро понимать друг друга. Сказал «тут наблюдатель» — и ясно, что есть подписчики, которых оповещают. Не нужно знать все двадцать три: достаточно полудюжины, которые встречаются каждый день, и уметь показать каждый на своём коде.",
"arch-registry": "Вместо длинного if «если тип баннер — рисуй так, если механика — так» заводят справочник: тип → что с ним делать. Нужен новый тип — добавляешь строчку в справочник, а остальной код не трогаешь. Так устроено любое расширяемое: блоки конструктора, типы полей формы.",
"arch-front-arch": "Суть ответа: код разложен по бизнес-темам, у каждой темы есть «парадная дверь», и внутрь через окно никто не лезет. Внутри темы картинка отделена от логики. Общие инструменты лежат отдельно. И всё это проверяет робот, а не чья-то память.",
"arch-adr": "ADR — короткая записка «почему мы решили так»: какая была проблема, какие варианты рассматривали, что выбрали и чем за это платим. Через год, когда никто не помнит, она отвечает на вопрос «зачем тут это» и не даёт пойти по второму кругу.",
"arch-monorepo": "Монорепозиторий — когда несколько проектов (сайт, админка, библиотека) лежат в одном репозитории. Удобно менять всё сразу одним изменением и держать общие настройки. Неудобно, что репозиторий большой и проверки идут долго, поэтому нужны инструменты, которые собирают только затронутое.",
"arch-tech-debt": "Техдолг — быстрые решения, за которые потом платишь медленной разработкой, как проценты по кредиту. Гасить его лучше понемногу и безопасно: новое строить рядом со старым и переводить по частям. И главное — не набирать новый: поставить автоматический запрет на то, что уже признано плохим.",

"sysdesign-estimation": "Прикидка на салфетке — грубая арифметика, чтобы понять масштаб: это задача на один сервер или на сотню? Сколько запросов в секунду, сколько данных за год. Точность не нужна, нужен порядок: тысячи или миллионы. От него зависит, какие решения вообще стоит обсуждать.",
"sysdesign-blocks": "Системы собирают из стандартных кубиков, и у каждого своя задача: один раздаёт файлы быстро по всему миру, другой распределяет нагрузку, третий помнит частые ответы, четвёртый откладывает работу на потом. Важно не перечислить все, а уметь сказать, какую проблему решает каждый, и доставать его только под неё.",
"sysdesign-whitelabel": "White-label — один продукт, который каждый клиент получает под своим брендом и на своём адресе. Задача — обслуживать тысячи таких клиентов одним приложением, чтобы каждый видел своё оформление и только свои данные и чтобы один прожорливый клиент не мешал остальным. Это твой рабочий опыт, рассказывай из него.",
"sysdesign-builder": "Конструктор страниц — это, по сути, три вещи: как хранить описание страницы (список блоков с настройками), как превратить это описание в картинку (один и тот же код и в редакторе, и на живом сайте) и как безопасно опубликовать изменения. Это тоже твой опыт.",
"sysdesign-leaderboard": "Таблица лидеров — отсортированный список игроков по очкам, который должен обновляться мгновенно. В Redis есть готовая структура ровно под это. А баллы надёжнее хранить не одним числом, а журналом операций, как выписку по счёту: начислено, списано. Тогда баланс всегда можно пересчитать и проверить.",
"sysdesign-notifications": "Уведомления — это конвейер: событие случилось, задача встала в очередь, работник отправил письмо, пуш или сообщение в приложении. Для мгновенной доставки держат открытое соединение с браузером. Если человека нет онлайн, сообщение ждёт в базе. Главные заботы — не потерять и не отправить дважды.",
"sysdesign-shortener": "Сокращатель ссылок — учебная задача: длинный адрес превращается в короткий код, по коду человека перенаправляют. Вся суть в двух вопросах: как придумать короткий уникальный код и как быстро отвечать при огромном числе переходов, ведь читают такие ссылки гораздо чаще, чем создают.",
"sysdesign-frontend-sd": "То же проектирование, но для интерфейса: тебя просят спроектировать, например, поле поиска с подсказками. Идёшь по порядку: что оно должно уметь, из каких частей состоит, какие данные хранит, как общается с сервером и что будет с производительностью, ошибками и доступностью.",

"testing-rtl": "Testing Library учит проверять компонент так, как им пользуется человек: «найди кнопку с надписью Сохранить, нажми, убедись, что появился текст». А не «проверь, что у компонента такое-то внутреннее состояние». Такие тесты не ломаются, когда ты переписываешь код внутри, не меняя поведения.",
"testing-mocks": "Мок — подделка, которую подставляют вместо настоящей вещи на время теста: вместо сервера, вместо часов, вместо генератора случайных чисел. Тогда тест быстрый и всегда даёт один результат. Подделывать стоит только внешний мир, а не собственный код, иначе тест проверяет подделку, а не программу.",
"testing-store-tests": "Если логика экрана вынесена в отдельный класс (стор), её можно проверить вообще без интерфейса: создал объект, вызвал метод, посмотрел, что поменялось. Такие тесты самые быстрые и надёжные. Это одна из причин отделять логику от картинки.",
"testing-e2e": "E2E-тест — робот, который открывает настоящий браузер и проходит сценарий как пользователь. «Флак» — тест, который то проходит, то падает без причины. Чтобы их не было: искать элементы по видимому тексту, ждать появления элементов, а не фиксированные секунды, и давать каждому тесту свои отдельные данные.",
"testing-backend-tests": "Бэкенд проверяют на трёх уровнях. Отдельный сервис с подделанными зависимостями. Сервис с настоящей базой, поднятой специально для теста. И целое приложение, в которое шлют настоящие HTTP-запросы. Отдельный жанр — запустить десять одинаковых запросов одновременно и убедиться, что деньги списались один раз.",
"testing-tdd": "TDD — сначала пишешь тест, который описывает, что должно получиться, и видишь, как он падает. Потом пишешь ровно столько кода, чтобы он прошёл. Потом наводишь порядок. Удобно, когда чётко понятно, что на входе и что на выходе, и особенно с агентами: тест не даёт понять задачу «по-своему».",
"testing-coverage": "Покрытие показывает, какая доля кода запускалась во время тестов. Но «запускалась» не значит «проверена»: тест может выполнить код и ничего не проверить. Мутационное тестирование проверяет сами тесты: специально портит код в мелочах и смотрит, заметят ли тесты поломку.",
"testing-test-speed": "Медленные тесты перестают запускать. Ускоряют их так: гоняют параллельно на нескольких ядрах и машинах, запускают только те, что связаны с изменёнными файлами, и убирают тяжёлую подготовку там, где она не нужна.",

"devops-compose": "Compose — файл, в котором описано всё, что нужно проекту для запуска: приложение, база, Redis. Одна команда поднимает всё сразу и соединяет в общую сеть, где сервисы видят друг друга по именам. Volume — место хранения данных, которое переживает удаление контейнера, чтобы база не обнулялась.",
"devops-k8s": "Kubernetes — диспетчер контейнеров. Ты говоришь: «хочу три копии приложения», а он запускает, следит, перезапускает упавшие и распределяет между ними запросы. Разработчику достаточно знать основные слова: под — запущенный контейнер, deployment — описание «сколько копий и какой версии», service — постоянный адрес, ingress — вход снаружи.",
