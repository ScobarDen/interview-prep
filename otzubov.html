"devops-gitlab-ci": "Пайплайн — список шагов, которые GitLab автоматически выполняет на каждое изменение кода. Они описаны в файле в репозитории: этапы идут по очереди, задачи внутри этапа — одновременно. Можно задать условия запуска, сохранять скачанные зависимости между запусками и передавать результаты одного шага другому.",
"devops-deploy": "Способы выкатить новую версию, не уронив сайт. Rolling — заменять копии приложения по одной. Blue-green — поднять новую версию целиком рядом и переключить всех разом. Canary — сначала пустить на новую версию малую долю людей и смотреть, всё ли в порядке. Feature flag — выкатить код выключенным и включить рубильником позже.",
"devops-twelve": "12-factor — набор правил, как делать приложение удобным для запуска на серверах. Главные: настройки берутся из окружения, а не зашиты в код; приложение ничего не хранит в своей памяти между запросами, всё важное лежит в базе; логи пишутся просто в вывод. Тогда одну и ту же сборку можно запускать где угодно и в любом количестве копий.",
"devops-observability": "Наблюдаемость — умение понять, что происходит с системой, не залезая внутрь. Логи — дневник событий. Метрики — приборная панель с цифрами: сколько запросов, сколько ошибок, как быстро отвечаем. Трейсы — маршрут одного запроса через все сервисы. Алерты — сигнализация, которая будит только когда плохо пользователю.",
"devops-git": "Два стиля работы с ветками. Trunk-based — короткие ветки, которые быстро вливают в основную: меньше конфликтов. GitFlow — много долгоживущих веток под релизы: тяжелее. Merge соединяет две истории как есть, rebase переносит твои коммиты поверх свежей основной ветки, будто ты начал работу только что, и история получается ровной.",
"devops-release": "Автоматический выпуск библиотеки: по сообщениям коммитов робот сам понимает, какую цифру версии увеличить, собирает пакет, пишет список изменений и публикует. Человеку остаётся правильно называть коммиты.",

"ai-context": "Агент — как новый сотрудник в первый день: умный, но о проекте ничего не знает. Если ему не дать правила, договорённости и объяснения, почему сделано так, он будет гадать. Поэтому всё это записывают в репозитории в файлах, которые агент читает сам. Это разовая работа, которая окупается на каждой задаче.",
"ai-spec-driven": "Сначала подробно записать, что должно получиться, и только потом писать код. Спецификация — описание сценариев, краевых случаев и критериев «готово». Агенту с ней нельзя схалтурить или понять задачу иначе, а тебе есть с чем сверить результат.",
"ai-guardrails": "Просить агента «соблюдай архитектуру» бесполезно — рано или поздно нарушит. Работают только автоматические проверки: линтер, типы, тесты. Если правило проверяет машина, нарушение просто не пройдёт. Это рельсы: с них нельзя съехать, даже если хочется.",
"ai-review": "Агент пишет много, читать всё одинаково внимательно невозможно. Поэтому внимание распределяют по риску: там, где деньги, одновременные запросы, безопасность и изменение данных, читаешь каждую строку. Типовой интерфейс проверяешь по результату: тесты прошли, выглядит и работает правильно.",
"ai-multi-agent": "Одному агенту большую задачу дать нельзя — запутается. Её делят: одни ищут проблемы в разных частях системы, другие независимо перепроверяют найденное, третьи исправляют. Перепроверка нужна, потому что агенты часто уверенно сообщают о проблемах, которых нет.",
"ai-mcp": "MCP — стандартный разъём, через который AI-агент подключается к внешним инструментам: открыть макет в Figma, посмотреть страницу в браузере, создать merge request. Без него агент может только писать текст, с ним — выполнять действия в твоих рабочих программах.",
"ai-failures": "Агенты ошибаются предсказуемо: выдумывают несуществующие функции, идут в обход правил проекта, пишут тесты, которые ничего не проверяют, усложняют без нужды и тихо меняют то, о чём не просили. На каждую такую ошибку у тебя должна быть своя сетка: типы, линтер, ревью тестов, сравнение со старым поведением.",
"ai-team-rollout": "Внедрять AI в команде надо не приказом, а пользой. Начать с правил, которые полезны всем и без AI. Автоматизировать самые частые задачи. Поставить общие проверки для людей и агентов. И показать результат цифрами или хотя бы наблюдениями: меньше замечаний, меньше багов.",
"ai-llm-basics": "Языковая модель предсказывает продолжение текста. Текст для неё разбит на кусочки (токены), и за раз она видит ограниченное их число (контекст). Она может уверенно выдумать факт, поэтому ей дают нужные документы прямо в запрос (RAG) и проверяют ответ. Агент — это модель, которой разрешили вызывать инструменты и работать в цикле.",
"ai-ai-metrics": "На вопрос «во сколько раз ускорились?» нельзя называть красивую цифру, которую не докажешь: спросят «как мерили?», и ты поплывёшь. Говори о том, что видно: что раньше делала команда, а теперь один человек, как изменился процесс, чего стало меньше. А если просят цифру, честно назови её оценкой.",
"ai-still-coder": "Вопрос с подвохом: проверяют, не разучился ли ты думать сам. Отвечай спокойно и примерами: вот это я написал руками, вот это могу разобрать построчно. Агент — инструмент, который ускоряет, а понимание и ответственность остаются на тебе.",

"livecoding-how": "На лайвкодинге оценивают не только решение, но и то, как ты к нему идёшь. Поэтому думай вслух: уточни задачу, предложи сначала простое решение, потом улучшай. Даже если не дошёл до идеала, интервьюер увидит, что ты рассуждаешь здраво. Молчать и долго смотреть в экран — худший вариант.",
"livecoding-bigo": "Big O — способ сказать, как сильно замедлится код, если данных станет больше. O(1) — не зависит от количества. O(n) — данных вдвое больше, времени вдвое больше: один проход по списку. O(n²) — данных вдвое больше, времени вчетверо: цикл в цикле. O(log n) — почти не растёт: поиск в отсортированном делением пополам.",
"livecoding-emitter": "EventEmitter — доска объявлений. Одни подписываются на событие по названию («сообщи, когда придёт заказ»), другие объявляют, что оно случилось, и все подписчики вызываются. Внутри — просто словарь: название события → список функций.",
"livecoding-deep-equal": "Два объекта с одинаковым содержимым для JS не равны, потому что сравниваются адреса, а не содержимое. deepEqual сравнивает по-честному: проходит по всем полям обоих объектов, и если поле — тоже объект, заходит внутрь и повторяет то же самое.",
"livecoding-flatten": "Flatten — «расплющить»: из массива с вложенными массивами сделать один ровный список. Для объекта — превратить вложенность в плоские ключи через точку. get по пути — безопасно достать значение из глубины объекта по строке вида a.b.c, не упав, если по дороге чего-то нет.",
"livecoding-pool": "Нужно сделать сто запросов, но не все сразу, а не больше пяти одновременно, чтобы не завалить сервер. Решение: запустить пять «работников», каждый берёт следующую задачу из общего списка, выполняет и берёт следующую, пока список не кончится.",
"livecoding-lru": "LRU-кэш — память ограниченного размера, которая при переполнении выбрасывает то, чем дольше всего не пользовались. Как полка, куда влезает десять книг: взял книгу — поставил с края, новая не влезает — убираешь ту, что дальше всех от края.",
"livecoding-hashmap": "Главный приём алгоритмических задач: вместо того чтобы для каждого элемента заново искать пару перебором, запоминай уже увиденное в словаре. Проверка «видел ли я такое» в словаре мгновенная, и цикл в цикле превращается в один проход.",
"livecoding-two-pointers": "Два указателя — два пальца на массиве, которые двигаются навстречу или друг за другом. Скользящее окно — рамка на строке: правый край расширяешь, а когда условие нарушилось, поджимаешь левый. Оба приёма позволяют пройти данные один раз вместо перебора всех пар.",
"livecoding-stack": "Стек — стопка тарелок: кладёшь сверху, берёшь тоже сверху. Идеален для всего вложенного. Проверка скобок: открывающую кладёшь в стопку, на закрывающей снимаешь верхнюю и проверяешь, что она той же формы. Если в конце стопка пуста — всё закрыто правильно.",
"livecoding-binary-search": "Игра «угадай число от 1 до 100»: называешь середину, тебе говорят «больше» или «меньше», и ты отбрасываешь половину. За семь попыток находишь любое. Бинарный поиск делает то же с отсортированным массивом. Сложность только в аккуратности с границами.",
"livecoding-trees": "Дерево — данные с вложенностью: папки с файлами, меню с подменю, комментарии с ответами. Обойти его можно двумя способами. В глубину — нырять до самого низа по одной ветке, потом возвращаться. В ширину — сначала весь первый уровень, потом весь второй. Частая задача — собрать дерево из плоского списка, где у каждого элемента указан родитель.",
"livecoding-grid": "Сетка клеток — это карта, где из каждой клетки можно шагнуть в соседние. Типовая задача «сколько островов»: идёшь по карте, нашёл сушу — прибавил единицу и «затопил» весь этот остров, обойдя соседние клетки суши, чтобы не посчитать его снова.",
"livecoding-react-task": "Самая частая практическая задача: поле ввода, по которому идёт запрос на сервер и показывается список. Проверяют, подумал ли ты о мелочах: не слать запрос на каждую букву, не показать результат устаревшего запроса, показать загрузку, ошибку и «ничего не найдено».",
"livecoding-react-tasks2": "Ещё несколько стандартных заданий и что в каждом проверяют. Таймер — умеешь ли убирать за собой интервал. Модальное окно — думаешь ли про клавиатуру и фокус. Список дел — не портишь ли массив на месте. Бесконечная лента — умеешь ли подгружать по мере прокрутки.",

"cpp-refs": "Указатель — бумажка с адресом: может быть пустой, можно переписать на другой адрес. Ссылка — второе имя для уже существующей вещи: пустой не бывает и на другую вещь не переключается. const — обещание «не буду менять», которое проверяет компилятор.",
"cpp-rule-of-five": "Если класс сам берёт ресурс (память, файл), ему нужно объяснить, как себя правильно копировать и уничтожать, иначе две копии будут считать ресурс своим и освободят его дважды. Отсюда правило: написал одно из таких действий — напиши все. Перемещение (move) — способ не копировать, а передать ресурс новому владельцу, как отдать ключи от квартиры вместо постройки такой же.",
"cpp-virtual": "Виртуальная функция — «у каждого наследника своя версия, и вызовется правильная». Есть общий тип «фильтр» и конкретные фильтры; вызываешь «примени» у общего — срабатывает реализация того фильтра, который там на самом деле. Виртуальный деструктор нужен по той же причине: чтобы при удалении через общий тип убрался весь объект, а не только общая часть.",
"cpp-templates": "Шаблон — заготовка кода с пропуском вместо типа: пишешь функцию один раз, а компилятор сам делает версии для int, double и чего потребуется. То же, что generics в TypeScript, только компилятор создаёт настоящий отдельный код под каждый тип.",
"cpp-stl": "STL — стандартный набор контейнеров. vector — обычный массив, который умеет расти, бери его по умолчанию. map — словарь, отсортированный по ключу. unordered_map — словарь на хэшах, быстрее, но без порядка. Ловушка: когда vector растёт, он переезжает в новое место памяти, и все сохранённые ссылки на его элементы становятся недействительными.",
"cpp-ub": "Стек — память для локальных переменных, освобождается сама при выходе из функции. Куча — память, которую ты попросил явно и за которую отвечаешь. Неопределённое поведение — когда ты нарушил правила языка (вылез за массив, обратился к удалённому), и программа может сделать что угодно: работать, упасть или испортить данные. Самое коварное, что оно может долго не проявляться.",
"cpp-threads-cpp": "Потоки выполняют код одновременно. Проблема — когда два потока одновременно трогают одни данные: результат непредсказуем. Мьютекс — замок на данные: кто захватил, тот работает, остальные ждут. atomic — простая переменная, которую безопасно менять без замка. condition_variable — способ потоку поспать, пока другой не скажет «готово».",
"cpp-qt-connect": "Соединение сигнала со слотом бывает разных типов. Прямое — слот вызывается немедленно, как обычная функция. Через очередь — вызов откладывается и выполнится в потоке получателя, когда тот освободится: так безопасно общаются потоки. По умолчанию Qt сам выбирает нужный тип. moc — генератор, который дописывает за тебя служебный код, чтобы всё это работало.",
"cpp-qt-ownership": "В Qt у объекта может быть родитель, и родитель сам удаляет своих детей — вручную их удалять не надо. deleteLater — «удали меня чуть позже, когда закончится текущая обработка», это безопаснее, чем удалять объект, пока он ещё что-то делает. Главное — не давать одному объекту двух хозяев.",
"cpp-qt-threads": "Тяжёлую работу нельзя делать в потоке интерфейса — окно зависнет. В Qt её выносят так: создают объект-работника, переселяют его в отдельный поток и общаются с ним сигналами. Трогать элементы окна можно только из главного потока, поэтому работник не рисует сам, а присылает результат сигналом.",
"cpp-qt-eventloop": "Приложение Qt крутит бесконечный цикл: взять следующее событие (клик, таймер, перерисовка), обработать, взять следующее. Точно как event loop в JavaScript. И проблема та же: пока обработчик долго работает, цикл стоит и окно не отвечает.",
"cpp-qt-modelview": "Данные отдельно, отображение отдельно. Модель знает, сколько строк и что в каждой ячейке. Таблица на экране спрашивает у модели только то, что сейчас видно. Благодаря этому одни данные можно показать по-разному, а таблица на миллион строк не тормозит.",
"cpp-vtk": "VTK — библиотека 3D-графики, устроенная как конвейер. В начале — источник формы (шар), дальше она превращается в то, что можно нарисовать, потом становится объектом на сцене с положением и цветом, а сцена с камерой и светом выводится в окно. Меняешь что-то в начале конвейера — при следующей отрисовке обновляется всё дальше.",
"cpp-build": "Из исходников программа получается в два шага. Компилятор превращает каждый файл в промежуточный кусок. Линковщик склеивает куски и библиотеки в готовую программу. Ошибка «undefined reference» — от линковщика: он не нашёл, где реализована функция, обычно забыта библиотека. CMake — файл с описанием, что из чего собирать.",
};

const SOON = [
];

const TOPICS = [EXPRESS, RESUME, DB, JSCORE, REACT, NETWORK, BROWSER, TSDEEP, CSSDEEP, PERF, A11Y, SECURITY, NODE, ARCH, SYSDESIGN, TESTING, DEVOPS, AI, LIVECODING, CPP];
const STAGES = [
  { n: 1, title: 'Страховочная сетка', ready: true },
  { n: 2, title: 'Главные темы, глубоко', ready: true },
  { n: 3, title: 'Фронтенд-специфика', ready: true },
  { n: 4, title: 'Бэкенд и инженерия', ready: true },
  { n: 5, title: 'Практика и второй трек', ready: true },
];
const TAGS = { must: ['must know', 't-must'], senior: ['senior', 't-senior'], verify: ['проверь в коде', 't-verify'] };

const KEY = 'otzubov:v1';
const S = { marks: {}, quiz: false, theme: 'system', filter: 'all' };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
const revealed = new Set();
const CODE = {};

const $ = (s, r = document) => r.querySelector(s);
const main = $('#main');
const side = $('#side');

function cardsOf(t) {
  const out = [];
  t.sections.forEach((s, si) => s.cards.forEach(c => out.push({ t, s, si, c, id: t.id + '-' + c.id })));
  return out;
}
const ALL = TOPICS.flatMap(cardsOf);
const strip = (h) => (h || '').replace(/<[^>]+>/g, ' ').replace(/&[a-z]+;/g, ' ');
ALL.forEach(x => {
  x.text = [x.c.q, PLAIN[x.id], x.c.short, x.c.deep, x.c.mine, (x.c.traps || []).join(' '), x.c.code].map(strip).join(' ').toLowerCase();
});

function counts(list) {
  let known = 0, weak = 0;
  list.forEach(x => {
    if (S.marks[x.id] === 'known') known++;
    else if (S.marks[x.id] === 'weak') weak++;
  });
  return { total: list.length, known, weak, none: list.length - known - weak };
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}

function cardHTML(x, showFrom) {
  const { c, id } = x;
  const m = S.marks[id] || '';
  const tags = (c.tags || []).map(k => `<span class="tag ${TAGS[k][1]}">${TAGS[k][0]}</span>`).join('')
    + (c.mine ? '<span class="tag t-resume">есть в резюме</span>' : '');
  const hide = S.quiz && !revealed.has(id);
  let ans = PLAIN[id] ? `<div class="plain"><span class="lbl">Простыми словами</span><div class="prose"><p>${esc(PLAIN[id])}</p></div></div>` : '';
  ans += `<div class="short"><span class="lbl lbl-mark">30 секунд</span><div class="prose">${c.short}</div></div>`;
  if (c.deep) ans += `<details class="deep"><summary>Глубже, если копают</summary><div class="prose">${c.deep}</div></details>`;
  if (c.code) {
    CODE[id] = c.code;
    ans += `<div class="code"><div class="code-head"><span>${esc(c.lang || 'code')}</span><button type="button" data-copy="${id}">копировать</button></div><pre><code data-code="${id}"></code></pre></div>`;
  }
  if (c.traps && c.traps.length) ans += `<div class="traps"><span class="lbl">Ловушки и follow-up</span><div class="prose"><ul>${c.traps.map(t => `<li>${t}</li>`).join('')}</ul></div></div>`;
  if (c.mine) ans += `<div class="mine"><span class="lbl">Из твоего опыта</span><div class="prose">${c.mine}</div></div>`;
  if (c.links && c.links.length) ans += `<div class="links">${c.links.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join('')}</div>`;
  return `<article class="card" id="c-${id}" data-id="${id}" data-mark="${m}">
    <div class="card-h">
      ${showFrom ? `<div class="from">${esc(x.t.title)} · ${esc(x.s.title)}</div>` : ''}
      <h3>${c.q}</h3>
      ${tags ? `<div class="tags">${tags}</div>` : ''}
    </div>
    ${hide ? `<div class="quiz-hint">Сначала ответь вслух, потом проверь себя</div>` : ''}
    <div class="answer" ${hide ? 'hidden' : ''}>${ans}</div>
    <div class="card-f">
      ${S.quiz ? `<button type="button" class="reveal ${hide ? '' : 'ghost'}" data-reveal="${id}">${hide ? 'Показать ответ' : 'Скрыть ответ'}</button>` : ''}
      <span class="spacer"></span>
      <button type="button" class="mk" data-mark="known" aria-pressed="${m === 'known'}">✓ Знаю</button>
      <button type="button" class="mk" data-mark="weak" aria-pressed="${m === 'weak'}">≈ Плаваю</button>
    </div>
  </article>`;
}

function fillCode(root) {
  root.querySelectorAll('[data-code]').forEach(el => { el.textContent = CODE[el.dataset.code]; });
}

function progressHTML(list) {
  const k = counts(list);
  const pk = k.total ? (k.known / k.total) * 100 : 0;
  const pw = k.total ? (k.weak / k.total) * 100 : 0;
  return `<div class="progress" id="prog">
    <div class="bar" role="img" aria-label="Знаю ${k.known}, плаваю ${k.weak} из ${k.total}"><i class="k" style="width:${pk}%"></i><i class="w" style="width:${pw}%"></i></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--good)"></span>Знаю <b>${k.known}</b></span>
      <span><span class="dot" style="background:var(--warn)"></span>Плаваю <b>${k.weak}</b></span>
      <span><span class="dot" style="background:var(--line)"></span>Не отмечено <b>${k.none}</b></span>
      <span>Всего <b>${k.total}</b></span>
    </div>
  </div>`;
}

function filterHTML(list) {
  const k = counts(list);
  const opts = [['all', 'Все', k.total], ['weak', 'Плаваю', k.weak], ['none', 'Не отмечено', k.none], ['known', 'Знаю', k.known]];
  return `<div class="toolbar" id="filters" role="group" aria-label="Фильтр карточек">${opts.map(([v, l, n]) =>
    `<button type="button" class="chip" data-filter="${v}" aria-pressed="${S.filter === v}">${l} · ${n}</button>`).join('')}</div>`;
}

function passes(id) {
  const m = S.marks[id] || 'none';
  return S.filter === 'all' || S.filter === m;
}

function renderTopic(t) {
  const list = cardsOf(t);
  let html = `<div class="kicker">${esc(t.kicker)}</div><h1>${esc(t.title)}</h1><p class="lead">${esc(t.intro)}</p>`;
  html += progressHTML(list) + filterHTML(list);
  html += `<div class="toc">${t.sections.map((s, i) => `<button type="button" data-jump="sec-${i}">${esc(s.title)}</button>`).join('')}</div>`;
  let shown = 0;
  t.sections.forEach((s, i) => {
    const items = list.filter(x => x.si === i && passes(x.id));
    if (!items.length) return;
    shown += items.length;
    html += `<h2 class="sec" id="sec-${i}">${esc(s.title)} <span class="n">${items.length}</span></h2><div class="cards">${items.map(x => cardHTML(x)).join('')}</div>`;
  });
  if (!shown) html += `<div class="empty" style="margin-top:32px">Под этот фильтр карточек нет. Выбери «Все» или отметь пару вопросов.</div>`;
  main.innerHTML = html;
  fillCode(main);
}

function renderSoon(t) {
  const st = STAGES.find(s => s.n === t.stage);
  main.innerHTML = `<div class="kicker">Этап ${t.stage} · ${esc(st.title)}</div><h1>${esc(t.title)}</h1>
    <p class="lead">Полная шпаргалка по этой теме появится на этапе ${t.stage}, по той же ссылке. Самые частые вопросы по ней уже есть в экспресс-пакете.</p>
    <div class="toolbar" style="margin-top:24px"><a class="reveal" style="text-decoration:none" href="#express">Открыть экспресс-пакет</a></div>`;
}

function renderHome() {
  const k = counts(ALL);
  const ex = counts(cardsOf(EXPRESS));
  const rs = counts(cardsOf(RESUME));
  const road = STAGES.map(st => {
    const items = TOPICS.filter(t => (t.stage || 1) === st.n).map(t => [t.id, t.title, true])
      .concat(SOON.filter(s => s.stage === st.n).map(s => [s.id, s.title, false]));
    return `<div class="stage"><div class="stage-h"><b>Этап ${st.n}. ${esc(st.title)}</b><span class="pill ${st.ready ? 'ready' : 'next'}">${st.ready ? 'готово' : 'скоро'}</span></div>
      <div class="stage-t">${items.map(([id, title, ok]) => ok ? `<a href="#${id}">${esc(title)}</a>` : `<span>${esc(title)}</span>`).join('')}</div></div>`;
  }).join('');
  main.innerHTML = `<section class="hero">
      <div class="kicker">Подготовка к собесам · Fullstack, Middle+/Senior</div>
      <h1>Чтобы <em>отскакивало от зубов</em></h1>
      <p class="lead">Каждый вопрос разложен одинаково: ответ на 30 секунд, глубина на случай, если копают, код, ловушки и связка с твоим опытом. Отмечай «знаю» и «плаваю», потом гоняй только слабые места.</p>
      <div class="stats">
        <div class="stat"><div class="v">${k.total}</div><div class="l">вопросов готово</div></div>
        <div class="stat"><div class="v" style="color:var(--good)">${k.known}</div><div class="l">знаю</div></div>
        <div class="stat"><div class="v" style="color:var(--warn)">${k.weak}</div><div class="l">плаваю</div></div>
        <div class="stat"><div class="v">${k.none}</div><div class="l">ещё не смотрел</div></div>
      </div>
    </section>
    <h2 class="sec">Как заниматься</h2>
    <ol class="steps">
      <li><div><b>Прочитай экспресс-пакет и «Защиту резюме»</b><span>${ex.total} + ${rs.total} карточек. Начни с бейджей must know и «есть в резюме». Потом — темы этапа 2 целиком, начиная с баз данных.</span></div></li>
      <li><div><b>Включи «Самопроверку»</b><span>Ответы скрыты. Проговори ответ вслух, раскрой, честно отметь «знаю» или «плаваю».</span></div></li>
      <li><div><b>Гоняй фильтр «Плаваю»</b><span>Перед каждым собесом — только слабые карточки. Отметки хранятся в этом браузере.</span></div></li>
    </ol>
    <h2 class="sec">До собеса — проверь в коде</h2>
    <div class="note">Карточки с бейджем <b>«проверь в коде»</b> описывают твои проекты, но детали реализации в базе фактов не подтверждены: ключ и место кэша тенантов, Slot в ui-baza, алгоритм bento, правило ESLint для границ, URL-синхронизация таблиц, причина отказа от ECharts. Открой репозитории и освежи — по ним будут копать первыми.</div>
    <h2 class="sec">Дорожная карта</h2>
    <div class="road">${road}</div>`;
}

function renderSearch(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = ALL.filter(x => words.every(w => x.text.includes(w)));
  main.innerHTML = `<div class="kicker">Поиск</div><h1>«${esc(q)}»</h1><p class="lead">${hits.length ? 'Найдено карточек: ' + hits.length : 'Ничего не нашлось. Попробуй другое слово, например «индекс», «cors», «memo».'}</p>
    <div class="cards search-res" style="margin-top:24px">${hits.map(x => cardHTML(x, true)).join('')}</div>`;
  fillCode(main);
}

function renderNav(active) {
  const link = (id, title, ct, soon) => `<a class="nav-link ${active === id ? 'active' : ''} ${soon ? 'soon' : ''}" href="#${id}" ${active === id ? 'aria-current="page"' : ''}><span class="nm">${esc(title)}</span><span class="ct">${ct}</span></a>`;
  const ready = (n) => TOPICS.filter(t => (t.stage || 1) === n).map(t => { const k = counts(cardsOf(t)); return link(t.id, t.title, `${k.known}/${k.total}`); }).join('');
  let html = `<h4>Старт</h4>${link('home', 'Главная', '')}${ready(1)}`;
  for (let n = 2; n <= 5; n++) {
    const st = STAGES.find(s => s.n === n);
    html += `<h4>Этап ${n} · ${esc(st.title)}</h4>` + ready(n) + SOON.filter(s => s.stage === n).map(s => link(s.id, s.title, 'скоро', true)).join('');
  }
  side.innerHTML = html;
}

function current() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'home';
  return h;
}

function route(keepScroll) {
  const id = current();
  const q = $('#search').value.trim();
  if (q.length >= 2) {
    renderSearch(q);
    renderNav(null);
    return;
  }
  const t = TOPICS.find(x => x.id === id);
  const soon = SOON.find(x => x.id === id);
  if (t) renderTopic(t);
  else if (soon) renderSoon(soon);
  else renderHome();
  renderNav(t || soon ? id : 'home');
  if (!keepScroll) window.scrollTo(0, 0);
}

function refreshCounts() {
  const id = current();
  const t = TOPICS.find(x => x.id === id);
  if (t && !$('#search').value.trim()) {
    const list = cardsOf(t);
    $('#prog').outerHTML = progressHTML(list);
    $('#filters').outerHTML = filterHTML(list);
  }
  renderNav(t ? id : (SOON.find(x => x.id === id) ? id : (!$('#search').value.trim() ? 'home' : null)));
}

main.addEventListener('click', async (e) => {
  const mk = e.target.closest('.mk');
  if (mk) {
    const card = mk.closest('.card');
    const id = card.dataset.id;
    const v = mk.dataset.mark;
    if (S.marks[id] === v) delete S.marks[id]; else S.marks[id] = v;
    save();
    card.dataset.mark = S.marks[id] || '';
    card.querySelectorAll('.mk').forEach(b => b.setAttribute('aria-pressed', String(S.marks[id] === b.dataset.mark)));
    refreshCounts();
    return;
  }
  const rv = e.target.closest('[data-reveal]');
  if (rv) {
    const id = rv.dataset.reveal;
    if (revealed.has(id)) revealed.delete(id); else revealed.add(id);
    const x = ALL.find(a => a.id === id);
    const card = rv.closest('.card');
    const showFrom = !!card.querySelector('.from');
    const tmp = document.createElement('div');
    tmp.innerHTML = cardHTML(x, showFrom);
    const fresh = tmp.firstElementChild;
    fillCode(fresh);
    card.replaceWith(fresh);
    return;
  }
  const f = e.target.closest('[data-filter]');
  if (f) {
    S.filter = f.dataset.filter;
    save();
    route(true);
    return;
  }
  const j = e.target.closest('[data-jump]');
  if (j) {
    const el = document.getElementById(j.dataset.jump);
    if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    return;
  }
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    try {
      await navigator.clipboard.writeText(CODE[cp.dataset.copy]);
      cp.textContent = 'скопировано';
    } catch (err) {
      const code = cp.closest('.code').querySelector('code');
      const r = document.createRange();
      r.selectNodeContents(code);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
      cp.textContent = 'выделено';
    }
    setTimeout(() => { cp.textContent = 'копировать'; }, 1500);
  }
});

const search = $('#search');
let st;
search.addEventListener('input', () => {
  clearTimeout(st);
  st = setTimeout(() => route(), 120);
});
search.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { search.value = ''; route(); search.blur(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== search && !/input|textarea/i.test(document.activeElement.tagName)) {
    e.preventDefault();
    search.focus();
  }
  if (e.key === 'Escape' && document.body.classList.contains('nav-open')) closeNav();
});

const quizBtn = $('#quizBtn');
function syncQuiz() { quizBtn.setAttribute('aria-pressed', String(S.quiz)); }
quizBtn.addEventListener('click', () => {
  S.quiz = !S.quiz;
  revealed.clear();
  save();
  syncQuiz();
  route(true);
});

const themeBtn = $('#themeBtn');
const THEME_LABEL = { system: 'как в системе', light: 'светлая', dark: 'тёмная' };
function applyTheme() {
  if (S.theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', S.theme);
  const label = 'Тема: ' + THEME_LABEL[S.theme];
  themeBtn.setAttribute('aria-label', label);
  themeBtn.title = label;
}
themeBtn.addEventListener('click', () => {
  S.theme = { system: 'light', light: 'dark', dark: 'system' }[S.theme] || 'system';
  save();
  applyTheme();
});

const menuBtn = $('#menuBtn');
const scrim = $('#scrim');
function openNav() { document.body.classList.add('nav-open'); scrim.hidden = false; menuBtn.setAttribute('aria-expanded', 'true'); }
function closeNav() { document.body.classList.remove('nav-open'); scrim.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); }
menuBtn.addEventListener('click', () => document.body.classList.contains('nav-open') ? closeNav() : openNav());
scrim.addEventListener('click', closeNav);
side.addEventListener('click', (e) => {
  if (e.target.closest('a')) {
    if (search.value) search.value = '';
    closeNav();
    if (e.target.closest('a').getAttribute('href') === location.hash || (!location.hash && e.target.closest('a').getAttribute('href') === '#home')) route();
  }
});

window.addEventListener('hashchange', () => { search.value = ''; route(); });

applyTheme();
syncQuiz();
route();
</script>
