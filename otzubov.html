      { id: 'mt-how', q: 'Как определяется тенант? Где лежит кэш конфига и как он инвалидируется?', tags: ['must', 'senior', 'verify'],
        short: `<p>Из базы: тенант определяется по заголовку <code>Host</code>; конфиг запрашивается при SSR и кэшируется по ключу хоста с TTL; ответы бэкенда 5xx намеренно не кэшируются.</p><p><b>До собеса сверь с репозиторием:</b> где физически лежит кэш (память процесса или Redis), какой TTL, что происходит, когда клиент меняет тему в админке. В базе это помечено как открытый вопрос.</p>`,
        deep: `<h5>Что интервьюер захочет услышать</h5><ul><li><b>Кэш в памяти процесса:</b> быстро и просто, но у каждого инстанса свой кэш, и инвалидация расходится. При нескольких репликах — Redis или короткий TTL.</li><li><b>Почему не кэшировать 5xx:</b> иначе временный сбой бэкенда «залипнет» на весь TTL, и клиент будет видеть сломанную страницу.</li><li><b>Инвалидация:</b> TTL как страховка плюс явный сброс при сохранении настроек в админке. Можно stale-while-revalidate: отдать старое и обновить в фоне.</li><li><b>Безопасность Host:</b> заголовку <code>Host</code> слепо верить нельзя. Нужен whitelist известных доменов, а неизвестный хост → 404, чтобы не было Host header injection и подмены OG-ссылок.</li><li><b>Без мигания темы:</b> тема попадает в HTML как CSS-переменные ещё на сервере, поэтому браузер рисует первый кадр уже в нужных цветах.</li></ul>`,
        traps: ['«А если конфиг-сервис лежит?» — отдаём из кэша устаревшее (stale), а не падаем', '«Как тестировали под нагрузкой?» — вспомни, чем и что смотрели'] },

      { id: 'uib-api', q: 'Compound components и asChild — как это работает?', tags: ['must', 'senior', 'verify'],
        short: `<p><b>Compound components</b> — компонент собирается из частей (<code>Table.Head</code>, <code>Table.Body</code>, <code>Table.Pagination</code>), которые делят состояние через контекст. Вместо пропса на каждый краевой случай потребитель компонует части сам.</p><p><b>asChild</b> — компонент не рендерит свой тег, а передаёт свои props, классы и обработчики единственному ребёнку. Например, <code>&lt;Button asChild&gt;&lt;a href&gt;</code> — ссылка, которая выглядит и ведёт себя как кнопка. Это паттерн Slot из Radix.</p>`,
        deep: `<p>Slot должен аккуратно смёржить: className (сконкатенировать), style, обработчики событий (вызвать оба) и ref (объединить refs). Сверь с исходником ui-baza, как это сделано у тебя.</p>`,
        lang: 'tsx',
        code: `// иллюстрация паттерна, не код ui-baza
function Slot({ children, ...props }: SlotProps) {
  if (!React.isValidElement(children)) return null;
  return React.cloneElement(children, {
    ...props,
    ...children.props,
    className: cx(props.className, children.props.className),
  });
}

function Button({ asChild, ...props }: ButtonProps) {
  const Comp = asChild ? Slot : 'button';
  return <Comp className={styles.button} {...props} />;
}

<Button asChild>
  <a href="/prizes">К призам</a>
</Button>`,
        links: [['Radix: Slot', 'https://www.radix-ui.com/primitives/docs/utilities/slot']] },

      { id: 'bento-algo', q: 'Как работает алгоритм автораскладки без дыр?', tags: ['senior', 'verify'],
        short: `<p>Поиск с возвратом (backtracking) по битовым маскам, опубликован в ui-baza <code>./bento</code>. Идея и постановка — твои, реализация — AI, проверка — ручным тестированием на dev. Будет 100% вопрос «объясни алгоритм», поэтому прочитай исходник перед собесом.</p><p><b>Суть:</b> каждая строка сетки — 12-битная маска занятых ячеек. Находим первую свободную ячейку и пробуем поставить туда каждый оставшийся блок (в допустимых размерах). Если блок влезает, ставим и рекурсивно идём дальше; если дальше тупик — снимаем блок и пробуем следующий.</p>`,
        deep: `<p><b>Почему маски:</b> проверка пересечения блока с занятыми ячейками — одна операция <code>&amp;</code> на строку вместо перебора ячеек. Поставить или снять блок — <code>^</code>.</p><p><b>Сложность</b> в худшем случае экспоненциальная, но блоков на странице мало, а жадный выбор «первой дыры» сильно режет перебор.</p><p><b>Козырь для senior:</b> «раскладка без дыр» — частный случай задачи точного покрытия (exact cover), классическое решение — Algorithm X Кнута / Dancing Links.</p>`,
        lang: 'js',
        code: `// иллюстрация идеи, не код ui-baza
const COLS = 12;
const FULL = (1 << COLS) - 1;
const lowestZeroBit = (row) => 31 - Math.clz32(~row & (row + 1));

function fits(rows, r, c, w, h) {
  if (c + w > COLS) return false;
  const mask = ((1 << w) - 1) << c;
  for (let i = r; i < r + h; i++) if ((rows[i] ?? 0) & mask) return false;
  return true;
}

function toggle(rows, r, c, w, h) {
  const mask = ((1 << w) - 1) << c;
  for (let i = r; i < r + h; i++) rows[i] = (rows[i] ?? 0) ^ mask;
}

function solve(rows, blocks, out) {
  if (blocks.length === 0) return true;
  let r = 0;
  while ((rows[r] ?? 0) === FULL) r++;
  const c = lowestZeroBit(rows[r] ?? 0);
  for (const b of blocks) {
    for (const [w, h] of b.sizes) {
      if (!fits(rows, r, c, w, h)) continue;
      toggle(rows, r, c, w, h);
      out.push({ id: b.id, r, c, w, h });
      if (solve(rows, blocks.filter(x => x !== b), out)) return true;
      out.pop();
      toggle(rows, r, c, w, h);
    }
  }
  return false;
}`,
        traps: ['«Есть тесты?» — да, 30 unit-тестов', '«Что, если раскладки без дыр не существует?» — сверь, какой фолбэк у тебя', '«Почему не CSS grid-auto-flow: dense?» — dense не гарантирует отсутствие дыр и не учитывает правила размеров блоков'] },

    { title: 'Механика «скретч-карта» (бэкенд)', cards: [
      { id: 'scratch-why', q: 'Почему исход выбирается на сервере при старте?', tags: ['must'],
        short: `<p>Исход определяется на сервере при старте сессии взвешенным случайным выбором через <code>crypto.randomBytes</code>. Так стёртый слой сразу показывает результат, а клиент не может на него повлиять. Вероятности скрыты от клиента. Механика сделана по паттерну колеса фортуны.</p>`,
        deep: `<p><b>Почему <code>crypto.randomBytes</code>, а не <code>Math.random</code>:</b> Math.random — не криптостойкий PRNG, его состояние теоретически можно восстановить. Для денег и призов нужен CSPRNG.</p><p><b>Взвешенный выбор:</b> сумма весов W, случайное число в [0, W), идём по накопленным суммам, пока не превысим.</p>`,
        lang: 'ts',
        code: `// иллюстрация взвешенного выбора
function pickWeighted<T>(items: { value: T; weight: number }[]): T {
  const total = items.reduce((s, i) => s + i.weight, 0);
  const rnd = crypto.randomInt(total); // [0, total) — для целых весов
  let acc = 0;
  for (const i of items) {
    acc += i.weight;
    if (rnd < acc) return i.value;
  }
  throw new Error('unreachable');
}` },

      { id: 'scratch-race', q: 'Как защитились от гонок и двойного списания?', tags: ['must', 'senior'],
        short: `<p><b>Два уровня защиты.</b></p><ol><li><b>Redlock</b> на пару «коллекция + игрок»: поиск открытой сессии, проверка допуска и списание платы выполняются одной критической секцией, параллельные запросы того же игрока ждут.</li><li><b>Атомарный claim</b> <code>new → finished</code> — условный апдейт в Mongo. Из двух конкурентов выиграет один, при сбое изменения откатываются.</li></ol><p>Плюс идемпотентность: повторный запуск возвращает уже открытую сессию, а не создаёт новую. При остановке механики сессии принудительно завершаются. Есть журнал, статистика и экспорт, около 44 тестов.</p>`,
        deep: `<p><b>Зачем второй уровень, если есть лок?</b> Распределённый лок не абсолютен: TTL может истечь, пока процесс завис (GC-пауза, сеть), и тогда в секции окажутся двое. Условный атомарный апдейт в БД — это последний рубеж, который не зависит от времени.</p><p>Это тот самый аргумент Kleppmann'а про fencing: корректность должна обеспечивать сама БД.</p>`,

const DB = {

        short: `<p><b>Primary key</b> однозначно идентифицирует строку: уникальный и не NULL. <b>Foreign key</b> ссылается на PK другой таблицы и гарантирует ссылочную целостность. Поведение при удалении родителя задаётся через <code>ON DELETE CASCADE / SET NULL / RESTRICT</code>. Другие ограничения: <code>UNIQUE</code>, <code>NOT NULL</code>, <code>CHECK</code>, <code>DEFAULT</code>.</p><p><b>Связи:</b></p><ul><li><b>1:1</b> — FK с UNIQUE.</li><li><b>1:N</b> — FK на стороне «многих».</li><li><b>N:M</b> — промежуточная таблица (junction) с двумя FK и составным PK.</li></ul>`,
        deep: `<p><b>Natural vs surrogate key:</b> email как ключ — плохая идея, он меняется. Обычно ключ суррогатный: <code>bigserial</code> или UUID.</p><p><b>UUID v4 vs v7:</b> v4 случайный, поэтому вставки разбрасываются по B-tree и индекс фрагментируется. v7 упорядочен по времени, вставки идут в конец, что дружелюбнее к индексу.</p><p>FK в Postgres <b>не создаёт индекс автоматически</b> на ссылающейся колонке. Без него JOIN и каскадное удаление тормозят.</p>`,
        lang: 'sql',
        code: `CREATE TABLE users (

-- N:M

        traps: ['Почему деньги хранят в <code>numeric</code> или в копейках как integer, а не во <code>float</code>?', 'Что быстрее для PK: integer или UUID, и почему?'] },

      { id: 'joins', q: 'Виды JOIN и порядок выполнения SELECT', tags: ['must'],
        short: `<ul><li><b>INNER JOIN</b> — только совпавшие строки.</li><li><b>LEFT JOIN</b> — все слева, справа NULL, если пары нет.</li><li><b>RIGHT JOIN</b> — зеркально LEFT.</li><li><b>FULL JOIN</b> — все с обеих сторон.</li><li><b>CROSS JOIN</b> — декартово произведение.</li><li><b>Self join</b> — таблица с самой собой (сотрудник → руководитель).</li></ul><p><b>Логический порядок выполнения:</b> FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT. Поэтому алиас из SELECT нельзя использовать в WHERE, а агрегат фильтруют в HAVING.</p>`,
        lang: 'sql',
        code: `-- пользователи без заказов (anti-join)

        traps: ['Условие на правую таблицу в WHERE превращает LEFT JOIN в INNER — его ставят в ON', '<code>NOT IN</code> с NULL в подзапросе возвращает пустоту — используй <code>NOT EXISTS</code>', 'COUNT(*) vs COUNT(col): второй не считает NULL'] },

        short: `<p>Оконная функция считает значение по «окну» связанных строк, <b>не схлопывая</b> их в одну, в отличие от GROUP BY. Синтаксис: <code>fn() OVER (PARTITION BY … ORDER BY …)</code>.</p><p>Основные функции: <code>ROW_NUMBER</code>, <code>RANK</code>, <code>DENSE_RANK</code>, <code>LAG</code>/<code>LEAD</code> (предыдущая и следующая строка), <code>SUM() OVER</code> для накопительных итогов.</p>`,
        lang: 'sql',
        code: `-- top-3 заказа каждого пользователя

-- вторая максимальная зарплата

-- дубликаты email

-- накопительная выручка по дням

        traps: ['RANK vs DENSE_RANK: при равенстве RANK пропускает номера (1, 1, 3), DENSE_RANK — нет (1, 1, 2)', 'CTE (<code>WITH</code>) vs подзапрос — читаемость; рекурсивный CTE для деревьев'] },

      { id: 'mongo-model', q: 'Моделирование в MongoDB: embedding vs referencing', tags: ['must'],
        short: `<p><b>Встраивай</b>, если данные читаются вместе, принадлежат родителю и их немного (1:few). <b>Ссылайся</b>, если сущность живёт сама по себе, переиспользуется или её неограниченно много (1:many, N:M).</p><p>Документ ограничен 16 МБ. Неограниченно растущий массив внутри документа — антипаттерн: документ пухнет, индекс по массиву раздувается.</p>`,
        deep: `<h5>Паттерны Mongo</h5><ul><li><b>Extended reference</b> — ссылка плюс копия нужных полей (имя автора рядом с id), чтобы не делать $lookup.</li><li><b>Subset</b> — в документе хранится последние N отзывов, остальные в отдельной коллекции.</li><li><b>Computed</b> — предрасчитанные агрегаты (счётчики, суммы).</li><li><b>Bucket</b> — группировка временных рядов по часам или дням.</li><li><b>Schema versioning</b> — поле <code>schemaVersion</code> и ленивая миграция при чтении.</li></ul><p>Единственная атомарная единица без транзакций — один документ. Если что-то нужно менять атомарно вместе, это аргумент встроить.</p>`,
        mine: `<p>Раскладка промостраницы (<code>cardPageLayout</code>) встроена: читается целиком и меняется атомарно вместе со страницей. Механики — по <code>uuid</code>: у них свой жизненный цикл.</p>` },

    { title: 'Индексы и скорость запросов', cards: [
      { id: 'explain', q: 'Как читать EXPLAIN? Какие бывают планы?', tags: ['must', 'senior'],
        short: `<p><code>EXPLAIN</code> показывает план запроса, <code>EXPLAIN ANALYZE</code> ещё и выполняет его, выводя реальное время и число строк. Если оценка rows сильно расходится с actual, статистика устарела — <code>ANALYZE</code>.</p><ul><li><b>Seq Scan</b> — полный перебор таблицы.</li><li><b>Index Scan</b> — по индексу, потом за строками в таблицу.</li><li><b>Index Only Scan</b> — всё есть в индексе.</li><li><b>Bitmap Heap Scan</b> — собрать подходящие страницы по индексу и прочитать их пачкой.</li></ul><p><b>JOIN-алгоритмы:</b> Nested Loop (мало строк снаружи плюс индекс внутри), Hash Join (большие наборы без сортировки), Merge Join (оба входа отсортированы).</p>`,
        deep: `<p>Seq Scan не всегда плох: на маленькой таблице или когда выбирается большая её часть, перебор быстрее индекса.</p><p><b>Что смотреть первым:</b> самый дорогой узел, <code>Rows Removed by Filter</code> (много читаем, мало оставляем), сортировку на диске (<code>external merge</code>).</p><p><b>Mongo:</b> <code>explain('executionStats')</code>. Смотри <code>COLLSCAN</code> vs <code>IXSCAN</code>, <code>totalDocsExamined</code> vs <code>nReturned</code> и наличие <code>SORT</code> в памяти.</p>`,

        short: `<ul><li><b>Partial</b> — индекс только по части строк: <code>WHERE deleted_at IS NULL</code>. Он меньше и быстрее.</li><li><b>Expression</b> — индекс по выражению: <code>LOWER(email)</code>.</li><li><b>Covering</b> — <code>INCLUDE (col)</code> добавляет колонки в листья индекса, чтобы получался index-only scan.</li><li><b>Unique partial</b> — уникальность среди живых строк, например один активный заказ на пользователя.</li></ul><p>На проде индекс создают <code>CONCURRENTLY</code>, чтобы не блокировать запись в таблицу.</p>`,

      { id: 'pagination', q: 'OFFSET vs keyset (cursor) пагинация', tags: ['must'],
        short: `<p><b>OFFSET/LIMIT</b> — просто и можно прыгнуть на любую страницу, но БД всё равно читает и выкидывает первые N строк: на большой странице это медленно. А если между запросами вставились новые строки, элементы дублируются или пропадают.</p><p><b>Keyset</b> — «дай 20 после последнего увиденного»: <code>WHERE (created_at, id) &lt; (:ts, :id)</code>. Скорость стабильная на любой глубине, вставки не мешают, но прыгнуть на страницу 57 нельзя. Подходит для бесконечных лент и API.</p>`,

      { id: 'pool', q: 'Connection pooling — зачем?', tags: ['senior'],
        short: `<p>Открыть соединение с БД дорого: TCP, TLS, аутентификация, а в Postgres ещё и <b>отдельный процесс на каждое соединение</b>. Пул держит N открытых соединений и раздаёт их запросам.</p><p>Сотни инстансов или serverless-функций быстро исчерпывают <code>max_connections</code>. Тогда ставят внешний пулер — PgBouncer в transaction mode.</p>`,

    { title: 'Транзакции и конкуренция', cards: [
      { id: 'locks', q: 'Блокировки: FOR UPDATE, SKIP LOCKED, deadlock', tags: ['senior'],
        short: `<p><code>SELECT … FOR UPDATE</code> берёт блокировку на строки до конца транзакции: другие писатели ждут. <code>FOR UPDATE SKIP LOCKED</code> пропускает заблокированные строки, на этом строят очередь задач в Postgres: каждый воркер берёт свою задачу.</p><p><b>Deadlock</b> — две транзакции ждут друг друга. Postgres его обнаружит и убьёт одну из них. Профилактика: брать блокировки в одном порядке, держать транзакции короткими, ретраить при ошибке.</p>`,

      { id: 'mvcc', q: 'Как устроен MVCC и зачем VACUUM?', tags: ['senior'],
        short: `<p><b>MVCC</b> (multi-version concurrency control): UPDATE в Postgres не перезаписывает строку, а создаёт новую версию. Старая помечается мёртвой. Каждая транзакция видит версии, валидные для её снимка, поэтому читатели не блокируют писателей и наоборот.</p><p>Мёртвые версии копятся (bloat). <b>VACUUM</b> освобождает место под повторное использование, autovacuum делает это в фоне. Долгие транзакции мешают VACUUM: он не может удалить версии, которые транзакция ещё может увидеть.</p>`,
        traps: ['Почему «idle in transaction» на проде опасен', 'VACUUM vs VACUUM FULL (второй переписывает таблицу и блокирует её)'] },

      { id: 'mongo-tx', q: 'Атомарность и транзакции в MongoDB', tags: ['must'],
        short: `<p>Операция над <b>одним документом</b> атомарна всегда, включая вложенные массивы и поддокументы. Отсюда главное правило: моделируй так, чтобы то, что меняется вместе, лежало в одном документе.</p><p><b>Multi-document транзакции</b> есть с 4.0, работают на replica set или шардированном кластере, по умолчанию живут до 60 секунд и дороже одиночных операций.</p><p><b>Атомарные операторы:</b> <code>$inc</code>, <code>$push</code>, <code>$set</code> с условием в фильтре, <code>findOneAndUpdate</code>.</p>`,
        deep: `<p><b>Write concern</b> (<code>w: 'majority'</code>) — сколько реплик должны подтвердить запись. <b>Read concern</b> (<code>majority</code>, <code>snapshot</code>) — какую версию данных видит чтение.</p><p>С <code>w: 1</code> запись может потеряться при смене primary: она откатится (rollback).</p>`,
        lang: 'js',
        code: `// атомарное списание баллов без гонки
const res = await Users.updateOne(

);
if (res.modifiedCount === 0) throw new InsufficientFunds();

// транзакция в mongoose
await mongoose.connection.transaction(async (session) => {

});`,
        mine: `<p>Скретч-карта: Redlock плюс атомарный claim <code>new → finished</code>. Это ровно атомарная операция над одним документом с условием в фильтре.</p>` },

    { title: 'Масштабирование и эксплуатация', cards: [
      { id: 'replication', q: 'Репликация, шардинг, партиционирование', tags: ['must', 'senior'],
        short: `<p><b>Репликация</b> — копии данных на нескольких узлах: отказоустойчивость и масштабирование чтения. Primary принимает запись, реплики догоняют. Асинхронная репликация даёт <b>лаг</b>: прочитал с реплики сразу после записи — данных ещё нет.</p><p><b>Шардинг</b> — горизонтальное разделение данных по ключу между узлами, масштабирует запись. <b>Партиционирование</b> — разделение таблицы на части внутри одного сервера (по дате), упрощает удаление старого и ускоряет запросы по диапазону.</p>`,
        deep: `<p><b>Ключ шардирования</b> решает всё. Монотонный ключ (время) создаёт hot spot: все записи летят в один шард. Хэш распределяет равномерно, но убивает запросы по диапазону. Запросы без ключа шардирования идут во все шарды (scatter-gather).</p><p><b>Read-your-writes:</b> после записи читать с primary или ждать, пока реплика догонит до нужной позиции.</p>` },

      { id: 'cap', q: 'CAP и PACELC', tags: ['senior'],
        short: `<p><b>CAP:</b> при сетевом разделении (P) распределённая система выбирает либо согласованность (C — отказать или подождать), либо доступность (A — ответить, возможно, устаревшим). Без разделения выбирать не нужно.</p><p><b>PACELC</b> добавляет: Else, в нормальной работе, выбираешь между задержкой (L) и согласованностью (C). Mongo с <code>majority</code> ближе к CP, Cassandra — к AP с настраиваемой согласованностью.</p>`,
        traps: ['«CA-система» в распределённом мире не существует: разделение сети неизбежно', 'Eventual consistency на примере: лайк появился не у всех сразу'] },

      { id: 'migrations', q: 'Миграции схемы без даунтайма', tags: ['must', 'senior'],
        short: `<p><b>Expand → migrate → contract.</b> Сначала добавляешь новое, совместимое со старым кодом (колонку nullable, новую таблицу). Потом деплоишь код, который пишет в обе схемы, и переносишь данные. В конце убираешь старое.</p><p>Каждый шаг должен работать и со старой, и с новой версией приложения: при rolling deploy они какое-то время живут одновременно.</p>`,
        deep: `<p><b>Опасно на больших таблицах:</b> <code>ADD COLUMN … DEFAULT</code> со сложным выражением, <code>ALTER TYPE</code>, создание индекса без <code>CONCURRENTLY</code>, переименование колонки (старый код сломается).</p><p><b>Миграции данных</b> должны быть идемпотентными и возобновляемыми: обрабатывай батчами и отмечай прогресс, чтобы после падения запускать заново безопасно.</p>`,
        mine: `<p>Перезапускаемая миграция всех промостраниц на новую модель (migrate-mongo) и классический режим, оставленный ради обратной совместимости, — твой живой пример expand/contract.</p>` },

      { id: 'orm', q: 'ORM или чистый SQL? Prisma и mongoose', tags: ['must'],
        short: `<p><b>ORM</b> даёт типизацию, миграции, защиту от SQL-инъекций и скорость разработки. Цена: N+1 на ленивых связях, неэффективные запросы, «магия». Сложные отчёты и агрегации часто пишут сырым SQL, но с параметрами.</p><p><b>Prisma:</b> схема в <code>schema.prisma</code> — источник правды, генерируется типизированный клиент, есть <code>prisma migrate</code>, <code>include</code>/<code>select</code> для связей, <code>$transaction</code>. <b>mongoose:</b> схемы и валидация поверх Mongo, middleware (pre/post hooks), <code>populate</code> (это отдельные запросы, а не join), <code>lean()</code> возвращает plain-объекты и работает быстрее.</p>`,
        mine: `<p>Prisma + PostgreSQL — CMS адвокатов (запросы из серверной части Next.js). mongoose + migrate-mongo — cp-back.</p>`,
        traps: ['Как увидеть, какие SQL генерирует ORM? (логирование запросов)', 'Почему populate в цикле — это N+1'] },

      { id: 'caching', q: 'Кэширование: стратегии, инвалидация, вытеснение', tags: ['must', 'senior'],
        short: `<ul><li><b>Cache-aside</b> (lazy): читаем кэш, при промахе идём в БД и кладём результат в кэш.</li><li><b>Write-through</b> — пишем в кэш и в БД синхронно.</li><li><b>Write-behind</b> — пишем в кэш, в БД пишем асинхронно: быстро, но можно потерять данные.</li></ul><p><b>Инвалидация:</b> TTL как страховка плюс явное удаление ключа при изменении данных. Удалять надёжнее, чем обновлять: меньше гонок.</p><p><b>Вытеснение</b> при нехватке памяти: LRU, LFU, по TTL (<code>maxmemory-policy</code> в Redis).</p>`,
        deep: `<p><b>Cache stampede</b> — популярный ключ истёк, и тысяча запросов одновременно идёт в БД. Лечится блокировкой или single-flight (пересчитывает один, остальные ждут), случайным разбросом TTL и фоновым обновлением до истечения.</p><p><b>Negative caching</b> — кэшировать «не найдено» коротко. При этом ошибки (5xx) не кэшируют.</p>`,
        mine: `<p>Кэш конфига тенантов по хосту с TTL, где 5xx бэкенда не кэшируются, — готовый пример. Детали реализации сверь с кодом.</p>` },

};

const JSCORE = {

  sections: [
    { title: 'Типы, числа, объекты', cards: [
      { id: 'numbers', q: 'Почему 0.1 + 0.2 !== 0.3? Как считать деньги?', tags: ['must'],
        short: `<p>Все <code>number</code> в JS — 64-битные числа с плавающей точкой (IEEE 754). 0.1 и 0.2 не представимы в двоичной системе точно, поэтому сумма равна <code>0.30000000000000004</code>.</p><p><b>Деньги</b> считают в минимальных единицах (копейках) целыми числами, либо через decimal-библиотеку, либо на сервере в <code>numeric</code>. Сравнение дробных — с допуском <code>Number.EPSILON</code>.</p>`,
        deep: `<p><code>Number.MAX_SAFE_INTEGER</code> = 2<sup>53</sup> − 1. Выше начинаются потери точности, например у id из БД <code>bigint</code>. Для них — <code>BigInt</code> (<code>123n</code>) или передача id строкой в JSON.</p><p><code>toFixed</code> иногда округляет неожиданно: <code>(1.005).toFixed(2)</code> даёт <code>'1.00'</code>, потому что 1.005 в памяти хранится как 1.00499…. Для отображения есть <code>Intl.NumberFormat</code>.</p>`,
        lang: 'js',
        code: `0.1 + 0.2 === 0.3                              // false
Math.abs(0.1 + 0.2 - 0.3) < Number.EPSILON     // true

2n ** 64n                                      // 18446744073709551616n
new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB' }).format(1234.5)
// '1 234,50 ₽'`,
        traps: ['<code>parseInt(0.0000005)</code> → 5: число сначала превращается в строку «5e-7», и парсер читает только «5». Всегда передавай строку и основание: <code>parseInt(s, 10)</code>', 'Почему <code>typeof NaN === \'number\'</code>'] },

      { id: 'iterators', q: 'Итераторы, генераторы, for...of vs for...in', tags: ['must'],
        short: `<p><b>Iterable</b> — объект с методом <code>[Symbol.iterator]()</code>, который возвращает итератор с методом <code>next()</code> → <code>{ value, done }</code>. Iterable — массивы, строки, Map, Set, arguments, NodeList. Их понимают <code>for...of</code>, spread и деструктуризация.</p><p><b>Генератор</b> (<code>function*</code>) — функция, которую можно приостановить на <code>yield</code>: ленивые последовательности, бесконечные потоки.</p><p><code>for...in</code> перебирает перечислимые <b>ключи</b>, включая унаследованные, — не для массивов. <code>for...of</code> перебирает <b>значения</b> iterable.</p>`,
        lang: 'js',
        code: `function* range(from, to, step = 1) {

}
[...range(0, 5)]; // [0, 1, 2, 3, 4]

idGen.next().value; // 1

const obj = {

for (const v of obj) console.log(v); // a, b`,

      { id: 'descriptors', q: 'Дескрипторы свойств, геттеры, Proxy и Reflect', tags: ['senior'],
        short: `<p>У каждого свойства есть дескриптор: <code>value</code>, <code>writable</code>, <code>enumerable</code>, <code>configurable</code>, либо <code>get</code>/<code>set</code> для аксессоров. Задаются через <code>Object.defineProperty</code>.</p><p>По силе защиты: <code>preventExtensions</code> (нельзя добавить свойства) &lt; <code>seal</code> (ещё и удалить) &lt; <code>freeze</code> (ещё и изменить). Все три — неглубокие.</p><p><b>Proxy</b> перехватывает операции над объектом: get, set, has, deleteProperty и другие. На нём построена реактивность MobX 6 и Vue 3. <b>Reflect</b> — те же операции в виде функций, удобно вызывать поведение по умолчанию внутри ловушки.</p>`,
        lang: 'js',
        code: `function observable(target, onChange) {
  return new Proxy(target, {
    get(t, key, receiver) {
      track(t, key);
      return Reflect.get(t, key, receiver);
    },
    set(t, key, value, receiver) {
      const ok = Reflect.set(t, key, value, receiver);
      onChange(key, value);
      return ok;
    },
  });
}`,
        mine: `<p>Это ответ на «как MobX/Vue узнают, что ты прочитал поле»: <code>get</code>-ловушка регистрирует зависимость текущей реакции (observer-компонента), а <code>set</code>-ловушка запускает зависящие реакции.</p>` },

      { id: 'mapset', q: 'Map vs Object, Set, WeakMap — когда что?', tags: ['must'],
        short: `<p><b>Map:</b> ключи любого типа (в том числе объекты), сохраняет порядок вставки, есть <code>size</code>, быстрые частые добавления и удаления, нет коллизий с прототипом. <b>Object</b> — для записей с известными строковыми ключами и JSON.</p><p><b>Set</b> — уникальные значения: быстрое <code>has</code>, дедупликация <code>[...new Set(arr)]</code>. С 2024 года появились <code>union</code>, <code>intersection</code>, <code>difference</code>.</p><p><b>WeakMap/WeakSet</b> — ключи только объекты, ключ не удерживается от GC. Подходят для приватных данных и кэша, привязанного к объекту. Их нельзя перебрать.</p>`,
        traps: ['<code>JSON.stringify(new Map())</code> → <code>{}</code>', 'Почему <code>arr.includes</code> в цикле — O(n²), а Set — O(n)'] },

      { id: 'arrays', q: 'Методы массивов: мутирующие и нет, новинки', tags: ['must'],
        short: `<p><b>Мутируют исходный массив:</b> <code>push</code>, <code>pop</code>, <code>shift</code>, <code>unshift</code>, <code>splice</code>, <code>sort</code>, <code>reverse</code>, <code>fill</code>. В React-стейте и MobX-сторах это частая ошибка. <b>Новые иммутабельные версии</b> (ES2023): <code>toSorted</code>, <code>toReversed</code>, <code>toSpliced</code>, <code>with(i, v)</code>.</p><p><b>Полезное:</b> <code>at(-1)</code>, <code>flat</code>/<code>flatMap</code>, <code>findLast</code>, <code>Array.from({ length: n }, fn)</code>, <code>Object.groupBy</code> (ES2024).</p>`,
        lang: 'js',
        code: `const nums = [10, 1, 5];

    { title: 'Функции', cards: [
      { id: 'hof', q: 'Функции высшего порядка, каррирование, мемоизация', tags: ['must'],
        short: `<p><b>Функция высшего порядка</b> принимает или возвращает функцию: <code>map</code>, <code>debounce</code>, HOC в React. <b>Чистая функция</b> зависит только от аргументов и не имеет побочных эффектов. Её легко тестировать и мемоизировать.</p><p><b>Каррирование</b> — <code>f(a, b, c)</code> превращается в <code>f(a)(b)(c)</code>, удобно для частичного применения. <b>Мемоизация</b> — кэш результатов по аргументам.</p>`,
        lang: 'js',
        code: `const curry = (fn) => function curried(...args) {
  return args.length >= fn.length
    ? fn.apply(this, args)

};
const add = curry((a, b, c) => a + b + c);
add(1)(2)(3); // 6
add(1, 2)(3); // 6

function memoize(fn) {

  return (arg) => {

const compose = (...fns) => (x) => fns.reduceRight((acc, f) => f(acc), x);`,
        traps: ['Как мемоизировать функцию от нескольких аргументов? (ключ через JSON или вложенные Map)', 'Чем опасен неограниченный кэш (утечка памяти → LRU)'] },

      { id: 'debounce', q: 'Напиши debounce и throttle', tags: ['must'],
        short: `<p><b>Debounce</b> вызывает функцию, когда вызовы <b>прекратились</b> на N мс. Подходит для поиска по мере ввода и ресайза. <b>Throttle</b> вызывает не чаще раза в N мс. Подходит для скролла, mousemove, отправки координат.</p>`,
        lang: 'js',
        code: `function debounce(fn, ms) {
  let timer;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), ms);
  };
}

function throttle(fn, ms) {
  let last = 0;
  let timer;
  return function (...args) {
    const now = Date.now();
    const rest = ms - (now - last);
    if (rest <= 0) {
      last = now;
      fn.apply(this, args);
    } else {
      clearTimeout(timer);
      timer = setTimeout(() => {
        last = Date.now();
        fn.apply(this, args);
      }, rest);
    }
  };
}`,
        traps: ['Добавь <code>cancel()</code> и опцию leading', 'Почему debounce, созданный внутри компонента React без <code>useMemo</code>/<code>useRef</code>, не работает (новый на каждый рендер)'] },

      { id: 'call-apply', q: 'call, apply, bind — и как написать bind самому', tags: ['must'],
        short: `<p><code>call(ctx, a, b)</code> и <code>apply(ctx, [a, b])</code> вызывают функцию сразу с заданным <code>this</code>. Разница только в том, как передаются аргументы. <code>bind(ctx, a)</code> возвращает новую функцию с привязанным <code>this</code> и частично применёнными аргументами.</p>`,
        lang: 'js',
        code: `Function.prototype.myBind = function (ctx, ...bound) {

};

Function.prototype.myCall = function (ctx, ...args) {

    { title: 'Асинхронность на практике', cards: [
      { id: 'promise-all', q: 'Напиши Promise.all и promisify', tags: ['must'],
        short: `<p><code>Promise.all</code> возвращает промис, который резолвится массивом результатов <b>в исходном порядке</b> или реджектится первой ошибкой. Пустой массив сразу даёт <code>[]</code>. Элементы могут быть не промисами, поэтому их оборачивают в <code>Promise.resolve</code>.</p>`,
        lang: 'js',
        code: `function promiseAll(items) {
  return new Promise((resolve, reject) => {
    const arr = Array.from(items);
    const results = new Array(arr.length);
    let left = arr.length;
    if (left === 0) return resolve(results);
    arr.forEach((item, i) => {
      Promise.resolve(item).then((value) => {
        results[i] = value;
        if (--left === 0) resolve(results);
      }, reject);
    });
  });
}

const promisify = (fn) => (...args) =>
  new Promise((resolve, reject) =>
    fn(...args, (err, data) => (err ? reject(err) : resolve(data))));`,
        traps: ['Напиши allSettled и пул с ограничением параллелизма — частые продолжения'] },

      { id: 'retry', q: 'Ретраи, таймауты, отмена запросов', tags: ['must', 'senior'],
        short: `<p><b>Ретраить</b> можно только идемпотентные операции или запросы с ключом идемпотентности, и только на временных ошибках (сеть, 502/503/504, 429). Между попытками — экспоненциальная задержка со случайным разбросом (jitter), иначе все клиенты ударят одновременно.</p><p><b>Таймаут</b> — <code>AbortSignal.timeout(ms)</code>. <b>Отмена</b> — <code>AbortController</code>: уходишь со страницы или меняется поисковый запрос → отменяешь старый запрос.</p>`,
        lang: 'js',
        code: `async function withRetry(fn, { retries = 3, base = 300 } = {}) {
  for (let attempt = 0; ; attempt++) {

      return await fn();
    } catch (e) {

      const delay = base * 2 ** attempt * (0.5 + Math.random());

    }

}

await fetch(url, { signal: AbortSignal.timeout(5000) });`,

      { id: 'output-tasks', q: 'Задачки «что выведет»: event loop, this, замыкания', tags: ['must'],
        short: `<p>Алгоритм решения: <b>1)</b> выпиши весь синхронный код по порядку; <b>2)</b> микрозадачи в порядке постановки, помня, что каждая может добавить новые; <b>3)</b> макрозадачи по одной, и после каждой снова все микрозадачи. Для <code>this</code> смотри только на то, <b>как</b> функция вызвана.</p>`,
        lang: 'js',
        code: `// 1

// 1 3 4 2

    { title: 'Ошибки и язык', cards: [
      { id: 'errors', q: 'Обработка ошибок: свои классы, cause, finally', tags: ['must'],
        short: `<p>Свои ошибки делают через <code>class X extends Error</code>, чтобы различать их через <code>instanceof</code>. Причину сохраняют через <code>new Error(msg, { cause })</code>. Встроенные типы: <code>TypeError</code>, <code>RangeError</code>, <code>SyntaxError</code>, <code>ReferenceError</code>, <code>AggregateError</code> (из <code>Promise.any</code>).</p><p><code>finally</code> выполняется всегда. Если в нём <code>return</code>, он перекроет и результат, и брошенную ошибку — так делать нельзя.</p><p>Глобально: <code>window.onerror</code>, <code>unhandledrejection</code>, error boundaries в React, sentry-подобные сервисы.</p>`,
        lang: 'js',

function f() {

        short: `<p><b>TCP</b> — соединение с рукопожатием, гарантированная доставка и порядок, контроль перегрузки. Цена — задержка на установку соединения и head-of-line blocking: потерялся один пакет — ждут все потоки. <b>UDP</b> — без соединения и без гарантий, зато быстро: видео, игры, DNS.</p><p><b>QUIC</b> — транспорт поверх UDP со встроенным TLS 1.3. Потоки независимы, поэтому потеря пакета тормозит только свой поток. Рукопожатие — 1 RTT, при повторном подключении бывает 0-RTT. Соединение переживает смену сети (Wi-Fi → LTE).</p>`,
        traps: ['Почему HTTP/2 на плохой сети иногда хуже HTTP/1.1 (TCP HOL на одном соединении)'] },

      { id: 'tls', q: 'Как работает HTTPS / TLS?', tags: ['must'],
        short: `<ol><li>Клиент и сервер договариваются о версии и шифрах.</li><li>Сервер присылает <b>сертификат</b>. Браузер проверяет цепочку до доверенного корневого центра, домен и срок действия.</li><li>Обмен ключами (ECDHE) — вырабатывается общий симметричный ключ. Дальше трафик шифруется им, асимметрика нужна только на старте.</li></ol><p>TLS 1.3 — 1 RTT и только стойкие шифры. <b>HSTS</b> (<code>Strict-Transport-Security</code>) говорит браузеру ходить на домен только по HTTPS и защищает от downgrade-атак.</p>`,
        traps: ['Что такое forward secrecy (утечка ключа сервера не раскрывает старый трафик)', 'Где обычно терминируется TLS? (на балансировщике или nginx)'] },

      { id: 'dns', q: 'DNS: типы записей и почему смена домена «долгая»', tags: ['must'],
        short: `<p><b>Записи:</b> <code>A</code>/<code>AAAA</code> — IPv4/IPv6, <code>CNAME</code> — алиас на другое имя (нельзя на корне домена), <code>MX</code> — почта, <code>TXT</code> — верификация, SPF, DKIM, <code>NS</code> — делегирование зоны.</p><p>У каждой записи есть <b>TTL</b> — сколько резолверы её кэшируют. Поэтому смена IP «расходится» до истечения старого TTL. Перед миграцией TTL заранее понижают.</p>`,
        mine: `<p>Промостраницы деплоятся на свой или дефолтный домен клиента. Вспомни, как подключается кастомный домен: CNAME на ваш хост, выпуск сертификата. Это частый вопрос к мультитенантным системам.</p>` },
    ]},

    { title: 'Заголовки и cookie', cards: [
      { id: 'headers', q: 'Какие HTTP-заголовки важно знать?', tags: ['must'],
        short: `<ul><li><b>Контент:</b> <code>Content-Type</code>, <code>Accept</code>, <code>Content-Encoding</code> (gzip, br), <code>Content-Length</code>.</li><li><b>Авторизация:</b> <code>Authorization: Bearer …</code>, <code>Cookie</code>/<code>Set-Cookie</code>.</li><li><b>Кэш:</b> <code>Cache-Control</code>, <code>ETag</code>, <code>If-None-Match</code>, <code>Vary</code>.</li><li><b>CORS:</b> <code>Origin</code>, <code>Access-Control-*</code>.</li><li><b>Прокси:</b> <code>Host</code>, <code>X-Forwarded-For</code>/<code>-Proto</code>, <code>Forwarded</code>.</li><li><b>Безопасность:</b> <code>Content-Security-Policy</code>, <code>Strict-Transport-Security</code>, <code>X-Content-Type-Options: nosniff</code>, <code>frame-ancestors</code> в CSP (замена <code>X-Frame-Options</code>), <code>Referrer-Policy</code>, <code>Permissions-Policy</code>.</li></ul>`,
        mine: `<p>Мультитенантность опирается на <code>Host</code>. За прокси реальный хост и протокол приходят в <code>X-Forwarded-*</code>, и доверять им можно только от своего прокси.</p>` },

      { id: 'cookies', q: 'Атрибуты cookie: SameSite, Secure, HttpOnly, Domain', tags: ['must'],
        short: `<ul><li><code>HttpOnly</code> — недоступна из JS.</li><li><code>Secure</code> — только по HTTPS.</li><li><code>SameSite=Strict</code> — не уходит ни с каких межсайтовых запросов.</li><li><code>SameSite=Lax</code> (дефолт в Chromium-браузерах, лучше указывать явно) — уходит только при навигации верхнего уровня через GET.</li><li><code>SameSite=None</code> — уходит всегда, требует <code>Secure</code>.</li><li><code>Domain</code> — без него cookie только для точного хоста; с <code>Domain=example.com</code> — и для поддоменов.</li><li><code>Path</code>, <code>Max-Age</code>/<code>Expires</code>.</li><li>Префиксы <code>__Host-</code> и <code>__Secure-</code> заставляют браузер проверять безопасные атрибуты.</li></ul>`,
        deep: `<p><b>Site vs origin:</b> site — это регистрируемый домен (<code>example.com</code>), origin — схема + хост + порт. <code>a.example.com</code> и <code>b.example.com</code> — разные origin, но один site. На этом строятся SameSite и CORS.</p><p><b>Сторонние cookie:</b> Safari и Firefox их блокируют. Chrome отказался от полного отключения, но они всё равно ненадёжны. Для встраиваемых виджетов есть Partitioned cookies (CHIPS).</p>`,
        mine: `<p>Мультитенантность на разных доменах клиентов: cookie авторизации одного тенанта не видна на домене другого — и это хорошо. Вспомни, как у вас устроен вход пользователя на доменах разных клиентов: это хороший follow-up.</p>` },
    ]},

    { title: 'Дизайн API', cards: [
      { id: 'rest', q: 'Как спроектировать хороший REST API?', tags: ['must', 'senior'],
        short: `<ul><li><b>Ресурсы</b> — существительные во множественном числе (<code>/orders/42/items</code>), действие задаёт метод.</li><li><b>Корректные коды</b>, единый формат ошибок (Problem Details, RFC 9457): <code>type</code>, <code>title</code>, <code>status</code>, <code>detail</code> + свои коды ошибок.</li><li>Пагинация (cursor), фильтры и сортировка — в query.</li><li><b>Версионирование</b> — <code>/v1</code> или заголовок; ломающие изменения только с новой версией.</li><li>Идемпотентность и <code>Idempotency-Key</code> для опасных POST.</li><li>Документация — OpenAPI, контракт пишется до кода (contract-first).</li></ul>`,
        mine: `<p>Бэкенд bento-раскладки возвращает собственные коды ошибок отказов. В vStack ты писал спецификацию и контракт API до реализации. Это contract-first, назови его так.</p>`,
        traps: ['Как отдавать частично успешную пакетную операцию? (207 или 200 с поэлементными статусами)', 'PUT vs PATCH на практике'] },

      { id: 'graphql', q: 'REST vs GraphQL vs tRPC vs gRPC', tags: ['senior'],
        short: `<ul><li><b>REST</b> — просто, HTTP-кэш работает из коробки, но бывает over- и under-fetching и много запросов на экран.</li><li><b>GraphQL</b> — клиент сам выбирает поля, один запрос на экран, строгая схема. Минусы: кэширование сложнее (POST, нормализованный кэш на клиенте), N+1 в резолверах (лечится DataLoader), нужна защита от тяжёлых запросов (глубина и стоимость).</li><li><b>tRPC</b> — типобезопасные вызовы между TS-клиентом и TS-сервером без схемы. Подходит монорепе, где клиент и сервер свои.</li><li><b>gRPC</b> — бинарный Protobuf поверх HTTP/2, стриминг, кодогенерация. Для связи сервис-сервис; в браузере нужен прокси (gRPC-Web).</li></ul>` },
    ]},

    { title: 'Realtime, прокси, fetch', cards: [
      { id: 'ws-deep', q: 'WebSocket в продакшене: reconnect, heartbeat, масштаб', tags: ['senior'],
        short: `<p><b>Рукопожатие:</b> HTTP-запрос с <code>Upgrade: websocket</code>, ответ 101, дальше по тому же TCP идут фреймы.</p><p><b>Что пишешь сам:</b> переподключение с экспоненциальной задержкой и jitter; heartbeat (ping/pong), чтобы прокси не рвали «молчащее» соединение и чтобы замечать мёртвые; восстановление пропущенного после reconnect (последний id); очередь исходящих сообщений, пока сокет закрыт.</p><p><b>Масштаб:</b> sticky sessions, pub/sub между инстансами (Redis), лимиты соединений, авторизация при handshake (cookie или токен в первом сообщении, а не в URL).</p>`,
        mine: `<p>«Морской бой» в Grandbazar шёл через WebSocket/EventSource. Вспомни, как обрабатывались обрывы связи во время матча: это хорошая история про надёжность.</p>` },

      { id: 'proxy', q: 'Reverse proxy, балансировщик, CDN — кто что делает', tags: ['must'],
        short: `<p><b>Forward proxy</b> работает от имени клиента (корпоративный прокси). <b>Reverse proxy</b> — от имени сервера (nginx перед приложением): TLS-терминация, сжатие, раздача статики, кэш, роутинг по хосту и пути, rate limit.</p><p><b>Балансировщик:</b> L4 (TCP, быстро, не видит HTTP) или L7 (видит HTTP: роутинг по пути и заголовкам, sticky по cookie). Алгоритмы: round robin, least connections, хэш по IP. Health checks выводят больные инстансы из ротации.</p><p><b>CDN</b> — кэш на edge-узлах рядом с пользователем: статика, иногда HTML, защита от DDoS.</p>`,
        lang: 'nginx',
        code: `server {
  listen 443 ssl;
  http2 on;
  server_name ~^(?<tenant>.+)\\.example\\.com$;

  location /_next/static/ {
    proxy_pass http://app;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}`,
        traps: ['Почему за прокси <code>req.ip</code> показывает адрес прокси (настройка trust proxy)'] },

      { id: 'fetch', q: 'fetch на практике: ошибки, таймауты, axios', tags: ['must'],
        short: `<p><code>fetch</code> <b>не реджектит промис на 4xx/5xx</b> — только на сетевую ошибку или отмену. Проверяй <code>res.ok</code> сам. Таймаута по умолчанию нет — нужен <code>AbortSignal.timeout</code>. Тело читается один раз (<code>res.json()</code>), для повторного чтения — <code>res.clone()</code>.</p><p><b>axios</b> даёт interceptors (подставить токен, обновить его на 401), автоматический JSON, reject на не-2xx, прогресс загрузки. Аналог на fetch — своя обёртка.</p>`,
        lang: 'ts',
        code: `async function api<T>(path: string, init?: RequestInit): Promise<T> {
  const res = await fetch('/api' + path, {
    ...init,
    headers: { 'Content-Type': 'application/json', ...init?.headers },
    signal: init?.signal ?? AbortSignal.timeout(10_000),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => null);
    throw new HttpError(res.status, body?.title ?? res.statusText);
  }
  return res.status === 204 ? (undefined as T) : res.json();
}`,
        traps: ['Как сделать refresh токена без гонки, когда 5 запросов одновременно получили 401? (один общий промис refresh, остальные ждут его)'] },

      { id: 'oauth-flow', q: 'OAuth 2.0 Authorization Code + PKCE по шагам', tags: ['senior'],
        short: `<ol><li>Клиент генерирует случайный <code>code_verifier</code> и считает <code>code_challenge</code> = SHA-256 от него.</li><li>Редирект на провайдера с <code>client_id</code>, <code>redirect_uri</code>, <code>scope</code>, <code>state</code> (защита от CSRF) и <code>code_challenge</code>.</li><li>Пользователь входит и соглашается. Провайдер редиректит обратно с одноразовым <code>code</code>.</li><li>Клиент меняет <code>code</code> + <code>code_verifier</code> на токены. Перехваченный code без verifier бесполезен.</li><li>Access token — для API, refresh — для обновления, <code>id_token</code> (OIDC) — кто пользователь.</li></ol>`,
        traps: ['Почему implicit flow больше не рекомендуют (токен в URL)', 'Где хранить токены в SPA (BFF-паттерн: токены на сервере, браузеру — HttpOnly cookie сессии)'] },
    ]},
  ],
};

const BROWSER = {
  id: 'browser',
  stage: 2,
  title: 'Браузер',
  kicker: 'Этап 2 · глубоко',
  intro: 'Как устроен браузер изнутри и его API: процессы и потоки, observers, воркеры, анимации и кадры, история и роутинг, камера, безопасность и отладка производительности.',
  sections: [
    { title: 'Устройство', cards: [
      { id: 'arch', q: 'Из каких процессов и потоков состоит браузер?', tags: ['senior'],
        short: `<p><b>Процессы</b> (Chromium):</p><ul><li><b>browser</b> — UI, вкладки, права;</li><li><b>renderer</b> — отдельный на сайт (site isolation, защита от Spectre);</li><li><b>GPU</b>;</li><li><b>network</b> и утилиты.</li></ul><p>Внутри renderer есть <b>main thread</b> (JS, стили, layout, paint) и <b>compositor thread</b> (собирает слои, скроллит, анимирует transform и opacity). Поэтому CSS-анимация на transform плавная, даже когда JS занят, а анимация через <code>top</code>/<code>left</code> — нет.</p>`,
        traps: ['Почему тяжёлая вкладка не роняет остальные', 'Почему <code>wheel</code>-обработчик без <code>passive</code> тормозит скролл (композитор вынужден ждать main thread)'] },

      { id: 'frame', q: 'Кадр за 16 мс: requestAnimationFrame и requestIdleCallback', tags: ['must'],
        short: `<p>При 60 Гц на кадр есть ~16,7 мс: обработка ввода → таймеры → <b>rAF</b> → стили → layout → paint → composite. Если JS занял больше, кадр пропускается, и интерфейс дёргается.</p><p><code>requestAnimationFrame(cb)</code> — колбэк прямо перед отрисовкой кадра: место для JS-анимаций и пакетных записей в DOM. В фоновой вкладке он не вызывается. <code>requestIdleCallback</code> — когда браузеру нечего делать: для фоновой некритичной работы.</p>`,
        lang: 'js',
        code: `function animate(el, duration) {
  const start = performance.now();
  function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - (1 - t) ** 3;
    el.style.transform = 'rotate(' + eased * 720 + 'deg)';
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}`,
        mine: `<p>Canvas-движок колеса фортуны (разгон, торможение, анимация остановки) — сюда. Будь готов рассказать, как считается замедление и почему анимация идёт через rAF, а не setInterval. Сверь с кодом.</p>`,
        traps: ['Почему setInterval для анимации плох (не синхронизирован с кадром, работает в фоне)', 'Почему время в анимации берут из аргумента rAF, а не считают кадры (частота экрана бывает 120 Гц)'] },

      { id: 'layers', q: 'Слои композитинга и will-change', tags: ['senior'],
        short: `<p>Браузер может вынести элемент в отдельный <b>слой</b>, который рисуется один раз и дальше двигается GPU. Это происходит при <code>transform</code>-анимации, <code>will-change: transform</code>, <code>video</code>, <code>canvas</code> и наложении на другой слой.</p><p>Слишком много слоёв — расход памяти (особенно на мобилках) и долгий composite. <code>will-change</code> ставят точечно и ненадолго, перед анимацией. Посмотреть слои — DevTools → Layers, Rendering → Layer borders.</p>` },
    ]},

    { title: 'API браузера', cards: [
      { id: 'observers', q: 'IntersectionObserver, ResizeObserver, MutationObserver', tags: ['must'],
        short: `<ul><li><b>IntersectionObserver</b> — элемент вошёл или вышел из области видимости: lazy-загрузка, бесконечная лента, аналитика показов. Не нужно слушать scroll и звать <code>getBoundingClientRect</code>.</li><li><b>ResizeObserver</b> — изменился размер элемента (а не окна): адаптивные компоненты, графики, которые перерисовываются под контейнер.</li><li><b>MutationObserver</b> — изменения DOM (дети, атрибуты, текст): интеграция со сторонним кодом, редакторы. Колбэки — микрозадачи.</li></ul>`,
        lang: 'js',
        code: `const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (e.isIntersecting) {
      loadMore();
      io.unobserve(e.target);
    }
  }
}, { rootMargin: '200px' });
io.observe(sentinel);`,
        mine: `<p>Графики vStack с общей осью — вероятное место для ResizeObserver: график под ширину контейнера.</p>` },

      { id: 'workers', q: 'Web Workers и Service Workers — в чём разница?', tags: ['must', 'senior'],
        short: `<p><b>Web Worker</b> — отдельный поток для тяжёлых вычислений: парсинг, обработка изображений, криптография. Без доступа к DOM, общение через <code>postMessage</code> (структурное клонирование) или transferable-объекты (передача <code>ArrayBuffer</code> без копирования).</p><p><b>Service Worker</b> — программируемый прокси между страницей и сетью: перехватывает <code>fetch</code>, кэширует (офлайн, PWA), принимает push. Живёт отдельно от вкладки, работает только по HTTPS. Жизненный цикл: install → waiting → activate.</p>`,
        deep: `<p><b>Стратегии кэша в SW:</b> cache-first (статика), network-first (API, HTML), stale-while-revalidate (свежесть + скорость).</p><p>Главная боль — обновление: новый SW ждёт, пока закроются все вкладки со старым, или вызывает <code>skipWaiting()</code>. Пользователь может застрять на старой версии сайта.</p>`,
        traps: ['SharedWorker — один воркер на несколько вкладок', 'Сколько стоит postMessage большого объекта и как не копировать'] },

      { id: 'history', q: 'Как работает роутинг в SPA? History API', tags: ['must'],
        short: `<p><code>history.pushState(state, '', url)</code> меняет URL без перезагрузки и добавляет запись в историю. <code>replaceState</code> заменяет текущую запись. Кнопки «назад»/«вперёд» вызывают событие <code>popstate</code>, по нему роутер рендерит нужную страницу. pushState сам <code>popstate</code> не вызывает.</p><p>Серверу нужен fallback: любой путь → <code>index.html</code>, иначе прямой заход на <code>/orders/42</code> даст 404. Hash-роутинг (<code>#/orders</code>) работает без сервера, но с некрасивыми URL и плохо дружит с SEO.</p>`,
        mine: `<p>Синхронизация фильтров таблиц с URL — это <code>replaceState</code> при вводе (чтобы не засорять историю) и <code>pushState</code> при осмысленной смене страницы. Сверь, как сделано у тебя.</p>` },

      { id: 'media', q: 'Доступ к камере в браузере', tags: ['verify'],
        short: `<p><code>navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })</code> работает только в secure context (HTTPS или localhost) и после разрешения пользователя. Поток выводится в <code>&lt;video&gt;</code>, кадры снимаются через <code>canvas</code> и отдаются распознавателю.</p><p>Для распознавания кодов есть нативный <code>BarcodeDetector</code> (поддерживается не везде) или JS/WASM-библиотеки (ZXing и аналоги). Обязательно останавливать треки при уходе со страницы: <code>stream.getTracks().forEach(t =&gt; t.stop())</code>.</p>`,
        mine: `<p>Сканирование штрих- и QR-кодов камерой в Grandbazar — твоя фича. Вспомни библиотеку и как обрабатывался отказ в доступе к камере.</p>`,
        traps: ['iOS Safari: <code>playsinline</code> у video, иначе откроется полноэкранный плеер', 'Почему внутри iframe камера может быть запрещена (<code>allow="camera"</code>, Permissions-Policy)'] },
    ]},

    { title: 'Безопасность и отладка', cards: [
      { id: 'br-security', q: 'Безопасность в браузере: SOP, iframe, postMessage', tags: ['must'],
        short: `<ul><li><b>Same-Origin Policy</b> — скрипт не читает DOM, cookie и ответы чужого origin.</li><li><b>iframe:</b> атрибут <code>sandbox</code> ограничивает встраиваемое; защита <b>от</b> встраивания твоего сайта (clickjacking) — <code>Content-Security-Policy: frame-ancestors 'self'</code>.</li><li><b>postMessage</b> между окнами: при отправке указывай точный <code>targetOrigin</code>, при приёме проверяй <code>event.origin</code>, иначе любой сайт может слать тебе команды.</li><li><code>rel="noopener"</code> у ссылок с <code>target="_blank"</code> (сейчас по умолчанию).</li><li><b>Trusted Types</b> — запрещают передавать в <code>innerHTML</code> сырые строки.</li></ul>`,

const TSDEEP = {
  id: 'ts',
  stage: 3,
  title: 'TypeScript',
  kicker: 'Этап 3 · фронтенд-специфика',
  intro: 'Система типов глубже utility types: структурная типизация, вывод и сужение, продвинутые generics, conditional и template literal типы, вариантность, декларации, tsconfig и TS в React.',
  sections: [
    { title: 'Система типов', cards: [
      { id: 'structural', q: 'Структурная типизация — что это значит на практике?', tags: ['must'],
        short: `<p>TS сравнивает типы по <b>форме</b>, а не по имени: объект подходит под тип, если у него есть все нужные свойства нужных типов. Два разных интерфейса с одинаковыми полями взаимозаменяемы. В номинальных языках (Java, C#) было бы иначе.</p><p>Исключение — <b>excess property check</b>: объектный литерал, переданный напрямую, не может содержать лишних полей. Тот же объект из переменной — может.</p>`,
        lang: 'ts',
        code: `type Point = { x: number; y: number };
const p3 = { x: 1, y: 2, z: 3 };
const a: Point = p3;                  // ок: структурно подходит
const b: Point = { x: 1, y: 2, z: 3 }; // ошибка: лишнее свойство в литерале

// branded type — эмуляция номинальной типизации
type UserId = string & { readonly __brand: 'UserId' };
const asUserId = (s: string) => s as UserId;
function loadUser(id: UserId) {}
loadUser('abc');            // ошибка
loadUser(asUserId('abc'));  // ок`,
        traps: ['Зачем branded types: не перепутать UserId и OrderId, рубли и копейки'] },

      { id: 'inference', q: 'Вывод типов, widening, as const и satisfies', tags: ['must'],
        short: `<p>TS выводит типы сам. <code>let x = 'a'</code> расширяется (widening) до <code>string</code>, <code>const x = 'a'</code> остаётся литералом <code>'a'</code>. <code>as const</code> делает объект или массив глубоко readonly с литеральными типами.</p><p><code>satisfies</code> проверяет, что значение соответствует типу, но <b>сохраняет</b> более точный выведенный тип. <code>as</code> — утверждение «поверь мне», оно отключает проверку.</p>`,
        lang: 'ts',
        code: `const SIZES = ['s', 'm', 'l'] as const;
type Size = typeof SIZES[number]; // 's' | 'm' | 'l'

const routes = {
  home: '/',
  order: '/orders/:id',
} satisfies Record<string, string>;
routes.order; // тип '/orders/:id', а не просто string

const bad = {} as User; // компилятор молчит, в рантайме — пустой объект`,
        traps: ['Почему <code>as const</code> + <code>typeof X[number]</code> часто лучше enum'] },

      { id: 'unions', q: 'Discriminated unions: моделируем состояния', tags: ['must', 'senior'],
        short: `<p>Объединение вариантов с общим литеральным полем-дискриминантом (<code>status</code>, <code>kind</code>). После проверки дискриминанта TS сужает тип, и доступны только поля этого варианта. Так «невозможные состояния» становятся непредставимыми.</p>`,
        lang: 'ts',
        code: `// плохо: isLoading=true и error одновременно — валидно с точки зрения типов
type Bad<T> = { isLoading: boolean; data?: T; error?: Error };

// хорошо
type Remote<T> =
  | { status: 'idle' }
  | { status: 'loading' }
  | { status: 'success'; data: T }
  | { status: 'error'; error: Error };

function render(r: Remote<User>) {
  switch (r.status) {
    case 'success': return r.data.name;  // data точно есть
    case 'error': return r.error.message;
    default: return null;
  }
}`,
        mine: `<p>Скретч-карта со статусами сессии <code>new → finished</code> и механики лояльности — естественное место для discriminated union на фронте: тип сессии по статусу.</p>` },

      { id: 'keyof', q: 'keyof, typeof, indexed access и template literal types', tags: ['must'],
        short: `<ul><li><code>keyof T</code> — union ключей.</li><li><code>typeof value</code> в позиции типа — тип значения.</li><li><code>T['field']</code> — тип поля (indexed access), <code>T[number]</code> — тип элемента массива.</li><li><b>Template literal types</b> собирают строковые типы: <code>\`on\${Capitalize&lt;E&gt;}\`</code>.</li></ul>`,
        lang: 'ts',
        code: `const config = { api: '/api', retries: 3 };
type Config = typeof config;          // { api: string; retries: number }
type Keys = keyof Config;             // 'api' | 'retries'
type Retries = Config['retries'];     // number

type EventName = 'click' | 'change';
type Handler = \`on\${Capitalize<EventName>}\`; // 'onClick' | 'onChange'

type CssVar = \`--\${string}\`;
const v: CssVar = '--color-accent';` },
    ]},

    { title: 'Продвинутые типы', cards: [
      { id: 'conditional', q: 'Conditional types и infer — с примерами', tags: ['senior'],
        short: `<p><code>T extends U ? X : Y</code> — это if на уровне типов. По union он <b>дистрибутивен</b>: применяется к каждому члену по отдельности. Чтобы отключить дистрибуцию, оборачивай в кортеж <code>[T] extends [U]</code>.</p><p><code>infer</code> «вытаскивает» часть типа внутри условия: тип возвращаемого значения, элемента массива, результата промиса.</p>`,
        lang: 'ts',
        code: `type Unwrap<T> = T extends Promise<infer R> ? Unwrap<R> : T;
type A = Unwrap<Promise<Promise<number>>>; // number

type ElementOf<T> = T extends readonly (infer E)[] ? E : never;

type NonNull<T> = T extends null | undefined ? never : T;
type B = NonNull<string | null>; // string — сработала дистрибуция

type IsString<T> = [T] extends [string] ? true : false;`,
        traps: ['Как получить тип пропсов компонента? <code>React.ComponentProps&lt;typeof Button&gt;</code>'] },

      { id: 'mapped', q: 'Mapped types и модификаторы', tags: ['senior'],
        short: `<p><code>{ [K in keyof T]: … }</code> — пройти по ключам и построить новый тип. Модификаторы <code>readonly</code> и <code>?</code> можно добавлять (<code>+</code>) и снимать (<code>-</code>). Через <code>as</code> ключи переименовывают и фильтруют.</p>`,
        lang: 'ts',
        code: `type Mutable<T> = { -readonly [K in keyof T]: T[K] };

type Getters<T> = {
  [K in keyof T as \`get\${Capitalize<string & K>}\`]: () => T[K];
};
type G = Getters<{ name: string }>; // { getName: () => string }

type PickByType<T, V> = {
  [K in keyof T as T[K] extends V ? K : never]: T[K];
};

type DeepPartial<T> = {
  [K in keyof T]?: T[K] extends object ? DeepPartial<T[K]> : T[K];
};`,
        mine: `<p>155 токенов ui-baza на CSS-переменных — пример, где mapped и template literal types дают типобезопасные ключи токенов. Если у тебя этого нет, это хорошая идея, которую можно предложить на собесе.</p>` },

      { id: 'variance', q: 'Вариантность и типы функций', tags: ['senior'],
        short: `<p>Вариантность отвечает на вопрос: если <code>Dog</code> — подтип <code>Animal</code>, то как соотносятся «обёртки» над ними? <b>Ковариантность</b> — в ту же сторону: <code>Dog[]</code> годится там, где ждут <code>Animal[]</code>, и функция, возвращающая <code>Dog</code>, годится там, где ждут возвращающую <code>Animal</code>. <b>Контравариантность</b> — в обратную сторону, так ведут себя параметры: функция, принимающая <code>Animal</code>, годится туда, где ждут функцию от <code>Dog</code> (она справится с любым животным, значит, и с собакой), но не наоборот.</p><p>С <code>strictFunctionTypes</code> параметры функций проверяются контравариантно, а параметры <b>методов</b> (синтаксис <code>method(x): void</code>) — бивариантно, ради совместимости. Это дыра в типобезопасности.</p>`,
        lang: 'ts',
        code: `type Handler<T> = (x: T) => void;
const animalHandler: Handler<Animal> = (a) => {};
const dogHandler: Handler<Dog> = animalHandler;   // ок
const back: Handler<Animal> = dogHandler;          // ошибка

// массивы ковариантны — и это небезопасно
const dogs: Dog[] = [];
const animals: Animal[] = dogs;
animals.push(new Cat()); // компилятор пропустит`,
        traps: ['Модификаторы <code>in</code>/<code>out</code> у параметров generic (TS 4.7+)'] },

      { id: 'overloads', q: 'Перегрузки функций и generic-ограничения', tags: [],
        short: `<p>Перегрузки — несколько сигнатур и одна реализация. Они нужны, когда тип результата зависит от аргументов так, что generic это выражает плохо. Часто их можно заменить generic с conditional type.</p>`,
        lang: 'ts',
        code: `function parse(input: string): object;
function parse(input: string, raw: true): string;
function parse(input: string, raw?: boolean) {
  return raw ? input : JSON.parse(input);
}

function merge<T extends object, U extends object>(a: T, b: U): T & U {

    { title: 'Проект и экосистема', cards: [
      { id: 'tsconfig', q: 'Какие флаги tsconfig важны и почему?', tags: ['must'],
        short: `<ul><li><code>strict</code> — включает весь набор строгих проверок (strictNullChecks, noImplicitAny, strictFunctionTypes…).</li><li><code>noUncheckedIndexedAccess</code> — <code>arr[i]</code> и <code>record[key]</code> получают тип <code>T | undefined</code>. Сильно ловит баги.</li><li><code>exactOptionalPropertyTypes</code> — «поле отсутствует» и «поле равно undefined» перестают быть одним и тем же.</li><li><code>moduleResolution: "bundler"</code> — резолв модулей как у Vite и Next.</li><li><code>isolatedModules</code>/<code>verbatimModuleSyntax</code> — совместимость с транспиляцией по одному файлу (esbuild, swc): <code>import type</code> обязателен.</li><li><code>skipLibCheck</code> — не проверять .d.ts в node_modules (быстрее).</li><li><code>paths</code> — алиасы импортов.</li></ul>`,
        traps: ['TS не трансформирует <code>paths</code> в рантайме — алиасы должен понимать и сборщик', 'Почему Vite/esbuild не проверяют типы (только вырезают; проверка — отдельно через <code>tsc --noEmit</code>)'] },

      { id: 'dts', q: 'Файлы деклараций, declare module, module augmentation', tags: ['senior'],
        short: `<p><code>.d.ts</code> содержит только типы без кода. Библиотеки поставляют их сами (поле <code>types</code> в package.json) или через <code>@types/*</code>.</p><ul><li><code>declare module 'x'</code> — описать нетипизированный модуль или импорты ассетов (<code>*.svg</code>, <code>*.module.css</code>).</li><li><b>Module augmentation</b> — дописать типы чужого модуля через declaration merging интерфейсов.</li><li><code>declare global</code> — расширить глобальные типы (<code>Window</code>).</li></ul>`,
        lang: 'ts',

      { id: 'ts-react', q: 'TypeScript в React: пропсы, события, generic-компоненты', tags: ['must'],
        short: `<ul><li>Пропсы — <code>type Props = { … }</code>, дети — <code>React.ReactNode</code>.</li><li>Расширить нативные атрибуты — <code>React.ComponentPropsWithoutRef&lt;'button'&gt;</code>.</li><li>События — <code>React.ChangeEvent&lt;HTMLInputElement&gt;</code>, <code>React.MouseEvent</code>.</li><li><b>Generic-компонент</b> (таблица, select) — <code>function Table&lt;Row&gt;(props: TableProps&lt;Row&gt;)</code>: тип строки выводится из <code>data</code>.</li><li><b>Polymorphic</b> <code>as</code>-проп типизируется сложно, поэтому многие выбирают <code>asChild</code>.</li></ul>`,

// key: 'foo' — ошибка компиляции`,
        mine: `<p>Таблицы на compound-компонентах и базовом сторе, ui-baza с <code>asChild</code> — будь готов показать, как типизирован хотя бы один из них.</p>` },

      { id: 'runtime-validation', q: 'Почему типов TS мало и что делать с внешними данными?', tags: ['must'],

const CSSDEEP = {
  id: 'css',
  stage: 3,
  title: 'CSS',
  kicker: 'Этап 3 · фронтенд-специфика',
  intro: 'Модель блоков, позиционирование и stacking context, единицы и адаптив, container queries, современные селекторы, кастомные свойства, анимации, шрифты и архитектура стилей дизайн-системы.',
  sections: [
    { title: 'Основы, которые спрашивают всегда', cards: [
      { id: 'box', q: 'Box model, box-sizing, margin collapse', tags: ['must'],
        short: `<p>Блок состоит из content → padding → border → margin. При <code>box-sizing: content-box</code> (по умолчанию) <code>width</code> задаёт только контент, а padding и border добавляются сверху. При <code>border-box</code> width включает padding и border, поэтому все ставят его глобально.</p><p><b>Схлопывание margin:</b> вертикальные margin соседних блоков и родителя с первым или последним ребёнком сливаются в больший из них. Не схлопываются во flex/grid, при padding или border у родителя, в новом BFC.</p>`,
        traps: ['Что создаёт BFC: <code>display: flow-root</code>, overflow не visible, flex/grid-элементы, float, absolute', 'Почему <code>gap</code> во flex/grid лучше margin между элементами'] },

      { id: 'position', q: 'position, stacking context и почему z-index «не работает»', tags: ['must'],
        short: `<ul><li><code>static</code> — обычный поток.</li><li><code>relative</code> — смещение от своего места, место в потоке сохраняется.</li><li><code>absolute</code> — от ближайшего позиционированного предка, выпадает из потока.</li><li><code>fixed</code> — от viewport.</li><li><code>sticky</code> — ведёт себя как relative, пока не достигнет порога, потом прилипает внутри своего контейнера.</li></ul><p><b>z-index работает только внутри своего stacking context.</b> Новый контекст создают: позиционирование + z-index, <code>opacity &lt; 1</code>, <code>transform</code>, <code>filter</code>, <code>isolation: isolate</code>, <code>will-change</code> и другие. Ребёнок с <code>z-index: 9999</code> не вылезет выше «дяди», если его родитель в контексте ниже.</p>`,
        deep: `<p><b>Подводные камни fixed:</b> <code>transform</code> или <code>filter</code> у предка делает его containing block, и fixed начинает позиционироваться от него. Поэтому модалки и тултипы рендерят в портал в <code>body</code>.</p><p><b>sticky «не липнет»</b>, когда у предка стоит <code>overflow: hidden/auto</code> или когда контейнер не выше самого элемента.</p>`,
        mine: `<p>Tooltip и DropdownMenu в ui-baza — вспомни, рендерятся ли они в портал и как решён z-index. Это частый вопрос к авторам UI-библиотек.</p>` },

      { id: 'centering', q: 'Как центрировать элемент? (все способы)', tags: ['must'],
        lang: 'css',
        short: `<p>Современный ответ — grid или flex на родителе. Абсолютное позиционирование с <code>inset: 0; margin: auto</code> подходит для оверлеев. Для строчного содержимого — <code>text-align</code>.</p>`,
        code: `.parent { display: grid; place-items: center; }

.parent { display: flex; justify-content: center; align-items: center; }

.child { position: absolute; inset: 0; margin: auto; width: 200px; height: 100px; }

.child { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

.block { margin-inline: auto; max-width: 65ch; }` },
    ]},

    { title: 'Адаптив и современный CSS', cards: [
      { id: 'units', q: 'Единицы: rem, em, %, vw, dvh, ch, clamp', tags: ['must'],
        short: `<ul><li><code>rem</code> — от размера шрифта корня: масштабируется вместе с пользовательской настройкой браузера, хорош для шрифтов и отступов.</li><li><code>em</code> — от шрифта текущего элемента (компаундится при вложенности).</li><li><code>%</code> — от родителя (для padding — от <b>ширины</b> родителя).</li><li><code>vw</code>/<code>vh</code> — от viewport. На мобилках <code>100vh</code> прыгает из-за адресной строки, поэтому есть <code>dvh</code>, <code>svh</code>, <code>lvh</code>.</li><li><code>ch</code> — ширина «0», удобно для ширины текста.</li><li><code>clamp(min, preferred, max)</code> — fluid-типографика.</li><li><code>cqi</code> — от контейнера.</li></ul>`,
        lang: 'css',
        code: `h1 { font-size: clamp(1.75rem, 1.2rem + 2.5vw, 3rem); }
.hero { min-height: 100dvh; }

      { id: 'custom-props', q: 'CSS custom properties: наследование, @property, темы', tags: ['must', 'senior'],
        short: `<p>Кастомные свойства <b>наследуются</b> и вычисляются в рантайме. Их можно переопределить на любом поддереве (тема для секции), менять из JS (<code>el.style.setProperty</code>) и использовать с фолбэком <code>var(--x, 8px)</code>.</p><p><code>@property</code> регистрирует тип, начальное значение и наследование. После этого переменную можно анимировать (например, градиент), и браузер валидирует значение.</p>`,
        lang: 'css',
        code: `:root {

        short: `<p><b>Transition</b> — плавный переход между двумя состояниями (hover, класс). <b>@keyframes</b> — многошаговая анимация с повторами.</p><p>Анимируй <code>transform</code> и <code>opacity</code>: они работают на композиторе без layout и paint. Анимация <code>width</code>, <code>top</code>, <code>height</code> вызывает reflow на каждый кадр. Всегда уважай <code>prefers-reduced-motion</code>.</p><p>Новое: <b>View Transitions API</b> (анимации переходов между состояниями и страницами), <code>@starting-style</code> (анимация появления из <code>display: none</code>), scroll-driven animations.</p>`,

        short: `<p><b>FOIT</b> — текст невидим, пока грузится шрифт. <b>FOUT</b> — сначала фолбэк, потом подмена со скачком. <code>font-display: swap</code> даёт FOUT (текст виден сразу), <code>optional</code> использует шрифт, только если он уже в кэше.</p><p>Против скачка — <code>size-adjust</code> и <code>ascent-override</code> у фолбэка (next/font делает это сам). <code>preload</code> для критичного начертания, сабсеты (только кириллица и латиница), <b>variable fonts</b> — один файл на все веса.</p>` },

        mine: `<p>Механизм «без мигания» у тебя уже есть в мультитенантности: тема клиента приходит через SSR. Тёмная тема — та же задача, только источник другой.</p>` },

};

        short: `<p><b>SQL injection</b> — данные склеиваются в текст запроса. Лечится только <b>параметризованными запросами</b> (prepared statements), ORM делает это сам, кроме raw-методов со склейкой строк.</p><p><b>NoSQL injection в Mongo</b> — в фильтр вместо строки приходит объект с оператором: <code>{ "password": { "$ne": null } }</code>. Лечится валидацией типов DTO (ValidationPipe + whitelist), опцией <code>sanitizeFilter</code> в mongoose, запретом ключей с <code>$</code>.</p><p><b>Command injection</b> — пользовательский ввод попадает в shell. Не используй <code>exec</code> со строкой, передавай аргументы массивом (<code>execFile</code>).</p>`,

        lang: 'ts',
        code: `// fixed window на Redis
async function allow(key: string, limit: number, windowSec: number) {

}`,

        short: `<p><b>Слоистая:</b> controller → service → repository. Просто, но бизнес-логика легко «протекает» в контроллеры и ORM.</p><p><b>Чистая / гексагональная (ports &amp; adapters):</b> в центре домен и use cases, которые не знают о фреймворке, БД и HTTP. Наружу торчат <b>порты</b> (интерфейсы), снаружи их реализуют <b>адаптеры</b> (Mongo-репозиторий, HTTP-контроллер, очередь). Зависимости направлены <b>внутрь</b>.</p><p>Выигрыш — тестируемость домена без инфраструктуры и заменяемость адаптеров. Цена — больше кода и абстракций. Для CRUD это часто оверкилл.</p>`,

        short: `<ul><li><b>Ubiquitous language</b> — общий словарь бизнеса и кода: одно понятие — одно имя везде.</li><li><b>Bounded context</b> — граница, внутри которой термин значит одно. «Приз» в каталоге и в механике — разные модели.</li><li><b>Aggregate</b> — кластер объектов, изменяемых атомарно через корень. Граница агрегата = граница транзакции.</li><li><b>Entity</b> (с идентичностью) vs <b>value object</b> (по значению: деньги, адрес).</li><li><b>Domain events</b> — «что произошло» для связи между контекстами.</li></ul>`,

      { id: 'monolith', q: 'Монолит, модульный монолит, микросервисы', tags: ['must', 'senior'],
        short: `<p><b>Монолит:</b> один деплой, простые транзакции и отладка. Со временем растёт связанность и замедляются релизы.</p><p><b>Модульный монолит:</b> один деплой, но жёсткие границы модулей с публичным API. Часто это лучший старт.</p><p><b>Микросервисы:</b> независимый деплой и масштабирование, разные команды и технологии. Цена — распределённые транзакции, сетевые сбои, observability, версионирование контрактов, операционная сложность. Оправданы, когда много команд и разные профили нагрузки, а не потому что модно.</p>`,

      { id: 'events', q: 'Событийная архитектура, outbox, eventual consistency', tags: ['senior'],

    { title: 'JS-утилиты и полифиллы', cards: [
      { id: 'emitter', q: 'Напиши EventEmitter (on, off, once, emit)', tags: ['must'],
        short: `<p>Map «событие → Set обработчиков». <code>once</code> оборачивает обработчик и снимает обёртку после первого вызова. При emit перебирай копию набора: обработчик может отписаться прямо во время вызова.</p>`,
        lang: 'ts',
        code: `type Handler = (...args: any[]) => void;

class Emitter {
  private map = new Map<string, Set<Handler>>();

  on(event: string, fn: Handler) {
    if (!this.map.has(event)) this.map.set(event, new Set());
    this.map.get(event)!.add(fn);
    return () => this.off(event, fn);
  }

  off(event: string, fn: Handler) {
    this.map.get(event)?.delete(fn);
  }

  once(event: string, fn: Handler) {
    const wrap: Handler = (...args) => { this.off(event, wrap); fn(...args); };
    return this.on(event, wrap);
  }

  emit(event: string, ...args: unknown[]) {
    for (const fn of [...(this.map.get(event) ?? [])]) fn(...args);
  }
}`,

        short: `<p>Сначала <code>Object.is</code> для примитивов и одинаковых ссылок. Дальше оба значения должны быть объектами одного типа (массив против объекта — false), с одинаковым набором ключей, и рекурсивно равными по каждому ключу. Отдельно — Date, и, если просят, Map/Set и циклы.</p>`,
        lang: 'js',
        code: `function deepEqual(a, b) {
  if (Object.is(a, b)) return true;
  if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (a instanceof Date && b instanceof Date) return a.getTime() === b.getTime();
  const ka = Object.keys(a);
  const kb = Object.keys(b);
  if (ka.length !== kb.length) return false;

        lang: 'js',
        code: `const flat = (arr, depth = Infinity) =>

function flattenObj(obj, prefix = '', out = {}) {
  for (const [k, v] of Object.entries(obj)) {

const toPath = (p) => p.replace(/\\[(\\w+)\\]/g, '.$1').split('.').filter(Boolean);

        lang: 'ts',
        code: `async function mapLimit<T, R>(items: T[], limit: number, fn: (x: T, i: number) => Promise<R>) {
  const results = new Array<R>(items.length);
  let next = 0;
  async function worker() {
    while (next < items.length) {
      const i = next++;
      results[i] = await fn(items[i], i);
    }

        lang: 'ts',
        code: `class LRU<K, V> {
  private map = new Map<K, V>();
  constructor(private capacity: number) {}

  get(key: K): V | undefined {
    if (!this.map.has(key)) return undefined;
    const v = this.map.get(key)!;
    this.map.delete(key);
    this.map.set(key, v);
    return v;
  }

  set(key: K, value: V) {
    this.map.delete(key);
    this.map.set(key, value);
    if (this.map.size > this.capacity) this.map.delete(this.map.keys().next().value!);
  }
}`,

        short: `<p>Если в наивном решении есть вложенный цикл «найти пару», почти всегда помогает Map: один проход, O(n) по времени и памяти.</p>`,

function groupAnagrams(words) {

  for (const w of words) {

        lang: 'js',
        code: `function isPalindrome(s) {
  const t = s.toLowerCase().replace(/[^a-zа-яё0-9]/g, '');
  for (let l = 0, r = t.length - 1; l < r; l++, r--) if (t[l] !== t[r]) return false;

function longestUniqueSubstring(s) {

  let best = 0;
  for (let l = 0, r = 0; r < s.length; r++) {

        short: `<p>На фронте дерево везде: DOM, меню, комментарии, категории, файловая система. <b>DFS</b> — рекурсия или стек: найти узел, посчитать глубину, отрендерить вложенность. <b>BFS</b> — очередь: обход по уровням, кратчайший путь в невзвешенном графе. Частая задача: построить дерево из плоского списка с <code>parentId</code> за O(n) через Map.</p>`,
        lang: 'js',
        code: `function buildTree(items) {
  const byId = new Map(items.map(i => [i.id, { ...i, children: [] }]));
  const roots = [];
  for (const node of byId.values()) {
    const parent = byId.get(node.parentId);
    (parent ? parent.children : roots).push(node);
  }
  return roots;
}

function findPath(node, id, path = []) {
  path.push(node.id);
  if (node.id === id) return path;
  for (const c of node.children) {
    const res = findPath(c, id, path);
    if (res) return res;
  }
  path.pop();
  return null;
}

function levels(root) {
  const out = [];
  let queue = [root];
  while (queue.length) {
    out.push(queue.map(n => n.id));
    queue = queue.flatMap(n => n.children);
  }
  return out;
}` },

        lang: 'js',
        code: `function countIslands(grid) {
  const h = grid.length, w = grid[0]?.length ?? 0;
  let count = 0;
  const sink = (r, c) => {
    if (r < 0 || c < 0 || r >= h || c >= w || grid[r][c] !== 1) return;
    grid[r][c] = 0;
    sink(r + 1, c); sink(r - 1, c); sink(r, c + 1); sink(r, c - 1);
  };
  for (let r = 0; r < h; r++)
    for (let c = 0; c < w; c++)
      if (grid[r][c] === 1) { count++; sink(r, c); }
  return count;
}

const rotate = (m) => m[0].map((_, c) => m.map(row => row[c]).reverse());`,

      { id: 'stl', q: 'Контейнеры STL: сложность и инвалидация итераторов', tags: ['must'],

const PLAIN = {
"express-equality": "Тройное равно спрашивает «это одно и то же?» и ничего не подгоняет: число 1 и строка «1» для него разные. Двойное равно сначала пытается привести оба значения к общему виду и только потом сравнивает, отсюда сюрпризы вроде пустого массива, равного false. Поэтому в коде пишут тройное. А типы — это просто виды значений: семь «простых» (строка, число, булево и так далее) и объект, в который входят массивы и функции.",
"express-closure": "Функция носит с собой «рюкзак» с переменными, которые были вокруг неё в момент создания. Даже когда внешняя функция давно отработала, внутренняя по-прежнему видит и меняет эти переменные. Так делают счётчики, приватные данные и отложенные вызовы: значение спрятано в рюкзаке, и снаружи до него не добраться.",
"express-this": "this — это «кто вызвал функцию». Одна и та же функция в разных вызовах получает разный this: смотри, что стоит слева от точки в момент вызова. Если оторвать метод от объекта и вызвать отдельно, слева ничего нет, и this теряется. Стрелочная функция своего this не имеет вообще: она берёт его из места, где написана, и поэтому не теряет.",
"express-proto": "У объекта есть «родитель», у которого он одалживает то, чего нет у него самого. Просишь у объекта метод: сначала он ищет у себя, потом у родителя, потом у родителя родителя — и так до конца цепочки. Поэтому у любого массива есть map, хотя в самом массиве его нет: он лежит у общего родителя всех массивов. Слово class — просто удобная запись этой же схемы.",
